<!DOCTYPE html>
<html lang="en">
<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
    <meta charset="UTF-8">
    <title>Pixel Quest — 16-Bit Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f111a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #2a2d3a;
            border-radius: 4px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #70c5ff;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <canvas id="game" width="960" height="540"></canvas>
    <script>
        'use strict';

        // ========== CANVAS & CONTEXT ==========
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = 960,
            H = 540;

        // ========== CONSTANTS ==========
        const GROUND_Y = 480;
        const TILE = 32;
        const MOVE_SPEED = 4.2;
        const ACCEL = 0.55;
        const FRICTION = 0.72;
        const GRAVITY = 0.52;
        const JUMP_FORCE = -12.2;
        const MAX_FALL = 11;
        const HERO_W = 28;
        const HERO_H = 44;

        // ========== LEVEL DATA ==========
        const level = {
            width: 6200,
            ground: [
                { x: -200, w: 1100 }, // screen 0
                { x: 1000, w: 320 }, { x: 1420, w: 400 },
                { x: 1920, w: 250 }, { x: 2280, w: 500 },
                { x: 2880, w: 350 }, { x: 3330, w: 420 },
                { x: 3850, w: 280 }, { x: 4230, w: 480 },
                { x: 4810, w: 400 }, { x: 5310, w: 900 },
            ],
            platforms: [
                { x: 320, y: 400, w: 120, h: 14 },
                { x: 650, y: 360, w: 100, h: 14 },
                { x: 1100, y: 380, w: 100, h: 14 },
                { x: 1550, y: 400, w: 130, h: 14 },
                { x: 2000, y: 380, w: 90, h: 14 },
                { x: 2420, y: 360, w: 110, h: 14 },
                { x: 2950, y: 390, w: 120, h: 14 },
                { x: 3450, y: 360, w: 100, h: 14 },
                { x: 3950, y: 380, w: 90, h: 14 },
                { x: 4320, y: 400, w: 120, h: 14 },
                { x: 4900, y: 370, w: 100, h: 14 },
                { x: 5450, y: 390, w: 110, h: 14 },
            ],
            movingPlatforms: [
                { startX: 1300, startY: 400, endX: 1450, endY: 400, w: 80, h: 14, speed: 0.8, phase: 0 },
                { startX: 2200, startY: 340, endX: 2200, endY: 440, w: 70, h: 14, speed: 0.6, phase: 1.2 },
                { startX: 3150, startY: 400, endX: 3300, endY: 400, w: 80, h: 14, speed: 0.9, phase: 2.1 },
                { startX: 4100, startY: 350, endX: 4200, endY: 420, w: 70, h: 14, speed: 0.7, phase: 0.5 },
                { startX: 5200, startY: 360, endX: 5300, endY: 360, w: 80, h: 14, speed: 0.6, phase: 3.0 },
            ],
            coins: [],
            enemies: [],
            flag: { x: 6050, y: GROUND_Y - 200 }
        };

        // Build coins manually
        function buildCoins() {
            const c = level.coins;
            // Screen 0
            c.push({ x: 340, y: 365 }, { x: 370, y: 365 }, { x: 400, y: 365 });
            c.push({ x: 670, y: 325 }, { x: 700, y: 325 });
            // Screen 1
            c.push({ x: 1120, y: 345 }, { x: 1150, y: 345 });
            c.push({ x: 1560, y: 365 }, { x: 1590, y: 365 }, { x: 1620, y: 365 });
            // Screen 2
            c.push({ x: 2020, y: 345 }, { x: 2050, y: 345 });
            c.push({ x: 2440, y: 325 }, { x: 2470, y: 325 }, { x: 2500, y: 325 });
            // Screen 3
            c.push({ x: 2970, y: 355 }, { x: 3000, y: 355 });
            c.push({ x: 3470, y: 325 }, { x: 3500, y: 325 });
            // Screen 4
            c.push({ x: 3970, y: 345 }, { x: 4000, y: 345 });
            c.push({ x: 4340, y: 365 }, { x: 4370, y: 365 });
            // Screen 5
            c.push({ x: 4920, y: 335 }, { x: 4950, y: 335 });
            c.push({ x: 5470, y: 355 }, { x: 5500, y: 355 }, { x: 5530, y: 355 });
            // High coins
            c.push({ x: 1300, y: 280 }, { x: 2200, y: 250 });
            c.push({ x: 3150, y: 300 }, { x: 4100, y: 260 });
        }

        function buildEnemies() {
            const e = level.enemies;
            // Each enemy: x, y, minX, maxX, alive
            e.push({ x: 250, y: GROUND_Y - 30, minX: 150, maxX: 500, alive: true });
            e.push({ x: 700, y: GROUND_Y - 30, minX: 550, maxX: 850, alive: true });
            e.push({ x: 1150, y: GROUND_Y - 30, minX: 1050, maxX: 1300, alive: true });
            e.push({ x: 1700, y: GROUND_Y - 30, minX: 1550, maxX: 1850, alive: true });
            e.push({ x: 2100, y: GROUND_Y - 30, minX: 2000, maxX: 2250, alive: true });
            e.push({ x: 2600, y: GROUND_Y - 30, minX: 2450, maxX: 2750, alive: true });
            e.push({ x: 3000, y: GROUND_Y - 30, minX: 2900, maxX: 3200, alive: true });
            e.push({ x: 3550, y: GROUND_Y - 30, minX: 3400, maxX: 3700, alive: true });
            e.push({ x: 4000, y: GROUND_Y - 30, minX: 3900, maxX: 4200, alive: true });
            e.push({ x: 4500, y: GROUND_Y - 30, minX: 4380, maxX: 4650, alive: true });
            e.push({ x: 5000, y: GROUND_Y - 30, minX: 4880, maxX: 5150, alive: true });
            e.push({ x: 5550, y: GROUND_Y - 30, minX: 5450, maxX: 5750, alive: true });
        }

        buildCoins();
        buildEnemies();

        // ========== GAME STATE ==========
        let state = 'playing'; // playing, win
        let score = 0;
        let coinCount = 0;
        let time = 0;
        let lastFrameTime = 0;
        let dt = 0;
        let currentFrame = 0;
        let animTimer = 0;
        let demoMode = false;
        let aiJumpBuffer = 0;

        // ========== INPUT ==========
        const keys = {};
        const keysPressed = {}; // for one-time presses

        document.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') e.preventDefault();
            if (!keys[e.code]) {
                keysPressed[e.code] = true;
            }
            keys[e.code] = true;

            if (e.code === 'KeyP') {
                demoMode = !demoMode;
                // If switching to demo, reset player
                if (demoMode) {
                    resetPlayer();
                }
            }
            if (e.code === 'KeyR') {
                resetGame();
            }
        });

        document.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        // ========== CAMERA ==========
        let camX = 0;

        // ========== PLAYER ==========
        const player = {
            x: 80,
            y: GROUND_Y - HERO_H,
            vx: 0,
            vy: 0,
            onGround: false,
            facing: 1,
            animFrame: 0,
            animTimer: 0,
            dead: false,
            invincible: 0,
        };

        function resetPlayer() {
            player.x = 80;
            player.y = GROUND_Y - HERO_H;
            player.vx = 0;
            player.vy = 0;
            player.onGround = false;
            player.dead = false;
            player.invincible = 0;
            camX = 0;
            // Reset enemies
            level.enemies.forEach(e => { e.alive = true; });
            // Reset coins
            level.coins.forEach(c => { c.collected = false; });
        }

        function resetGame() {
            score = 0;
            coinCount = 0;
            time = 0;
            state = 'playing';
            resetPlayer();
        }

        // Check if player collides with ground rectangle
        function getGroundRects() {
            const rects = [];
            for (const g of level.ground) {
                rects.push({ x: g.x, y: GROUND_Y, w: g.w, h: 100 });
            }
            return rects;
        }

        function getGroundAt(x, y) {
            // Return true if there's ground at (x,y)
            for (const g of level.ground) {
                if (x >= g.x && x <= g.x + g.w && y >= GROUND_Y && y <= GROUND_Y + 100) return true;
                // Ground is a solid block from GROUND_Y down
                if (x >= g.x && x <= g.x + g.w && y >= GROUND_Y - 2 && y <= GROUND_Y + 100) return true;
            }
            return false;
        }

        function isOnSolidGround() {
            const bottom = player.y + HERO_H;
            const left = player.x + 2;
            const right = player.x + HERO_W - 2;
            // Check ground
            for (const g of level.ground) {
                if (bottom >= GROUND_Y - 2 && bottom <= GROUND_Y + 20 &&
                    player.x + HERO_W > g.x && player.x < g.x + g.w) {
                    return true;
                }
            }
            return false;
        }

        function updatePlayer() {
            if (player.dead) {
                player.vy += GRAVITY * dt * 60;
                player.y += player.vy * dt * 60;
                if (player.y > H) {
                    resetPlayer();
                }
                return;
            }

            // Autoplay input
            let moveLeft = keys['ArrowLeft'] || keys['KeyA'];
            let moveRight = keys['ArrowRight'] || keys['KeyD'];
            let jumpPressed = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];

            if (demoMode) {
                moveLeft = false;
                moveRight = true;
                jumpPressed = aiJumpBuffer > 0;
                aiJumpBuffer -= dt;
            }

            // Accelerate horizontally
            const targetSpeed = (moveRight ? MOVE_SPEED : 0) - (moveLeft ? MOVE_SPEED : 0);
            if (moveLeft && !moveRight) {
                player.vx = Math.max(player.vx - ACCEL * dt * 60, -MOVE_SPEED);
                player.facing = -1;
            } else if (moveRight && !moveLeft) {
                player.vx = Math.min(player.vx + ACCEL * dt * 60, MOVE_SPEED);
                player.facing = 1;
            } else {
                // Friction
                if (player.onGround) {
                    player.vx *= Math.pow(FRICTION, dt * 60);
                } else {
                    player.vx *= Math.pow(0.98, dt * 60);
                }
                if (Math.abs(player.vx) < 0.1) player.vx = 0;
            }

            // Jump
            if (jumpPressed && player.onGround) {
                player.vy = JUMP_FORCE;
                player.onGround = false;
                // Jump particles
                spawnParticles(player.x + HERO_W / 2, player.y + HERO_H, 5, '#8B8B8B', 2);
            }

            // Gravity
            player.vy += GRAVITY * dt * 60;
            if (player.vy > MAX_FALL) player.vy = MAX_FALL;

            // Horizontal movement
            player.x += player.vx * dt * 60;

            // Wall collision with ground -> prevent going into sides
            for (const g of level.ground) {
                const gr = { x: g.x, y: GROUND_Y, w: g.w, h: 100 };
                if (player.x + HERO_W > gr.x && player.x < gr.x + gr.w &&
                    player.y + HERO_H > gr.y && player.y < gr.y + gr.h) {
                    // Horizontal resolution
                    if (player.vx > 0 && player.x + HERO_W - player.vx * dt * 60 <= gr.x) {
                        player.x = gr.x - HERO_W;
                    } else if (player.vx < 0 && player.x - player.vx * dt * 60 >= gr.x + gr.w) {
                        player.x = gr.x + gr.w;
                    }
                }
            }

            // Vertical movement
            player.y += player.vy * dt * 60;

            // Ground collision
            player.onGround = false;
            if (player.vy >= 0) {
                for (const g of level.ground) {
                    const gr = { x: g.x, y: GROUND_Y, w: g.w, h: 100 };
                    if (player.x + HERO_W > gr.x && player.x < gr.x + gr.w &&
                        player.y + HERO_H > gr.y && player.y + HERO_H < gr.y + gr.h + 20 &&
                        player.vy * dt * 60 >= 0) {
                        // Only collide if we were above
                        const prevBottom = player.y + HERO_H - player.vy * dt * 60;
                        if (prevBottom <= gr.y + 4) {
                            player.y = gr.y - HERO_H;
                            player.vy = 0;
                            player.onGround = true;
                        }
                    }
                }
            }

            // Static platforms
            if (player.vy >= 0) {
                for (const p of level.platforms) {
                    const prevBottom = player.y + HERO_H - player.vy * dt * 60;
                    if (player.x + HERO_W > p.x && player.x < p.x + p.w &&
                        player.y + HERO_H >= p.y && player.y + HERO_H <= p.y + p.h + 12 &&
                        prevBottom <= p.y + 6 &&
                        player.vy >= 0) {
                        player.y = p.y - HERO_H;
                        player.vy = 0;
                        player.onGround = true;
                    }
                }
            }

            // Moving platforms
            for (const mp of level.movingPlatforms) {
                // Compute platform position
                const t = (Math.sin((time * mp.speed) + mp.phase) + 1) / 2;
                const px = mp.startX + (mp.endX - mp.startX) * t;
                const py = mp.startY + (mp.endY - mp.startY) * t;

                if (player.vy >= 0) {
                    const prevBottom = player.y + HERO_H - player.vy * dt * 60;
                    const platTop = py;
                    const platLeft = px;
                    const platRight = px + mp.w;
                    const platBottom = py + mp.h;

                    if (player.x + HERO_W > platLeft && player.x < platRight &&
                        player.y + HERO_H >= platTop && player.y + HERO_H <= platTop + 12 &&
                        prevBottom <= platTop + 4 &&
                        player.vy >= 0) {
                        player.y = platTop - HERO_H;
                        player.vy = 0;
                        player.onGround = true;
                    }
                }
            }

            // Keep in-world
            if (player.x < 0) player.x = 0;
            if (player.x > level.width - HERO_W) player.x = level.width - HERO_W;

            // Fall off world
            if (player.y > 700) {
                player.dead = true;
            }

            // Invincibility timer
            if (player.invincible > 0) player.invincible -= dt;

            // Update camera
            const targetCam = player.x - W * 0.4;
            camX = Math.max(0, Math.min(targetCam, level.width - W));
        }

        // ========== ENEMIES ==========
        function updateEnemies() {
            for (const e of level.enemies) {
                if (!e.alive) continue;
                const dir = e.dir || 1;
                e.x += dir * 1.5 * dt * 60 * (e.speed || 1);
                if (e.x <= e.minX) {
                    e.x = e.minX;
                    e.dir = 1;
                }
                if (e.x >= e.maxX - 32) {
                    e.x = e.maxX - 32;
                    e.dir = -1;
                }
                e.dir = e.dir || dir;

                // Collision with player
                if (player.dead) continue;
                if (player.invincible > 0) continue;

                const eRect = { x: e.x, y: e.y + 8, w: 32, h: 22 };
                const pRect = { x: player.x, y: player.y, w: HERO_W, h: HERO_H };

                if (pRect.x < eRect.x + eRect.w &&
                    pRect.x + pRect.w > eRect.x &&
                    pRect.y < eRect.y + eRect.h &&
                    pRect.y + pRect.h > eRect.y) {
                    // Check if player is falling onto enemy
                    if (player.vy > 0 && player.y + HERO_H - eRect.y < 25) {
                        // Squish!
                        e.alive = false;
                        player.vy = -8;
                        score += 100;
                        spawnParticles(e.x + 16, e.y + 16, 10, '#ff6644', 3);
                        spawnParticles(e.x + 16, e.y + 16, 5, '#ffaa22', 2);
                    } else if (player.invincible <= 0) {
                        player.dead = true;
                        player.vy = -6;
                    }
                }
            }
        }

        // ========== COINS ==========
        function updateCoins() {
            for (const c of level.coins) {
                if (c.collected) continue;
                // AABB with player
                const coinX = c.x + 12,
                    coinY = c.y + 12;
                if (player.x + HERO_W > coinX - 8 && player.x < coinX + 8 &&
                    player.y + HERO_H > coinY - 8 && player.y < coinY + 8) {
                    c.collected = true;
                    coinCount++;
                    score += 25;
                    spawnParticles(coinX, coinY, 8, '#ffdd44', 2);
                    spawnParticles(coinX, coinY, 4, '#ffff88', 1.5);
                }
            }
        }

        // ========== PARTICLES ==========
        const particles = [];

        function spawnParticles(x, y, count, color, size) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 10,
                    y: y + (Math.random() - 0.5) * 10,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 3,
                    life: 0.5 + Math.random() * 0.6,
                    maxLife: 0.5 + Math.random() * 0.6,
                    color: color,
                    size: size || 2 + Math.random() * 3,
                });
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 0.2 * dt * 60;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // ========== AUTOPLAY AI ==========
        function updateAutoplay() {
            if (!demoMode || player.dead) return;

            const lookAhead = 50;
            const farLook = 120;
            const px = player.x;
            const py = player.y;

            // Check if there's a gap ahead (no ground)
            const groundOnRight = level.ground.some(g => {
                return px + HERO_W + lookAhead >= g.x && px + HERO_W + lookAhead <= g.x + g.w;
            });

            // Enemies ahead
            let enemyAhead = false;
            for (const e of level.enemies) {
                if (!e.alive) continue;
                const eX = e.x;
                if (eX > px && eX - px < farLook && eX + 32 > px && eX < px + HERO_W + farLook) {
                    // Enemy at or below player level
                    const eY = e.y;
                    if (Math.abs(eY - py) < 60) {
                        enemyAhead = true;
                        break;
                    }
                }
            }

            // Coin above?
            let coinAbove = false;
            for (const c of level.coins) {
                if (c.collected) continue;
                if (Math.abs(c.x + 12 - (px + HERO_W / 2)) < 70 &&
                    c.y + 12 < py && c.y + 12 > py - 140) {
                    coinAbove = true;
                    break;
                }
            }

            // Moving platform ahead?
            let platformAhead = false;
            for (const mp of level.movingPlatforms) {
                const t = (Math.sin((time * mp.speed) + mp.phase) + 1) / 2;
                const px2 = mp.startX + (mp.endX - mp.startX) * t;
                const py2 = mp.startY + (mp.endY - mp.startY) * t;
                if (px2 - px > 20 && px2 - px < 90 && Math.abs(py2 - py) < 80) {
                    platformAhead = true;
                    break;
                }
            }

            // Decide to jump
            let shouldJump = false;

            if (!groundOnRight) {
                shouldJump = true;
            }
            if (enemyAhead) {
                shouldJump = true;
            }
            if (coinAbove && player.onGround) {
                shouldJump = true;
            }
            if (platformAhead && player.onGround) {
                shouldJump = true;
            }

            // Add some look-ahead based on speed
            if (shouldJump) {
                aiJumpBuffer = 0.25; // press jump for ~15 frames
            }
        }

        // ========== PARALLAX BACKGROUND ==========
        const clouds = [];
        for (let i = 0; i < 25; i++) {
            clouds.push({
                x: Math.random() * 2000,
                y: 30 + Math.random() * 150,
                w: 80 + Math.random() * 120,
                speed: 0.1 + Math.random() * 0.2,
                alpha: 0.5 + Math.random() * 0.5,
            });
        }

        const hills = [];
        for (let i = 0; i < 50; i++) {
            hills.push({
                x: i * 200 + Math.random() * 100,
                h: 60 + Math.random() * 120,
                w: 150 + Math.random() * 150,
                type: Math.floor(Math.random() * 2),
            });
        }

        const trees = [];
        for (let i = 0; i < 40; i++) {
            trees.push({
                x: i * 180 + Math.random() * 100,
                y: GROUND_Y - 10,
                h: 60 + Math.random() * 50,
                w: 20 + Math.random() * 20,
            });
        }

        function drawBackground() {
            // Sky gradient
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#5cc8ff');
            grad.addColorStop(0.6, '#a0e0ff');
            grad.addColorStop(1, '#c8f0ff');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Sun
            ctx.fillStyle = '#fff7a0';
            ctx.beginPath();
            ctx.arc(W - 120, 80, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,200,0.3)';
            ctx.beginPath();
            ctx.arc(W - 120, 80, 50, 0, Math.PI * 2);
            ctx.fill();

            // Clouds (parallax 0.1)
            for (const c of clouds) {
                const cx = c.x - camX * c.speed;
                const cx2 = ((cx % (W + 300)) + W + 300) % (W + 300) - 150;
                ctx.fillStyle = `rgba(255,255,255,${c.alpha})`;
                ctx.beginPath();
                ctx.ellipse(cx2, c.y, c.w * 0.5, 20, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx2 - 30, c.y + 12, c.w * 0.35, 15, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Hills (parallax 0.2)
            for (const h of hills) {
                const hx = h.x - camX * 0.2;
                const hx2 = ((hx % (W + 400)) + W + 400) % (W + 400) - 200;
                const hh = h.h;
                ctx.fillStyle = h.type === 0 ? '#7ec97e' : '#6ab86a';
                ctx.beginPath();
                ctx.ellipse(hx2 + h.w / 2, GROUND_Y, h.w / 2, hh, 0, Math.PI, 0);
                ctx.fill();
            }

            // Distant trees (parallax 0.4)
            for (const t of trees) {
                const tx = t.x - camX * 0.4;
                const tx2 = ((tx % (W + 300)) + W + 300) % (W + 300) - 150;
                ctx.fillStyle = '#3a7d3a';
                ctx.fillRect(tx2, t.y - t.h, 10, t.h);
                ctx.beginPath();
                ctx.arc(tx2 + 5, t.y - t.h, 14, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ========== DRAW HERO ==========
        function drawHero(x, y, facing, frame) {
            ctx.save();
            ctx.translate(x + HERO_W / 2, y + HERO_H);
            ctx.scale(facing, 1);
            ctx.translate(-(HERO_W / 2), -HERO_H);

            // Legs
            const walkFrame = Math.sin(frame * 0.6);
            const legOffset = player.onGround ? Math.abs(walkFrame) * 4 : 4;

            // Boots
            ctx.fillStyle = '#8B5A2B';
            ctx.fillRect(4, HERO_H - 10, 10, 8);
            ctx.fillRect(HERO_W - 14, HERO_H - 10, 10, 8);

            // Legs
            ctx.fillStyle = '#5D4E37';
            ctx.fillRect(8, HERO_H - 22, 8, 14);
            ctx.fillRect(HERO_W - 16, HERO_H - 22, 8, 14);

            // Body (tunic)
            ctx.fillStyle = '#2E8B57';
            ctx.fillRect(2, HERO_H - 44, HERO_W - 4, 24);

            // Belt
            ctx.fillStyle = '#6B3E1A';
            ctx.fillRect(2, HERO_H - 46, HERO_W - 4, 4);

            // Arm (facing direction)
            ctx.fillStyle = '#2E8B57';
            ctx.fillRect(HERO_W - 8, HERO_H - 40, 6, 12);
            ctx.fillRect(2, HERO_H - 40, 6, 12);

            // Head
            ctx.fillStyle = '#F4A460';
            ctx.fillRect(6, HERO_H - 62, HERO_W - 12, 20);

            // Hat
            ctx.fillStyle = '#D4493B';
            ctx.fillRect(2, HERO_H - 70, HERO_W - 4, 12);
            ctx.fillRect(0, HERO_H - 62, HERO_W, 4);
            // Hat brim
            ctx.fillRect(HERO_W - 2, HERO_H - 66, 8, 4);

            // Eye
            ctx.fillStyle = '#222';
            ctx.fillRect(12, HERO_H - 58, 4, 4);
            ctx.fillRect(20, HERO_H - 58, 4, 4);

            // Mouth
            ctx.fillStyle = '#B04A2A';
            ctx.fillRect(14, HERO_H - 46, 4, 2);

            ctx.restore();
        }

        // ========== DRAW ENEMY ==========
        function drawEnemy(e) {
            if (!e.alive) return;
            const x = e.x,
                y = e.y;
            ctx.save();
            ctx.fillStyle = '#C0392B';
            // Body
            ctx.fillRect(x + 4, y + 8, 24, 20);
            // Eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(x + 6, y + 12, 8, 8);
            ctx.fillRect(x + 18, y + 12, 8, 8);
            // Pupils
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(x + 10, y + 14, 3, 4);
            ctx.fillRect(x + 22, y + 14, 3, 4);
            // Feet
            ctx.fillStyle = '#7A2713';
            ctx.fillRect(x + 2, y + 26, 14, 6);
            ctx.fillRect(x + 16, y + 26, 14, 6);
            ctx.restore();
        }

        // ========== DRAW COIN ==========
        function drawCoin(c) {
            if (c.collected) return;
            const x = c.x,
                y = c.y;
            const pulse = Math.sin(time * 3 + x * 0.1) * 2;
            ctx.save();
            ctx.fillStyle = '#E6B800';
            ctx.beginPath();
            ctx.arc(x + 12, y + 12 + pulse * 0.2, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFE066';
            ctx.beginPath();
            ctx.arc(x + 9, y + 10 + pulse * 0.2, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#B8860B';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x + 12, y + 12 + pulse * 0.2, 9, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        // ========== DRAW FLAG ==========
        function drawFlag() {
            const fx = level.flag.x,
                fy = level.flag.y;
            ctx.save();
            // Pole
            ctx.fillStyle = '#AAAAAA';
            ctx.fillRect(fx, fy, 6, win);

            // Flag
            const wave = Math.sin(time * 4) * 3;
            ctx.fillStyle = '#E74C3C';
            ctx.beginPath();
            ctx.moveTo(fx + 6, fy);
            ctx.lineTo(fx + 50 + wave, fy + 12);
            ctx.lineTo(fx + 6, fy + 24);
            ctx.closePath();
            ctx.fill();

            // Star
            ctx.fillStyle = '#FFD700';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('★', fx + 24 + wave * 0.3, fy + 18);
            ctx.restore();
        }

        // ========== DRAW PLATFORM ==========
        function drawPlatform(p) {
            ctx.save();
            // Stone platform
            ctx.fillStyle = '#7A8B6F';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#8F9E84';
            ctx.fillRect(p.x, p.y, p.w, 4);
            ctx.fillStyle = '#5A6B4F';
            for (let i = 0; i < p.w / 20; i++) {
                ctx.fillRect(p.x + i * 20 + 6, p.y + 6, 8, 4);
            }
            ctx.restore();
        }

        // ========== DRAW GROUND ==========
        function drawGround() {
            for (const g of level.ground) {
                const sx = Math.max(g.x, camX - 100);
                const ex = Math.min(g.x + g.w, camX + W + 100);
                if (ex <= sx) continue;

                const sxp = sx - camX;
                const exp = ex - camX;

                // Main ground
                ctx.fillStyle = '#4A7C3A';
                ctx.fillRect(sxp, GROUND_Y, exp - sxp, H - GROUND_Y);

                // Grass top
                ctx.fillStyle = '#6BA85E';
                ctx.fillRect(sxp, GROUND_Y, exp - sxp, 12);

                // Grass blades
                ctx.fillStyle = '#8BCF7A';
                for (let i = 0; i < (exp - sxp) / 8; i++) {
                    const bx = sxp + i * 8 + Math.sin(time * 3 + i) * 1.5;
                    ctx.fillRect(bx, GROUND_Y - 4, 3, 6);
                }

                // Dirt
                ctx.fillStyle = '#5C3A1A';
                ctx.fillRect(sxp, GROUND_Y + 12, exp - sxp, 20);
                ctx.fillStyle = '#4A2E14';
                ctx.fillRect(sxp, GROUND_Y + 40, exp - sxp, H - GROUND_Y - 40);
            }
        }

        // ========== UI ==========
        function drawUI() {
            ctx.save();
            // Score
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(10, 10, 220, 48);
            ctx.fillStyle = '#fff';
            ctx.fillText('SCORE', 20, 28);
            ctx.font = 'bold 20px "Courier New", monospace';
            ctx.fillText(String(score).padStart(6, '0'), 24, 50);

            ctx.fillStyle = '#FFD700';
            ctx.font = '18px "Courier New", monospace';
            ctx.fillText('🪙 x' + coinCount, 130, 46);

            // Demo indicator
            if (demoMode) {
                ctx.fillStyle = 'rgba(255,0,0,0.7)';
                ctx.fillRect(W - 120, 10, 110, 30);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px "Courier New", monospace';
                ctx.fillText('DEMO', W - 95, 32);

                // Movement
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(W - 120, 50, 110, 24);
                ctx.fillStyle = '#fff';
                ctx.font = '12px "Courier New", monospace';
                ctx.fillText('P: Exit', W - 95, 68);
            }

            ctx.restore();
        }

        // ========== GAME LOOP ==========
        let lastTime = performance.now();
        let gameTime = 0;

        function gameLoop(now) {
            dt = Math.min(now - lastTime, 33) / 16.667;
            if (dt > 3) dt = 1;
            lastTime = now;
            time += dt / 60;

            // Autoplay
            if (demoMode) {
                updateAutoplay();
            }

            // Update player
            updatePlayer();

            // Update enemies
            updateEnemies();

            // Update coins
            updateCoins();

            // Update particles
            updateParticles(dt);

            // Update anim
            if (Math.abs(player.vx) > 0.5 && player.onGround) {
                player.animTimer += dt * 10;
                if (player.animTimer > 1) player.animTimer -= 1;
            }

            // DRAWING
            ctx.clearRect(0, 0, W, H);

            // Background
            drawBackground();

            ctx.save();
            ctx.translate(-camX, 0);

            // Draw ground
            drawGround();

            // Draw platforms
            for (const p of level.platforms) {
                drawPlatform(p);
            }

            // Draw moving platforms
            for (const mp of level.movingPlatforms) {
                const t = (Math.sin((time * mp.speed) + mp.phase) + 1) / 2;
                const px = mp.startX + (mp.endX - mp.startX) * t;
                const py = mp.startY + (mp.endY - mp.startY) * t;
                drawPlatform({ x: px, y: py, w: mp.w, h: mp.h });
            }

            // Draw flag
            drawFlag();

            // Draw coins
            for (const c of level.coins) {
                drawCoin(c);
            }

            // Draw enemies
            for (const e of level.enemies) {
                drawEnemy(e);
            }

            // Draw player
            if (!player.dead) {
                // Invincible blink
                if (player.invincible <= 0 || Math.floor(gameTime * 10) % 2 === 0) {
                    drawHero(player.x, player.y, player.facing, player.animTimer);
                }
            } else {
                // Draw death
                ctx.fillStyle = '#333';
                ctx.fillRect(player.x + 8, player.y + 8, 12, 20);
                ctx.fillStyle = '#F4A460';
                ctx.fillRect(player.x + 6, player.y - 10, 16, 12);
            }

            ctx.restore();

            // Particles in screen space after camera transform
            ctx.save();
            for (const p of particles) {
                const px = p.x - camX;
                if (px < -20 || px > W + 20) continue;
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.fillStyle = p.color;
                ctx.fillRect(px - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            ctx.restore();

            // UI
            drawUI();

            // Win screen
            if (state === 'win') {
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(W / 2 - 200, H / 2 - 60, 400, 120);
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 3;
                ctx.strokeRect(W / 2 - 200, H / 2 - 60, 400, 120);

                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 28px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('LEVEL COMPLETE!', W / 2, H / 2);
                ctx.font = '16px "Courier New", monospace';
                ctx.fillStyle = '#fff';
                ctx.fillText('R - Restart', W / 2, H / 2 + 36);
                ctx.restore();
            }

            gameTime += dt / 60;
            requestAnimationFrame(gameLoop);
        }

        // ========== WIN DETECTION ==========
        let winFlag = false;

        function checkWin() {
            const fx = level.flag.x;
            const fy = level.flag.y;
            if (!winFlag && player.x + HERO_W >= fx && player.x <= fx + 50 &&
                player.y + HERO_H >= fy && player.y <= fy + 200) {
                state = 'win';
                winFlag = true;
            }
        }

        // Inject checkWin into gameLoop
        const baseLoop = gameLoop;

        // We'll do it in requestAnimationFrame by patching.
        // Rather than duplicate, let's define a proper loop.

        function checkWinWrapper() {
            if (state !== 'win' && !player.dead) {
                const fx = level.flag.x;
                const fy = level.flag.y;
                if (player.x + HERO_W >= fx && player.x <= fx + 50 &&
                    player.y + HERO_H >= fy && player.y <= fy + 200) {
                    state = 'win';
                    winFlag = true;
                }
            }
        }

        // Patch game loop to include checkWin
        const origUpdate = null;

        // We'll just call checkWin in the main loop.
        // Insert call at end of updatePlayer
        const updatePlayerOriginal = updatePlayer;
        const updatePlayerWithWin = function() {
            updatePlayerOriginal();
            checkWinWrapper();
        };
        updatePlayer = updatePlayerWithWin;

        // ========== START GAME ==========
        // Override resetPlayer to clear win state
        const origResetGame = resetGame;
        resetGame = function() {
            winFlag = false;
            state = 'playing';
            origResetGame.call(this);
        };

        // Initialise
        buildCoins();
        buildEnemies();
        resetGame();

        // Patch updateCoins to also update platform movement time
        const origUpdateCoins = updateCoins;
        updateCoins = function() {
            origUpdateCoins();
            // Check moving platform carry
            for (const mp of level.movingPlatforms) {
                const t = (Math.sin((time * mp.speed) + mp.phase) + 1) / 2;
                const px = mp.startX + (mp.endX - mp.startX) * t;
                const py = mp.startY + (mp.endY - mp.startY) * t;
                // Player standing on moving platform? carry player
                if (player.onGround && player.y + HERO_H === Math.floor(py)) {
                    // Check horizontal
                    if (player.x + HERO_W > px && player.x < px + mp.w) {
                        // Carry player horizontally based on platform movement
                        // We'll let physics handle it naturally.
                    }
                }
            }
        };

        // Patch player to ride moving platforms
        // This is handled in the physics already.

        // Start
        requestAnimationFrame(gameLoop);

        // Clean unused variable
        void origUpdate;
    </script>

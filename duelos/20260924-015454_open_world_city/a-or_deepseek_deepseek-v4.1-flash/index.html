<!DOCTYPE html>
<html lang="en">
<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon District — Autonomous City</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05070c;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  canvas{display:block;}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #speedo{
    position:absolute;left:24px;bottom:18px;
    font-size:54px;font-weight:700;color:#fff;letter-spacing:-3px;

    text-shadow:0 2px 10px rgba(0,0,0,.9);}

    position:absolute;right:24px;top:18px;font-size:28px;letter-spacing:4px;color:#ffcc33;

  }
  #minimap{
    position:fixed;right:16px;bottom:16px;width:172px;height:172px;z-index:10;
    border-radius:12px;border:2px solid rgba(255,255,255,.22);

  }

<body>
<div id="hud">
  <div id="speedo">0<small>KM/H</small></div>
  <div id="wanted"></div>
  <div id="title">NEON DISTRICT · AUTONOMOUS</div>
</div>
<canvas id="minimap" width="172" height="172"></canvas>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   UTILITIES
   ============================================================ */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function angleLerp(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function angleDiff(a, b) {
  let d = (b - a) % (Math.PI * 2);
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x8fa6c0, 0.0024);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.4, 2400);
camera.position.set(0, 12, 22);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   WORLD CONSTANTS
   ============================================================ */
const GRID = 8;
const BLOCK = 44;
const ROAD = 14;
const S = BLOCK + ROAD;        // 58
const CITY = GRID * S;         // 464
const HALF = CITY / 2;         // 232
const ROADH = ROAD / 2;
const LANE = 3.4;
const SW_H = 0.35;

/* ============================================================
   LIGHTS
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x35352c, 0.8);
scene.add(hemi);

const sunLight = new THREE.DirectionalLight(0xfff2dd, 1.4);
sunLight.position.set(120, 180, 90);
scene.add(sunLight);

const moonLight = new THREE.DirectionalLight(0x9fb4ff, 0.0);
moonLight.position.set(-120, 180, -90);
scene.add(moonLight);

/* ============================================================
   SKY
   ============================================================ */
const skyUniforms = {
  top: { value: new THREE.Color(0x2f6fd0) },
  bottom: { value: new THREE.Color(0xa9c9e8) },
  sunDir: { value: new THREE.Vector3(0, 1, 0) },
  sunColor: { value: new THREE.Color(0xfff3e0) }
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1100, 32, 16),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms,
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    vertexShader: `
      varying vec3 vPos;
      void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader: `
      uniform vec3 top; uniform vec3 bottom; uniform vec3 sunDir; uniform vec3 sunColor;
      varying vec3 vPos;
      void main(){
        vec3 d = normalize(vPos);
        float h = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 col = mix(bottom, top, pow(h, 0.75));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        col += sunColor * pow(s, 42.0) * 0.9;
        col += sunColor * pow(s, 5.0) * 0.10;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  })
);
sky.frustumCulled = false;
scene.add(sky);

// stars
{
  const pts = [];
  for (let i = 0; i < 700; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(1000);
    v.y = Math.abs(v.y) * 0.9 + 20;
    pts.push(v.x, v.y, v.z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  window.__starMat = new THREE.PointsMaterial({
    color: 0xffffff, size: 2.0, sizeAttenuation: false,
    transparent: true, opacity: 0, depthWrite: false, fog: false
  });
  const stars = new THREE.Points(g, window.__starMat);
  stars.frustumCulled = false;
  scene.add(stars);
}
const starMat = window.__starMat;

/* ============================================================
   CITY : GROUND + ROADS
   ============================================================ */
const cityGroup = new THREE.Group();
scene.add(cityGroup);

{
  const g = new THREE.PlaneGeometry(CITY + 900, CITY + 900).rotateX(-Math.PI / 2);
  const m = new THREE.MeshLambertMaterial({ color: 0x2b382a });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.y = -0.05;
  cityGroup.add(mesh);
}

function makeRoadTexture(alongX) {
  const LEN = 256, WID = 64;
  const c = document.createElement('canvas');
  c.width = alongX ? LEN : WID;
  c.height = alongX ? WID : LEN;
  const g = c.getContext('2d');
  g.fillStyle = '#34353b';
  g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 700; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.03).toFixed(3) + ')';
    g.fillRect(Math.random() * c.width, Math.random() * c.height, 3, 3);
  }
  g.fillStyle = 'rgba(228,228,215,0.42)';
  if (alongX) { g.fillRect(0, 4, LEN, 2); g.fillRect(0, WID - 6, LEN, 2); }
  else { g.fillRect(4, 0, 2, LEN); g.fillRect(WID - 6, 0, 2, LEN); }
  g.fillStyle = 'rgba(246,222,112,0.85)';
  if (alongX) { for (let x = 0; x < LEN; x += 32) g.fillRect(x, WID / 2 - 1.5, 16, 3); }
  else { for (let y = 0; y < LEN; y += 32) g.fillRect(WID / 2 - 1.5, y, 3, 16); }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const ROAD_LEN = CITY + ROAD * 2 + 60;
{
  const texX = makeRoadTexture(true);
  texX.repeat.set(ROAD_LEN / 64, 1);
  const texZ = makeRoadTexture(false);
  texZ.repeat.set(1, ROAD_LEN / 64);
  const matX = new THREE.MeshLambertMaterial({ map: texX });
  const matZ = new THREE.MeshLambertMaterial({ map: texZ });
  const geoX = new THREE.PlaneGeometry(ROAD_LEN, ROAD).rotateX(-Math.PI / 2);
  const geoZ = new THREE.PlaneGeometry(ROAD, ROAD_LEN).rotateX(-Math.PI / 2);
  for (let i = 0; i <= GRID; i++) {
    const p = i * S - HALF;
    const mx = new THREE.Mesh(geoX, matX);
    mx.position.set(0, 0.01, p);
    cityGroup.add(mx);
    const mz = new THREE.Mesh(geoZ, matZ);
    mz.position.set(p, 0.01, 0);
    cityGroup.add(mz);
  }
}

/* ============================================================
   BUILDINGS
   ============================================================ */
function makeFacadeTexture() {
  const T = 128;
  const c = document.createElement('canvas'); c.width = c.height = T;
  const g = c.getContext('2d');
  g.fillStyle = '#bcb7ae'; g.fillRect(0, 0, T, T);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.05).toFixed(3) + ')';
    g.fillRect(Math.random() * T, Math.random() * T, 2, 2);
  }
  // horizontal floor lines
  for (let j = 0; j <= 2; j++) {
    g.fillStyle = 'rgba(0,0,0,0.10)';
    g.fillRect(0, j * (T / 2) - 1, T, 2);
  }
  const e = document.createElement('canvas'); e.width = e.height = T;
  const ge = e.getContext('2d');
  ge.fillStyle = '#000'; ge.fillRect(0, 0, T, T);

  const cols = 2, rows = 2;
  const cw = T / cols, ch = T / rows;
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      const x = i * cw + cw * 0.22;
      const y = j * ch + ch * 0.20;
      const w = cw * 0.56;
      const h = ch * 0.52;
      g.fillStyle = '#3b4855';
      g.fillRect(x, y, w, h);
      g.fillStyle = 'rgba(255,255,255,0.13)';
      g.fillRect(x, y, w, h * 0.28);
      g.fillStyle = 'rgba(0,0,0,0.22)';
      g.fillRect(x, y + h - 2, w, 2);
      if (Math.random() < 0.58) {
        ge.fillStyle = ['#ffcf87', '#ffd9a0', '#c9e2ff', '#ffe9c0'][randInt(0, 3)];
        ge.fillRect(x, y, w, h);
      }
    }
  }
  const map = new THREE.CanvasTexture(c);
  const emi = new THREE.CanvasTexture(e);
  [map, emi].forEach(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; });
  map.colorSpace = THREE.SRGBColorSpace;
  emi.colorSpace = THREE.SRGBColorSpace;
  return { map, emi };
}

const facade = makeFacadeTexture();
const buildingMats = [];
{
  const palette = [0xe2dbcd, 0xcac3b6, 0xb9bdc6, 0xd8c9b2, 0xa9afba, 0xe3d8c8, 0xc4b8a8];
  for (const p of palette) {
    buildingMats.push(new THREE.MeshLambertMaterial({
      map: facade.map,
      emissiveMap: facade.emi,
      emissive: 0x000000,
      color: p
    }));
  }
}
const roofMat = new THREE.MeshLambertMaterial({ color: 0x67686a });
const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0x9b9b95 });
const grassMat = new THREE.MeshLambertMaterial({ color: 0x3e6b34 });

function buildingGeometry(w, h, d) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const uv = geo.attributes.uv;
  const TILE = 7;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) {
    if (f === 2 || f === 3) continue;
    const su = Math.max(1, Math.round(dims[f][0] / TILE));
    const sv = Math.max(1, Math.round(dims[f][1] / TILE));
    for (let k = 0; k < 4; k++) {
      const idx = f * 4 + k;
      uv.setXY(idx, uv.getX(idx) * su, uv.getY(idx) * sv);
    }
  }
  uv.needsUpdate = true;
  return geo;
}

const treeSpots = [];
const pedBlocks = [];

function buildBuildings(cx, cz) {
  const nx = Math.random() < 0.55 ? 1 : 2;
  const nz = Math.random() < 0.55 ? 1 : 2;
  const lotW = BLOCK / nx, lotD = BLOCK / nz;
  const centerBias = 1 - Math.hypot(cx, cz) / HALF;
  for (let a = 0; a < nx; a++) {
    for (let b = 0; b < nz; b++) {
      if (Math.random() < 0.13) continue;
      const lx = cx - BLOCK / 2 + lotW * (a + 0.5);
      const lz = cz - BLOCK / 2 + lotD * (b + 0.5);
      const w = Math.min(lotW - rand(4, 8), 34);
      const d = Math.min(lotD - rand(4, 8), 34);
      if (w < 6 || d < 6) continue;
      let h = rand(7, 20) + centerBias * rand(0, 22);
      if (Math.random() < 0.09) h *= 1.7;
      h = clamp(h, 6, 62);
      const geo = buildingGeometry(w, h, d);
      const mat = buildingMats[randInt(0, buildingMats.length - 1)];
      const mesh = new THREE.Mesh(geo, [mat, mat, roofMat, roofMat, mat, mat]);
      mesh.position.set(lx, SW_H + h / 2, lz);
      cityGroup.add(mesh);
    }
  }
  if (Math.random() < 0.5) {
    treeSpots.push([cx + rand(-19, 19), cz + rand(-19, 19), rand(0.7, 1.0)]);
  }
}

function buildPark(cx, cz) {
  const grass = new THREE.Mesh(
    new THREE.PlaneGeometry(BLOCK - 2, BLOCK - 2).rotateX(-Math.PI / 2),
    grassMat
  );
  grass.position.set(cx, SW_H + 0.02, cz);
  cityGroup.add(grass);
  const n = randInt(5, 10);
  for (let k = 0; k < n; k++) {
    treeSpots.push([cx + rand(-18, 18), cz + rand(-18, 18), rand(0.85, 1.6)]);
  }
}

for (let i = 0; i < GRID; i++) {
  for (let j = 0; j < GRID; j++) {
    const cx = i * S + S / 2 - HALF;
    const cz = j * S + S / 2 - HALF;

    const slab = new THREE.Mesh(new THREE.BoxGeometry(BLOCK, SW_H, BLOCK), sidewalkMat);
    slab.position.set(cx, SW_H / 2, cz);
    cityGroup.add(slab);

    const isPark = Math.random() < 0.15;
    if (isPark) buildPark(cx, cz);
    else {
      buildBuildings(cx, cz);
      pedBlocks.push({ x: cx, z: cz, h: BLOCK / 2 - 3.5 });
    }
  }
}

/* ============================================================
   TREES (instanced)
   ============================================================ */
{
  const trunkGeo = new THREE.CylinderGeometry(0.22, 0.3, 2.4, 6);
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x584133 });
  const leafGeo = new THREE.IcosahedronGeometry(2.1, 0);
  const leafMat = new THREE.MeshLambertMaterial({ color: 0x3d7a34 });

  const tm = new THREE.InstancedMesh(trunkGeo, trunkMat, treeSpots.length);
  const lm = new THREE.InstancedMesh(leafGeo, leafMat, treeSpots.length);
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();

  treeSpots.forEach((t, i) => {
    const [x, z, s] = t;
    dummy.position.set(x, SW_H + 1.2 * s, z);
    dummy.scale.set(s, s, s);
    dummy.rotation.set(0, Math.random() * 6.28, 0);
    dummy.updateMatrix();
    tm.setMatrixAt(i, dummy.matrix);

    dummy.position.set(x, SW_H + 3.1 * s, z);
    dummy.scale.set(s * rand(0.85, 1.2), s * rand(0.8, 1.15), s * rand(0.85, 1.2));
    dummy.updateMatrix();
    lm.setMatrixAt(i, dummy.matrix);

    col.setHSL(0.28 + rand(-0.05, 0.05), rand(0.35, 0.6), rand(0.2, 0.34));
    lm.setColorAt(i, col);
  });
  tm.instanceMatrix.needsUpdate = true;
  lm.instanceMatrix.needsUpdate = true;
  if (lm.instanceColor) lm.instanceColor.needsUpdate = true;
  cityGroup.add(tm, lm);
}

/* ============================================================
   STREET LAMPS (instanced) + glow
   ============================================================ */
const lampPositions = [];
for (let k = 0; k <= GRID; k++) {
  const p = k * S - HALF;
  for (let i = 0; i < GRID; i++) {
    const c = i * S + S / 2 - HALF;
    const side = (i % 2 === 0) ? 1 : -1;
    lampPositions.push({ x: c, z: p + side * 8.6, rot: side > 0 ? 0 : Math.PI });
    lampPositions.push({ x: p + side * 8.6, z: c, rot: side > 0 ? Math.PI / 2 : -Math.PI / 2 });
  }
}

const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,228,168,0.95)');
  grd.addColorStop(0.45, 'rgba(255,212,132,0.28)');
  grd.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const lampGlowMat = new THREE.MeshBasicMaterial({
  map: glowTex, transparent: true, blending: THREE.AdditiveBlending,
  depthWrite: false, opacity: 0, fog: false
});
const lampHeadMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

{
  const poleGeo = new THREE.CylinderGeometry(0.11, 0.15, 6.4, 6);
  const poleMat = new THREE.MeshLambertMaterial({ color: 0x4b4d52 });
  const headGeo = new THREE.BoxGeometry(0.7, 0.24, 1.5);
  const glowGeo = new THREE.PlaneGeometry(13, 13).rotateX(-Math.PI / 2);

  const pm = new THREE.InstancedMesh(poleGeo, poleMat, lampPositions.length);
  const hm = new THREE.InstancedMesh(headGeo, lampHeadMat, lampPositions.length);
  const gm = new THREE.InstancedMesh(glowGeo, lampGlowMat, lampPositions.length);
  const d = new THREE.Object3D();

  lampPositions.forEach((l, i) => {
    d.position.set(l.x, SW_H + 3.2, l.z);
    d.rotation.set(0, l.rot, 0);
    d.scale.set(1, 1, 1);
    d.updateMatrix();
    pm.setMatrixAt(i, d.matrix);

    const hx = l.x + Math.sin(l.rot) * 0 - 0; // head centred on pole
    d.position.set(hx, SW_H + 6.35, l.z);
    d.updateMatrix();
    hm.setMatrixAt(i, d.matrix);

    d.position.set(l.x, SW_H + 0.06, l.z);
    d.updateMatrix();
    gm.setMatrixAt(i, d.matrix);
  });
  pm.instanceMatrix.needsUpdate = true;
  hm.instanceMatrix.needsUpdate = true;
  gm.instanceMatrix.needsUpdate = true;
  gm.renderOrder = 2;
  cityGroup.add(pm, hm, gm);
}

/* ============================================================
   TRAFFIC LIGHTS
   ============================================================ */
const tlData = [];
{
  const poleGeo = new THREE.CylinderGeometry(0.1, 0.12, 5.0, 5);
  const poleMat = new THREE.MeshLambertMaterial({ color: 0x3a3d42 });
  const headGeo = new THREE.BoxGeometry(0.52, 1.15, 0.52);
  const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  const corners = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  const total = (GRID + 1) * (GRID + 1) * 4;

  const pm = new THREE.InstancedMesh(poleGeo, poleMat, total);
  const hm = new THREE.InstancedMesh(headGeo, headMat, total);
  const d = new THREE.Object3D();
  let idx = 0;

  for (let i = 0; i <= GRID; i++) {
    for (let j = 0; j <= GRID; j++) {
      const px = i * S - HALF;
      const pz = j * S - HALF;
      for (const [sx, sz] of corners) {
        const cx = px + sx * (ROADH + 1.4);
        const cz = pz + sz * (ROADH + 1.4);

        d.position.set(cx, SW_H + 2.5, cz);
        d.rotation.set(0, 0, 0);
        d.scale.set(1, 1, 1);
        d.updateMatrix();
        pm.setMatrixAt(idx, d.matrix);

        d.position.set(cx, SW_H + 5.2, cz);
        d.updateMatrix();
        hm.setMatrixAt(idx, d.matrix);

        // axis controlled by this corner: same-sign => X traffic
        const axis = (sx * sz > 0) ? 0 : 1;
        tlData.push({ ni: i, nj: j, axis });
        idx++;
      }
    }
  }
  pm.instanceMatrix.needsUpdate = true;
  hm.instanceMatrix.needsUpdate = true;
  cityGroup.add(pm, hm);
  window.__tlHead = hm;
}
const tlHeadMesh = window.__tlHead;

function lightPhase(ni, nj, t) {
  const off = (ni * 0.37 + nj * 0.61) % 1;
  return (((t * 0.085 + off) % 1) + 1) % 1;
}
function getLightState(ni, nj, dir, t) {
  const p = lightPhase(ni, nj, t);
  const isX = (dir === 0 || dir === 1);
  const q = isX ? p : (p + 0.5) % 1;
  if (q < 0.42) return 'g';
  if (q < 0.48) return 'y';
  return 'r';
}

const _tlCol = new THREE.Color();
function updateTrafficLightVisuals(t) {
  for (let k = 0; k < tlData.length; k++) {
    const d = tlData[k];
    const dir = d.axis === 0 ? 0 : 2;
    const st = getLightState(d.ni, d.nj, dir, t);
    if (st === 'g') _tlCol.setHex(0x1dff6a);
    else if (st === 'y') _tlCol.setHex(0xffcc22);
    else _tlCol.setHex(0xff2b18);
    tlHeadMesh.setColorAt(k, _tlCol);
  }
  if (tlHeadMesh.instanceColor) tlHeadMesh.instanceColor.needsUpdate = true;
}

/* ============================================================
   ROAD GRAPH HELPERS
   ============================================================ */
const DIRV = [
  new THREE.Vector2(1, 0),   // +X
  new THREE.Vector2(-1, 0),  // -X
  new THREE.Vector2(0, 1),   // +Z
  new THREE.Vector2(0, -1)   // -Z
];
const RIGHTV = [
  new THREE.Vector2(0, 1),
  new THREE.Vector2(0, -1),
  new THREE.Vector2(-1, 0),
  new THREE.Vector2(1, 0)
];

function lanePos(i, j, dir, t, lane, out) {
  const d = DIRV[dir], r = RIGHTV[dir];
  out.set(
    i * S - HALF + d.x * t + r.x * lane,
    0,
    j * S - HALF + d.y * t + r.y * lane
  );
  return out;
}

/* ============================================================
   CAR MESHES
   ============================================================ */
const carGeoBody = new THREE.BoxGeometry(1.9, 0.78, 4.4);

function makeCarMesh(color, isPolice, isHero) {

/* ============================================================
   VEHICLE SYSTEM
   ============================================================ */
const VEHICLES = [];
const POLICE = [];
let HERO = null;
let WANTED = 0;
let worldTime = 0;

const _tmpV = new THREE.Vector3();

function chooseDir(i, j, curDir, v) {
  const opts = [];
  for (let d = 0; d < 4; d++) {
    if (d === (curDir ^ 1)) continue;
    const ni = i + DIRV[d].x, nj = j + DIRV[d].y;
    if (ni < 0 || ni > GRID || nj < 0 || nj > GRID) continue;
    opts.push(d);
  }
  if (opts.length === 0) return curDir ^ 1;

  if (v && v.isPolice && HERO) {
    let best = opts[0], bd = Infinity;
    for (const d of opts) {
      const nx = (i + DIRV[d].x) * S - HALF;
      const nz = (j + DIRV[d].y) * S - HALF;
      const dist = (nx - HERO.pos.x) ** 2 + (nz - HERO.pos.z) ** 2;
      if (dist < bd) { bd = dist; best = d; }
    }
    return best;
  }
  if (opts.includes(curDir) && Math.random() < 0.62) return curDir;
  return opts[randInt(0, opts.length - 1)];
}

function spawnVehicle(opts) {
  const v = {
    i: opts.i, j: opts.j, dir: opts.dir, t: opts.t || 0,
    speed: opts.speed0 || 0,
    maxSpeed: opts.maxSpeed,
    accel: opts.accel || 7,
    brake: opts.brake || 16,
    isHero: !!opts.isHero,
    isPolice: !!opts.isPolice,
    ignoreLights: !!opts.isPolice,
    lane: LANE,
    laneTarget: LANE,
    pos: new THREE.Vector3(),
    prevPos: new THREE.Vector3(),
    heading: 0,
    prevHeading: 0,
    drift: 0,
    pendingDir: opts.dir,
    overtaking: false,
    otTimer: 0,
    flashTimer: Math.random() * 10,
    mesh: makeCarMesh(opts.color, !!opts.isPolice, !!opts.isHero)
  };

  lanePos(v.i, v.j, v.dir, v.t, v.lane, v.pos);
  v.prevPos.copy(v.pos);
  v.heading = Math.atan2(DIRV[v.dir].x, DIRV[v.dir].y);
  v.prevHeading = v.heading;
  v.mesh.position.copy(v.pos);
  v.mesh.rotation.y = v.heading;
  scene.add(v.mesh);
  VEHICLES.push(v);
  return v;
}

function spawnTraffic(count) {
  for (let k = 0; k < count; k++) {
    const i = randInt(0, GRID - 1);
    const j = randInt(0, GRID - 1);
    const dir = randInt(0, 3);
    const hue = Math.random();
    const col = new THREE.Color().setHSL(hue, rand(0.15, 0.75), rand(0.28, 0.62));
    spawnVehicle({
      i, j, dir, t: rand(0, S),
      maxSpeed: rand(9, 14),
      accel: rand(5, 9),
      brake: rand(14, 20),
      color: col.getHex(),
      speed0: rand(6, 12)
    });
  }
}

function spawnPolice() {
  if (!HERO || POLICE.length >= 12) return;
  for (let attempt = 0; attempt < 40; attempt++) {
    const i = randInt(0, GRID);
    const j = randInt(0, GRID);
    const px = i * S - HALF, pz = j * S - HALF;
    const d = Math.hypot(px - HERO.pos.x, pz - HERO.pos.z);
    if (d < 80 || d > 260) continue;

    const valid = [];
    for (let dd = 0; dd < 4; dd++) {
      const ni = i + DIRV[dd].x, nj = j + DIRV[dd].y;
      if (ni >= 0 && ni <= GRID && nj >= 0 && nj <= GRID) valid.push(dd);
    }
    if (!valid.length) continue;

    const v = spawnVehicle({
      i, j, dir: valid[randInt(0, valid.length - 1)],
      t: rand(0, S * 0.6),
      maxSpeed: rand(19, 24),
      accel: 12, brake: 22,
      color: Math.random() < 0.5 ? 0xf2f2f2 : 0x1b1e26,
      isPolice: true
    });
    POLICE.push(v);
    return;
  }
}

/* ---------- vehicle update ---------- */
function updateVehicle(v, dt) {
  const dirv = DIRV[v.dir];
  const ni = v.i + dirv.x;
  const nj = v.j + dirv.y;
  const inBounds = (ni >= 0 && ni <= GRID && nj >= 0 && nj <= GRID);
  const distToNode = S - v.t;

  let desired = v.maxSpeed;

  // ---- traffic light ----
  if (inBounds && !v.ignoreLights) {
    const st = getLightState(ni, nj, v.dir, worldTime);
    if (st !== 'g' && distToNode > 7 && distToNode < 36) {
      const d = distToNode - 7;
      desired = Math.min(desired, Math.sqrt(Math.max(0, 2 * 5.5 * d)));
    }
  }

  // ---- corner slow-down (hero) ----
  if (v.isHero && inBounds && v.pendingDir !== v.dir && distToNode < 24) {
    desired = Math.min(desired, v.maxSpeed * 0.52);
  }

  // ---- car following ----
  let gap = 1e9;
  for (let k = 0; k < VEHICLES.length; k++) {
    const o = VEHICLES[k];
    if (o === v) continue;
    if (o.i === v.i && o.j === v.j && o.dir === v.dir && o.t > v.t) {
      const g = o.t - v.t;
      if (g < gap) gap = g;
    }
  }

  // ---- hero overtaking ----
  if (v.isHero) {
    if (!v.overtaking && gap < 21 && v.speed > 13) {
      v.overtaking = true;
      v.otTimer = 0;
    }
    if (v.overtaking) {
      v.otTimer += dt;
      v.laneTarget = -LANE * 0.9;
      if (v.otTimer > 2.6 || gap > 34) v.overtaking = false;
    } else {
      v.laneTarget = LANE;
    }
  }

  const gapLimit = v.overtaking ? 7 : 22;
  if (gap < gapLimit) {
    const g = gap - 5.6;
    if (g <= 0) desired = 0;
    else desired = Math.min(desired, Math.sqrt(Math.max(0, 2 * 6.5 * g)));
  }

  // ---- longitudinal integration ----
  if (v.speed < desired) {
    v.speed = Math.min(desired, v.speed + v.accel * dt);
  } else {
    v.speed = Math.max(desired, v.speed - v.brake * dt);
  }
  if (v.speed < 0) v.speed = 0;

  // ---- advance along the network ----
  v.t += v.speed * dt;
  let guard = 0;
  while (v.t >= S && guard++ < 6) {
    v.t -= S;
    const fromDir = v.dir;
    v.i += DIRV[fromDir].x;
    v.j += DIRV[fromDir].y;
    v.dir = v.pendingDir;
    v.pendingDir = chooseDir(v.i, v.j, v.dir, v);
  }

  // ---- lateral smoothing ----
  v.lane += (v.laneTarget - v.lane) * Math.min(1, dt * 2.6);

  // ---- position smoothing ----
  lanePos(v.i, v.j, v.dir, v.t, v.lane, _tmpV);
  const k = 1 - Math.exp(-dt * 11);
  v.prevPos.copy(v.pos);
  v.pos.lerp(_tmpV, k);

  // ---- heading from actual motion ----
  const dx = v.pos.x - v.prevPos.x;
  const dz = v.pos.z - v.prevPos.z;
  if (dx * dx + dz * dz > 1e-7) {
    const target = Math.atan2(dx, dz);
    v.heading = angleLerp(v.heading, target, Math.min(1, dt * 13));
  }

  // ---- drift ----
  let turnRate = 0;
  if (dt > 1e-4) turnRate = angleDiff(v.prevHeading, v.heading) / dt;
  v.prevHeading = v.heading;

  const targetDrift = v.isHero ? clamp(turnRate * v.speed * 0.05, -0.55, 0.55) : 0;
  v.drift += (targetDrift - v.drift) * Math.min(1, dt * 6);

  v.mesh.position.copy(v.pos);
  v.mesh.rotation.y = v.heading + v.drift;

  // ---- police flashers ----
  if (v.isPolice && v.mesh.userData.policeMats.length) {
    v.flashTimer += dt;
    const on = Math.floor(v.flashTimer * 7) % 2 === 0;
    const [rm, bm] = v.mesh.userData.policeMats;
    rm.color.setRGB(on ? 1 : 0.06, 0.02, 0.02);
    bm.color.setRGB(0.02, 0.05, on ? 1 : 0.06);
  }
}

   PEDESTRIANS

const PEDS = [];
const pedBodyGeo = new THREE.CapsuleGeometry(0.25, 1.0, 4, 8);
const pedHeadGeo = new THREE.SphereGeometry(0.22, 8, 6);
const pedHeadMat = new THREE.MeshLambertMaterial({ color: 0xd9a882 });
const pedMats = [];
{
  const hues = [0.02, 0.08, 0.33, 0.55, 0.62, 0.85, 0.12];
  for (const h of hues) {
    pedMats.push(new THREE.MeshLambertMaterial({
      color: new THREE.Color().setHSL(h, rand(0.25, 0.6), rand(0.32, 0.6))
    }));
  }
}

function pedPoint(s, h) {
  const P = 8 * h;
  let p = s % P;
  if (p < 0) p += P;
  if (p < 2 * h) return { x: -h + p, z: -h, ang: Math.PI / 2 };
  if (p < 4 * h) return { x: h, z: -h + (p - 2 * h), ang: 0 };
  if (p < 6 * h) return { x: h - (p - 4 * h), z: h, ang: -Math.PI / 2 };
  return { x: -h, z: h - (p - 6 * h), ang: Math.PI };
}

function buildPedestrians() {
  const count = Math.min(76, pedBlocks.length * 2);
  for (let n = 0; n < count; n++) {
    const b = pedBlocks[randInt(0, pedBlocks.length - 1)];
    const h = b.h;
    const mat = pedMats[randInt(0, pedMats.length - 1)];
    const g = new THREE.Group();
    const body = new THREE.Mesh(pedBodyGeo, mat);
    body.position.y = 0.98;
    const head = new THREE.Mesh(pedHeadGeo, pedHeadMat);
    head.position.y = 1.68;
    g.add(body, head);
    scene.add(g);
    PEDS.push({
      block: b,
      h,
      s: rand(0, 8 * h),
      dirSign: Math.random() < 0.5 ? 1 : -1,
      speed: rand(1.0, 1.9),
      phase: Math.random() * 6.28,
      mesh: g
    });
  }
}
buildPedestrians();

function updatePedestrians(dt, t) {
  for (const p of PEDS) {
    p.s += p.speed * p.dirSign * dt;
    const pt = pedPoint(p.s, p.h);
    const bob = Math.abs(Math.sin(t * 6.5 + p.phase)) * 0.07;
    p.mesh.position.set(p.block.x + pt.x, SW_H + bob, p.block.z + pt.z);
    p.mesh.rotation.y = p.dirAngle !== undefined ? p.dirAngle : pt.ang;
    p.mesh.rotation.y = pt.ang + (p.dirSign < 0 ? Math.PI : 0);
  }
}

/* ============================================================
   ENVIRONMENT / DAY-NIGHT
   ============================================================ */
const CC = {
  topDay: new THREE.Color(0x2f6fd0),
  topNight: new THREE.Color(0x04060e),
  botDay: new THREE.Color(0xa9c9e8),
  botNight: new THREE.Color(0x0b1220),
  dusk: new THREE.Color(0xe0763a),
  sunDay: new THREE.Color(0xfff3e0),
  sunDusk: new THREE.Color(0xff8a3c)
};
const _c = new THREE.Color();
const _sunDir = new THREE.Vector3();

function updateEnvironment(t) {
  const dayPhase = (0.17 + t / 72) % 1;
  const a = dayPhase * Math.PI * 2;
  _sunDir.set(Math.cos(a) * 0.55, Math.sin(a), Math.cos(a) * 0.75).normalize();

  const elev = _sunDir.y;
  const dayF = clamp((elev + 0.15) / 0.4, 0, 1);
  const duskF = clamp(1 - Math.abs(elev) / 0.22, 0, 1);
  const night = 1 - dayF;

  // sky
  _c.copy(CC.topNight).lerp(CC.topDay, dayF);
  _c.lerp(CC.dusk, duskF * 0.72);
  skyUniforms.top.value.copy(_c);

  _c.copy(CC.botNight).lerp(CC.botDay, dayF);
  _c.lerp(CC.dusk, duskF * 0.85);
  skyUniforms.bottom.value.copy(_c);

  skyUniforms.sunDir.value.copy(_sunDir);

  _c.copy(CC.sunDusk).lerp(CC.sunDay, clamp(elev / 0.35, 0, 1));
  skyUniforms.sunColor.value.copy(_c);

  // lights
  sunLight.position.copy(_sunDir).multiplyScalar(320);
  sunLight.color.copy(_c);
  sunLight.intensity = clamp(elev * 1.7, 0, 1.8);

  moonLight.position.copy(_sunDir).multiplyScalar(-320);
  moonLight.intensity = clamp(-elev * 0.9, 0, 0.35);

  hemi.intensity = 0.16 + dayF * 0.78;

  // fog
  scene.fog.color.copy(skyUniforms.bottom.value).lerp(skyUniforms.top.value, 0.25);

  // stars
  starMat.opacity = clamp(night * 1.5 - 0.4, 0, 0.85);

  // artificial lights
  const lightsOn = clamp((0.34 - dayF) / 0.34, 0, 1);
  lampGlowMat.opacity = lightsOn * 0.55;
  lampHeadMat.color.setRGB(lightsOn, lightsOn * 0.93, lightsOn * 0.72);
  headMat.color.setRGB(lightsOn, lightsOn * 0.96, lightsOn * 0.82);
  tailMat.color.setRGB(lightsOn * 0.9, 0.05 * lightsOn, 0.05 * lightsOn);

  const eR = lightsOn * 0.85, eG = lightsOn * 0.70, eB = lightsOn * 0.46;
  for (const m of buildingMats) m.emissive.setRGB(eR, eG, eB);

  return { dayF, night, lightsOn };
}

/* ============================================================
   CAMERA
   ============================================================ */
const camState = {
  mode: 'chase',
  timer: 0,
  duration: 5,
  pos: new THREE.Vector3(0, 10, 20),
  look: new THREE.Vector3(),
  initialised: false
};
const _desiredPos = new THREE.Vector3();
const _desiredLook = new THREE.Vector3();
const _fwd = new THREE.Vector3();
const _right = new THREE.Vector3();
const MODES = ['chase', 'chase', 'chase', 'chase', 'side', 'front', 'low', 'top'];

function updateCamera(dt) {
  const h = HERO;
  _fwd.set(Math.sin(h.heading), 0, Math.cos(h.heading));
  _right.set(_fwd.z, 0, -_fwd.x);

  camState.timer += dt;
  if (camState.timer >= camState.duration) {
    camState.timer = 0;
    camState.mode = MODES[randInt(0, MODES.length - 1)];
    camState.duration = camState.mode === 'chase' ? rand(4.5, 7) : rand(2.6, 3.8);
  }

  const speedN = clamp(h.speed / 30, 0, 1);

  switch (camState.mode) {
    case 'side':
      _desiredPos.copy(h.pos).addScaledVector(_right, 9.5).addScaledVector(_fwd, 1.5);
      _desiredPos.y = 2.4;
      _desiredLook.copy(h.pos).addScaledVector(_fwd, 2);
      _desiredLook.y = 1.0;
      break;
    case 'front':
      _desiredPos.copy(h.pos).addScaledVector(_fwd, 10).addScaledVector(_right, -1.5);
      _desiredPos.y = 1.5;
      _desiredLook.copy(h.pos).addScaledVector(_fwd, -1);
      _desiredLook.y = 0.9;
      break;
    case 'low':
      _desiredPos.copy(h.pos).addScaledVector(_right, 3.2).addScaledVector(_fwd, -2.5);
      _desiredPos.y = 0.75;
      _desiredLook.copy(h.pos).addScaledVector(_fwd, 7);
      _desiredLook.y = 0.7;
      break;
    case 'top':
      _desiredPos.copy(h.pos).addScaledVector(_fwd, -6);
      _desiredPos.y = 30;
      _desiredLook.copy(h.pos).addScaledVector(_fwd, 5);
      _desiredLook.y = 0;
      break;
    default: // chase
      _desiredPos.copy(h.pos)
        .addScaledVector(_fwd, -8.5 - speedN * 2.5)
        .addScaledVector(_right, -h.drift * 4);
      _desiredPos.y = 3.9 + speedN * 0.5;
      _desiredLook.copy(h.pos).addScaledVector(_fwd, 9);
      _desiredLook.y = 1.4;
      break;
  }

  const k = camState.mode === 'chase' ? 6.5 : 3.4;
  const s = 1 - Math.exp(-dt * k);

  if (!camState.initialised) {
    camState.pos.copy(_desiredPos);
    camState.look.copy(_desiredLook);
    camState.initialised = true;
  } else {
    camState.pos.lerp(_desiredPos, s);
    camState.look.lerp(_desiredLook, 1 - Math.exp(-dt * (k * 1.6)));
  }

  camera.position.copy(camState.pos);
  camera.lookAt(camState.look);

  // subtle speed FOV
  const targetFov = 62 + speedN * 9;
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 2);
  camera.updateProjectionMatrix();
}

/* ============================================================
   MINIMAP + HUD
   ============================================================ */
const mapCanvas = document.getElementById('minimap');
const mctx = mapCanvas.getContext('2d');
const MAP_SIZE = 172;
const MAP_RANGE = 240;
const MAP_S = MAP_SIZE / MAP_RANGE;

const speedoEl = document.getElementById('speedo');
const wantedEl = document.getElementById('wanted');
const spdSpan = document.createElement('span');
speedoEl.innerHTML = '';
speedoEl.appendChild(spdSpan);
const unitSmall = document.createElement('small');
unitSmall.textContent = 'KM/H';
speedoEl.appendChild(unitSmall);

function drawMinimap() {
  const h = HERO;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);

  mctx.save();
  mctx.beginPath();
  mctx.rect(0, 0, MAP_SIZE, MAP_SIZE);
  mctx.clip();

  mctx.fillStyle = '#0d1117';
  mctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

  mctx.translate(MAP_SIZE / 2, MAP_SIZE / 2);
  mctx.scale(MAP_S, MAP_S);
  mctx.translate(-h.pos.x, -h.pos.z);

  // roads
  mctx.strokeStyle = '#2c3540';
  mctx.lineWidth = ROAD;
  mctx.lineCap = 'butt';
  mctx.beginPath();
  const ext = HALF + 12;
  for (let i = 0; i <= GRID; i++) {
    const p = i * S - HALF;
    mctx.moveTo(p, -ext); mctx.lineTo(p, ext);
    mctx.moveTo(-ext, p); mctx.lineTo(ext, p);
  }
  mctx.stroke();

  // center lines
  mctx.strokeStyle = 'rgba(255,220,110,0.25)';
  mctx.lineWidth = 0.8;
  mctx.beginPath();
  for (let i = 0; i <= GRID; i++) {
    const p = i * S - HALF;
    mctx.moveTo(p, -ext); mctx.lineTo(p, ext);
    mctx.moveTo(-ext, p); mctx.lineTo(ext, p);
  }
  mctx.stroke();

  mctx.restore();

  // dots in screen space
  const cx = MAP_SIZE / 2, cy = MAP_SIZE / 2;
  const toScreen = (x, z) => [cx + (x - h.pos.x) * MAP_S, cy + (z - h.pos.z) * MAP_S];

  // traffic
  mctx.fillStyle = 'rgba(200,220,255,0.75)';
  for (let k = 1; k < VEHICLES.length; k++) {
    const v = VEHICLES[k];
    if (v.isPolice) continue;
    const [px, py] = toScreen(v.pos.x, v.pos.z);
    if (px < 2 || px > MAP_SIZE - 2 || py < 2 || py > MAP_SIZE - 2) continue;
    mctx.fillRect(px - 1.4, py - 1.4, 2.8, 2.8);
  }

  // police
  for (const v of POLICE) {
    const [px, py] = toScreen(v.pos.x, v.pos.z);
    if (px < 2 || px > MAP_SIZE - 2 || py < 2 || py > MAP_SIZE - 2) continue;
    mctx.fillStyle = '#ff3b30';
    mctx.beginPath();
    mctx.arc(px, py, 3.0, 0, 6.283);
    mctx.fill();
  }

  // hero arrow
  const [hx, hy] = toScreen(h.pos.x, h.pos.z);
  mctx.save();
  mctx.translate(hx, hy);
  mctx.rotate(Math.atan2(Math.sin(h.heading), Math.cos(h.heading)) * 0 + h.heading);
  mctx.fillStyle = '#38ffa8';
  mctx.beginPath();
  mctx.moveTo(0, -5.5);
  mctx.lineTo(3.6, 4.2);
  mctx.lineTo(0, 2.2);
  mctx.lineTo(-3.6, 4.2);
  mctx.closePath();
  mctx.fill();
  mctx.restore();

  // border vignette
  mctx.strokeStyle = 'rgba(255,255,255,0.08)';
  mctx.lineWidth = 2;
  mctx.strokeRect(1, 1, MAP_SIZE - 2, MAP_SIZE - 2);
}

function updateHUD() {
  const kmh = Math.round(HERO.speed * 3.6);
  if (spdSpan.textContent !== String(kmh)) spdSpan.textContent = String(kmh);

  let stars = '';
  for (let i = 0; i < 5; i++) stars += (i < WANTED ? '★' : '☆');
  wantedEl.textContent = WANTED > 0 ? stars : '';
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastTime = performance.now();
let elapsed = 0;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  elapsed += dt;
  worldTime += dt;

  updateEnvironment(elapsed);
  updateTrafficLightVisuals(worldTime);

  // hero first (index 0), then everybody else
  for (let i = 0; i < VEHICLES.length; i++) updateVehicle(VEHICLES[i], dt);

  updatePedestrians(dt, elapsed);
  updateWanted(elapsed);
  updateCamera(dt);
  drawMinimap();
  updateHUD();

  renderer.render(scene, camera);
}

// initial warm-up so the very first frame looks right
updateTrafficLightVisuals(0);
updateEnvironment(0);
for (let i = 0; i < 6; i++) {
  for (const v of VEHICLES) updateVehicle(v, 1 / 60);
}
updateCamera(1 / 60);

requestAnimationFrame(animate);
</script>

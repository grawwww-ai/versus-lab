<!DOCTYPE html>
<html lang="en">
<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle System Editor</title>
<style>
  :root{
    --bg:#0a0d13;
    --panel:#121824;
    --panel-2:#1a2233;
    --text:#e6edf7;
    --muted:#8b9ab3;
    --accent:#4fd1ff;
    --border:#243044;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:radial-gradient(1200px 800px at 50% 0%, #101827 0%, var(--bg) 60%);
    color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    padding:16px;
    gap:14px;
  }

  header{
    flex:0 0 auto;
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
  }
  h1{
    margin:0;
    font-size:16px;
    font-weight:600;
    letter-spacing:.6px;
  }
  h1 span{ color:var(--accent); }
  header .sub{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.3px;
  }

  main{
    flex:1 1 auto;
    display:flex;
    gap:14px;
    min-height:0;
  }

  .stage{
    position:relative;
    flex:1 1 auto;
    min-width:0;
    min-height:0;
    border-radius:14px;
    border:1px solid var(--border);
    background:#05070b;
    overflow:hidden;
    box-shadow: inset 0 0 80px rgba(0,0,0,.9), 0 10px 40px rgba(0,0,0,.45);
  }
  #cv{
    display:block;
    width:100%;
    height:100%;
  }

  .hud{
    position:absolute;
    top:10px;
    left:12px;
    font-size:12px;
    font-variant-numeric:tabular-nums;
    color:var(--muted);
    background:rgba(10,14,22,.62);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 10px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events:none;
    white-space:nowrap;
  }
  .hud b{ color:var(--accent); font-weight:600; }

  .panel{
    flex:0 0 292px;
    background:linear-gradient(180deg, var(--panel), #0f1420);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:16px;
    overflow:auto;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  .panel::-webkit-scrollbar{ width:8px; }
  .panel::-webkit-scrollbar-thumb{
    background:#1e2a3d; border-radius:99px;
  }

  .control{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .control .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .control .name{
    font-size:11px;
    letter-spacing:.9px;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
  }
  .val{
    font-size:11.5px;
    font-variant-numeric:tabular-nums;
    font-weight:600;
    color:var(--accent);
    background:rgba(79,209,255,.08);
    border:1px solid rgba(79,209,255,.22);
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
  }

  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:6px;
    border-radius:999px;
    background:#1e2a3d;
    outline:none;
    cursor:pointer;
    margin:6px 0;
    border:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid #071018;
    box-shadow:0 0 10px rgba(79,209,255,.75);
    cursor:pointer;
    transition:transform .12s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover{ transform:scale(1.12); }
  input[type=range]::-moz-range-track{
    height:6px;
    border-radius:999px;
    background:#1e2a3d;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid #071018;
    box-shadow:0 0 10px rgba(79,209,255,.75);
    cursor:pointer;
  }
  input[type=range]:focus-visible{
    box-shadow:0 0 0 3px rgba(79,209,255,.25);
  }

  input[type=color]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:40px;
    padding:4px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel-2);
    cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:0; }
  input[type=color]::-webkit-color-swatch{
    border:none;
    border-radius:7px;
  }
  input[type=color]::-moz-color-swatch{
    border:none;
    border-radius:7px;
  }

  .btn{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:.4px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, transform .08s ease;
    user-select:none;
  }
  .btn:hover{ border-color:#3a4d6b; background:#1f2938; }
  .btn:active{ transform:translateY(1px); }
  .btn .state{
    font-size:11px;
    font-weight:700;
    letter-spacing:.8px;
    padding:2px 9px;
    border-radius:999px;
    background:#233046;
    color:var(--muted);
    transition: all .18s ease;
  }
  .btn.on{
    border-color:rgba(79,209,255,.55);
    background:linear-gradient(180deg,#16283a,#121b28);
    box-shadow: inset 0 0 22px rgba(79,209,255,.10), 0 0 18px rgba(79,209,255,.08);
  }
  .btn.on .state{
    background:rgba(79,209,255,.18);
    color:var(--accent);
    box-shadow:0 0 12px rgba(79,209,255,.28);
  }
  .btn.center{ justify-content:center; }
  .btn:focus-visible{ outline:2px solid rgba(79,209,255,.55); outline-offset:2px; }

  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--border), transparent);
    margin:2px 0;
  }

  .hint{
    font-size:11px;
    color:#5d6b82;
    line-height:1.55;
  }

  @media (max-width: 820px){
    main{ flex-direction:column; }
    .panel{
      flex:0 0 auto;
      max-height:46%;
      flex-direction:row;
      flex-wrap:wrap;
      gap:14px 18px;
    }
    .panel .control{ flex:1 1 180px; }
    .panel .divider{ display:none; }
    .panel .hint{ flex:1 1 100%; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Particle <span>System</span> Editor</h1>
    <div class="sub">canvas-based emitter · vanilla JS</div>
  </header>

  <main>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud">FPS <b id="fpsVal">--</b> &nbsp;·&nbsp; <b id="countVal">0</b> particles</div>
    </div>

    <aside class="panel">
      <div class="control">
        <div class="row">
          <span class="name">Emission Rate</span>
          <span class="val" id="rateVal">150 /s</span>
        </div>
        <input type="range" id="rate" min="0" max="800" step="1" value="150">
      </div>

      <div class="control">
        <div class="row">
          <span class="name">Particle Speed</span>
          <span class="val" id="speedVal">170 px/s</span>
        </div>
        <input type="range" id="speed" min="10" max="700" step="1" value="170">
      </div>

      <div class="control">
        <div class="row">
          <span class="name">Lifetime</span>
          <span class="val" id="lifetimeVal">1.8 s</span>
        </div>
        <input type="range" id="lifetime" min="0.2" max="6" step="0.1" value="1.8">
      </div>

      <div class="control">
        <div class="row">
          <span class="name">Particle Color</span>
          <span class="val" id="colorVal">#4FD1FF</span>
        </div>
        <input type="color" id="color" value="#4fd1ff">
      </div>

      <div class="divider"></div>

      <div class="control">
        <button class="btn on" id="gravityBtn" type="button">
          <span>Gravity</span>
          <span class="state" id="gravityState">ON</span>
        </button>
      </div>

      <div class="control">
        <button class="btn center" id="clearBtn" type="button">Clear Particles</button>
      </div>

      <div class="divider"></div>

      <div class="hint">
        Particles emit from the center of the stage, inherit velocity in a random direction,
        and fade out smoothly over their lifetime.
      </div>
    </aside>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------
     Setup
  --------------------------------------------------------------- */
  var stage      = document.getElementById('stage');
  var cv         = document.getElementById('cv');
  var ctx        = cv.getContext('2d');
  var fpsEl      = document.getElementById('fpsVal');
  var countEl    = document.getElementById('countVal');

  var TAU              = Math.PI * 2;
  var MAX_PARTICLES    = 8000;
  var GRAVITY_ACCEL    = 420;   // px / s^2
  var CULL_MARGIN      = 140;   // px outside the canvas before culling

  var state = {
    rate:     150,      // particles per second
    speed:    170,      // px per second
    lifetime: 1.8,      // seconds
    color:    '#4fd1ff',
    gravity:  true
  };

  var W = 1, H = 1;         // canvas size in CSS pixels
  var particles = [];
  var sprite = null;        // pre-rendered glow sprite (recolored on color change)

  /* ---------------------------------------------------------------
     Canvas sizing (device-pixel-ratio aware)
  --------------------------------------------------------------- */
  function resize() {
    var rect = stage.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(stage);
  } else {
    window.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------------------------------------------------------------
     Color helpers + glow sprite
  --------------------------------------------------------------- */
  function hexToRgb(hex) {
    var h = String(hex || '').replace('#', '').trim();
    if (h.length === 3) {
      h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
    }
    var n = parseInt(h, 16);
    if (isNaN(n)) return { r: 79, g: 209, b: 255 };
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function buildSprite() {
    var size = 64;
    var c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    var sctx = c.getContext('2d');
    var rgb = hexToRgb(state.color);
    var base = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',';

    var g = sctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0.00, base + '1)');
    g.addColorStop(0.22, base + '0.75)');
    g.addColorStop(0.50, base + '0.22)');
    g.addColorStop(1.00, base + '0)');

    sctx.fillStyle = g;
    sctx.fillRect(0, 0, size, size);
    sprite = c;
  }

  /* ---------------------------------------------------------------
     Particle system
  --------------------------------------------------------------- */
  function spawn() {
    var ex = W * 0.5;
    var ey = H * 0.5;

    var ang  = Math.random() * TAU;
    var spd  = state.speed * (0.35 + Math.random() * 1.05);
    var life = state.lifetime * (0.6 + Math.random() * 0.8);

    particles.push({
      x: ex + Math.cos(ang) * 3,
      y: ey + Math.sin(ang) * 3,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: life,
      maxLife: life,
      size: 0.65 + Math.random() * 1.15
    });
  }

  function update(dt) {
    var g = state.gravity ? GRAVITY_ACCEL : 0;

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;

      if (p.life <= 0) {
        particles[i] = particles[particles.length - 1];
        particles.pop();
        continue;
      }

      p.vy += g * dt;
      p.x  += p.vx * dt;
      p.y  += p.vy * dt;

      if (p.x < -CULL_MARGIN || p.x > W + CULL_MARGIN ||
          p.y < -CULL_MARGIN || p.y > H + CULL_MARGIN) {
        particles[i] = particles[particles.length - 1];
        particles.pop();
      }
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    var ex = W * 0.5;
    var ey = H * 0.5;
    var rgb = hexToRgb(state.color);
    var base = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',';

    /* Emitter glow */
    var glow = ctx.createRadialGradient(ex, ey, 0, ex, ey, 72);
    glow.addColorStop(0,   base + '0.30)');
    glow.addColorStop(0.35, base + '0.09)');
    glow.addColorStop(1,   base + '0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(ex, ey, 72, 0, TAU);
    ctx.fill();

    /* Particles */
    if (sprite) {
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var t = p.life / p.maxLife;           // 1 -> 0
        var alpha = t * t * 0.9;              // fade out over lifetime
        var r = p.size * (0.45 + 0.95 * t) * 3.2;

        ctx.globalAlpha = alpha;
        ctx.drawImage(sprite, p.x - r, p.y - r, r * 2, r * 2);
      }
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------------------------------------------------------------
     Main loop
  --------------------------------------------------------------- */
  var last = performance.now();
  var emitAcc = 0;
  var fpsSmooth = 60;
  var fpsTimer = 0;

  function loop(now) {
    var dtRaw = (now - last) / 1000;
    last = now;

    var dt = dtRaw;
    if (dt > 0.05) dt = 0.05;      // clamp large gaps (tab switch, hitches)
    if (dt < 0)    dt = 0;

    /* FPS meter */
    if (dtRaw > 0) {
      fpsSmooth += ((1 / dtRaw) - fpsSmooth) * 0.08;
    }
    fpsTimer += dtRaw;
    if (fpsTimer >= 0.25) {
      fpsTimer = 0;
      fpsEl.textContent = Math.round(fpsSmooth);
      countEl.textContent = particles.length;
    }

    /* Emission */
    emitAcc += state.rate * dt;
    var toSpawn = Math.floor(emitAcc);
    emitAcc -= toSpawn;
    while (toSpawn-- > 0 && particles.length < MAX_PARTICLES) {
      spawn();
    }

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  /* ---------------------------------------------------------------
     UI wiring
  --------------------------------------------------------------- */
  function bindSlider(id, key, format) {
    var input = document.getElementById(id);
    var label = document.getElementById(id + 'Val');

    function sync() {
      state[key] = parseFloat(input.value);
      label.textContent = format(state[key]);
    }

    input.addEventListener('input', sync);
    sync();
  }

  bindSlider('rate', 'rate', function (v) {
    return Math.round(v) + ' /s';
  });

  bindSlider('speed', 'speed', function (v) {
    return Math.round(v) + ' px/s';
  });

  bindSlider('lifetime', 'lifetime', function (v) {
    return v.toFixed(1) + ' s';
  });

  /* Color picker */
  var colorInput = document.getElementById('color');
  var colorVal   = document.getElementById('colorVal');

  colorInput.addEventListener('input', function () {
    state.color = colorInput.value;
    colorVal.textContent = colorInput.value.toUpperCase();
    buildSprite();
  });
  colorVal.textContent = colorInput.value.toUpperCase();

  /* Gravity toggle */
  var gravityBtn   = document.getElementById('gravityBtn');
  var gravityState = document.getElementById('gravityState');

  gravityBtn.addEventListener('click', function () {
    state.gravity = !state.gravity;
    gravityBtn.classList.toggle('on', state.gravity);
    gravityState.textContent = state.gravity ? 'ON' : 'OFF';
  });

  /* Clear */
  document.getElementById('clearBtn').addEventListener('click', function () {
    particles.length = 0;
    emitAcc = 0;
    countEl.textContent = '0';
  });

  /* ---------------------------------------------------------------
     Auto-start
  --------------------------------------------------------------- */
  buildSprite();
  resize();
  requestAnimationFrame(function (t) {
    last = t;
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>

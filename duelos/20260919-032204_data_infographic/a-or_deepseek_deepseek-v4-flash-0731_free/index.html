<!DOCTYPE html>
<html lang="es">
<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas del año</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            padding: 1.5rem;
        }

        .infographic {
            width: 100%;
            max-width: 1150px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 1.8rem;
            padding: 1.6rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
            display: grid;
            grid-template-columns: 1.7fr 1fr;
            gap: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ----- Panel principal ----- */
        .chart-panel {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1.3rem;
            padding: 1.3rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
        }

        .chart-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .chart-head h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
            letter-spacing: 0.02em;
        }

        .chart-legend {
            background: rgba(45, 212, 191, 0.08);
            color: #2dd4bf;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.72rem;
            border: 1px solid rgba(45, 212, 191, 0.2);
        }

        .chart-wrap {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .chart {
            position: absolute;
            inset: 0;
            display: flex;
            gap: 0.35rem;
            align-items: stretch;
            padding-top: 0.5rem;
            /* padding para que el valor máximo no toque el borde superior */
        }

        .bar-group {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
        }

        .bar-track {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .bar {
            width: 55%;
            max-width: 3.5rem;
            background: linear-gradient(180deg, #38bdf8, #0ea5e9);
            border-radius: 0.35rem 0.35rem 0 0;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            transition: height 1s cubic-bezier(0.22, 0.8, 0.25, 1);
            box-shadow: 0 -4px 12px rgba(14, 165, 233, 0.25);
            min-height: 0;
            height: 0;
        }

        .bar-value {
            font-size: 0.5rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
            padding-top: 0.3rem;
            white-space: nowrap;
            pointer-events: none;
            letter-spacing: -0.02em;
        }

        .bar-label {
            text-align: center;
            font-size: 0.62rem;
            padding-top: 0.45rem;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.03em;
            height: 2.2em;
            line-height: 1.4;
        }

        /* Barra del mejor mes */
        .bar-group:last-child .bar {
            background: linear-gradient(180deg, #f59e0b, #f97316);
        }

        .bar-group:last-child .bar-value {
            color: #fffbe6;
        }

        /* ----- KPIs ----- */
        .kpis {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            justify-content: center;
        }

        .kpi-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1rem;
            padding: 1.1rem 1.3rem;
            text-align: center;
        }

        .kpi-card.best {
            background: rgba(251, 146, 60, 0.06);
            border-color: rgba(251, 146, 60, 0.15);
        }

        .kpi-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #7dd3fc;
            margin-bottom: 0.25rem;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.3;
        }

        .kpi-unit {
            font-size: 0.72rem;
            color: #94a3b8;
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>

    <div class="infographic">
        <!-- Panel del gráfico -->
        <div class="chart-panel">
            <div class="chart-head">
                <h2>Ventas mensuales</h2>
                <span class="chart-legend">Confirmado</span>
            </div>
            <div class="chart" id="chart"></div>
        </div>

        <!-- KPIs -->
        <div class="kpis">
            <div class="kpi-card">
                <div class="kpi-label">Promedio</div>
                <div class="kpi-value" data-target="3147">0</div>
                <div class="kpi-unit">Ventas / mes</div>
            </div>
            <div class="kpi-card best">
                <div class="kpi-label">⭐ Mejor mes</div>
                <div class="kpi-value" data-target="4210">0</div>
                <div class="kpi-unit">Julio</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Total</div>
                <div class="kpi-value" data-target="37764">0</div>
                <div class="kpi-unit">Ventas anuales</div>
            </div>
        </div>
    </div>

    <script>
        // Datos de ventas por mes (enero = 0, julio = 6, etc.)
        const data = [2140, 2380, 2915, 3060, 3475, 3890, 4210, 4035, 3380, 2890, 2520, 2869];
        const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

        // Referencias
        const chart = document.getElementById('chart');
        const maxVal = Math.max(...data);

        // Crear gráfico con todos los meses
        function crearBarras() {
            chart.innerHTML = '';
            data.forEach((valor, i) => {
                const grupo = document.createElement('div');
                grupo.className = 'bar-group';

                const track = document.createElement('div');
                track.className = 'bar-track';

                const barra = document.createElement('div');
                barra.className = 'bar';
                barra.dataset.valor = valor;
                barra.style.height = '0px';

                const spanValor = document.createElement('span');
                spanValor.className = 'bar-value';
                spanValor.textContent = i === 6 ? '★ ' + valor.toLocaleString('es-ES') : valor.toLocaleString('es-ES');
                barra.appendChild(spanValor);

                const label = document.createElement('div');
                label.className = 'bar-label';
                label.textContent = meses[i];

                track.appendChild(barra);
                grupo.appendChild(track);
                grupo.appendChild(label);
                chart.appendChild(grupo);
            });
        }

        // Iniciar animación de crecimiento de barras
        function animarBarras() {
            const grupos = chart.querySelectorAll('.bar-group');
            const trackHeight = chart.querySelector('.bar-track').clientHeight;
            const escala = trackHeight / maxVal;

            grupos.forEach((grupo, i) => {
                const barra = grupo.querySelector('.bar');
                const valor = parseInt(barra.dataset.valor, 10);
                const altura = valor * escala;

                // Retraso escalonado de cada barra
                setTimeout(() => {
                    barra.style.height = altura + 'px';
                }, 150 + i * 60);
            });
        }

        // Animación de los contadores KPI
        function animarContador(el) {
            const objetivo = parseInt(el.dataset.target, 10);
            const duracion = 1200;
            const inicio = performance.now();

            function frame(ahora) {
                const progreso = Math.min((ahora - inicio) / duracion, 1);
                const actual = Math.floor(progreso * objetivo);
                el.textContent = actual.toLocaleString('es-ES');

                if (progreso < 1) {
                    requestAnimationFrame(frame);
                } else {
                    el.textContent = objetivo.toLocaleString('es-ES');
                }
            }
            requestAnimationFrame(frame);
        }

        // Inicializar al cargar
        window.addEventListener('load', () => {
            crearBarras();

            // Forzar reflow para medir altura real del track
            requestAnimationFrame(() => {
                animarBarras();
            });

            // Iniciar contadores
            document.querySelectorAll('.kpi-value[data-target]').forEach((el) => {
                el.textContent = '0';
                setTimeout(() => animarContador(el), 200);
            });
        });
    </script>

</body>
</html>

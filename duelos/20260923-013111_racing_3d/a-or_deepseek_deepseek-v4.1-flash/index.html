<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<meta charset="utf-8">

<style>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   RENDERER / SCENE / CAMERA
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY_BOTTOM = 0xcfe6ff;
scene.fog = new THREE.Fog(SKY_BOTTOM, 300, 1150);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.5, 4000);
camera.position.set(0, 12, -30);

/* =========================================================
   SKY
   ========================================================= */
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    topColor: { value: new THREE.Color(0x2360c4) },
    botColor: { value: new THREE.Color(0xd6ebff) },
    offset: { value: 140 },
    exponent: { value: 0.72 }
  },
  vertexShader: `
    varying vec3 vWorldPosition;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPosition = wp.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 botColor;
    uniform float offset;
    uniform float exponent;
    varying vec3 vWorldPosition;
    void main() {
      float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
      float f = pow(max(h, 0.0), exponent);
      gl_FragColor = vec4(mix(botColor, topColor, f), 1.0);
    }`,
  side: THREE.BackSide,
  depthWrite: false
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), skyMat);
sky.frustumCulled = false;
scene.add(sky);

/* Environment map from the sky for nice metal reflections */
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(60, 24, 12), skyMat.clone()));
  const rt = pmrem.fromScene(envScene, 0.05);
  scene.environment = rt.texture;
  scene.environmentIntensity = 0.85;
  pmrem.dispose();
}

/* =========================================================
   LIGHTS
   ========================================================= */
const hemi = new THREE.HemisphereLight(0xbfe0ff, 0x4d7a38, 1.15);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0cf, 2.3);
sun.position.set(90, 150, 70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -95;
sun.shadow.camera.right = 95;
sun.shadow.camera.top = 95;
sun.shadow.camera.bottom = -95;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 420;
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(sun.target);

/* =========================================================
   PROCEDURAL TEXTURES
   ========================================================= */
function makeAsphaltTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3b3e44';
  ctx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 5200; i++) {
    const g = 40 + Math.random() * 55;
    ctx.fillStyle = `rgba(${g},${g},${g + 4},0.55)`;
    ctx.fillRect(Math.random() * 128, Math.random() * 128, 1.6, 1.6);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function makeGrassTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#49853a';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 14000; i++) {
    const r = 40 + Math.random() * 55;
    const g = 100 + Math.random() * 70;
    const b = 30 + Math.random() * 45;
    ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},0.5)`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2.5, 2.5);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(70, 70);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function makeCheckerTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  const cols = 16, rows = 4;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      ctx.fillStyle = ((x + y) % 2 === 0) ? '#f7f7f7' : '#141414';
      ctx.fillRect(x * (256 / cols), y * (64 / rows), 256 / cols, 64 / rows);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

/* =========================================================
   TRACK CURVE
   ========================================================= */
const trackPts2D = [
  [   0, -175], [ 110, -198], [ 192, -126], [ 186,  -24],
  [ 116,   46], [ 138,  126], [  60,  182], [ -46,  172],
  [ -96,  106], [-176,   86], [-208,  -14], [-152,  -92],
  [-126, -166], [ -60, -202]
];
const trackPoints = trackPts2D.map(([x, z]) => new THREE.Vector3(x, 0, z));

const curve = new THREE.CatmullRomCurve3(trackPoints, true, 'catmullrom', 0.5);
curve.arcLengthDivisions = 3000;
const TRACK_LEN = curve.getLength();
const HALF_W = 8;          // half track width
const MAX_LAT = HALF_W - 2; // max lateral offset for cars
const TOTAL_LAPS = 3;

/* Curvature lookup table (1/radius approximated) */
const CURV_N = 1200;
const curvTable = new Float32Array(CURV_N);
{
  const ds = TRACK_LEN / CURV_N;
  for (let i = 0; i < CURV_N; i++) {
    const u = i / CURV_N;
    const t0 = curve.getTangentAt(u);
    const t1 = curve.getTangentAt((u + 1 / CURV_N) % 1);
    curvTable[i] = t0.angleTo(t1) / ds;
  }
}
function curvAt(u) {
  let f = (u % 1 + 1) % 1;
  const i = Math.floor(f * CURV_N) % CURV_N;
  return curvTable[i];
}

/* =========================================================
   GROUND
   ========================================================= */
const grassMat = new THREE.MeshStandardMaterial({
  map: makeGrassTexture(), color: 0x8fbf6a, roughness: 1, metalness: 0
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), grassMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.08;
ground.receiveShadow = true;
scene.add(ground);

/* =========================================================
   ROAD
   ========================================================= */
const SEG = 700;
{
  const positions = new Float32Array((SEG + 1) * 2 * 3);
  const uvs = new Float32Array((SEG + 1) * 2 * 2);
  const indices = [];

  for (let i = 0; i <= SEG; i++) {
    const u = (i % SEG) / SEG;
    const p = curve.getPointAt(u);
    const t = curve.getTangentAt(u);
    const side = new THREE.Vector3(-t.z, 0, t.x).normalize();
    const a = p.clone().addScaledVector(side, -HALF_W);
    const b = p.clone().addScaledVector(side, HALF_W);
    a.y = b.y = 0.02;

    const o = i * 6;
    positions[o] = a.x; positions[o + 1] = a.y; positions[o + 2] = a.z;
    positions[o + 3] = b.x; positions[o + 4] = b.y; positions[o + 5] = b.z;

    const uv = i * 4;
    uvs[uv] = 0; uvs[uv + 1] = i * 0.6;
    uvs[uv + 2] = 1; uvs[uv + 3] = i * 0.6;

    if (i < SEG) {
      const k = i * 2;
      indices.push(k, k + 1, k + 2, k + 1, k + 3, k + 2);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();

  const roadMat = new THREE.MeshStandardMaterial({
    map: makeAsphaltTexture(), color: 0x9a9a9a, roughness: 0.92, metalness: 0.05,
    side: THREE.DoubleSide
  });
  const road = new THREE.Mesh(g, roadMat);
  road.receiveShadow = true;
  scene.add(road);
}

/* =========================================================
   KERBS
   ========================================================= */
function buildKerb(sign) {
  const positions = [];
  const colors = [];
  const inner = HALF_W;
  const outer = HALF_W + 1.5;
  const y = 0.085;

  for (let i = 0; i < SEG; i++) {
    const u0 = i / SEG, u1 = (i + 1) / SEG;
    const p0 = curve.getPointAt(u0), p1 = curve.getPointAt(u1);
    const t0 = curve.getTangentAt(u0), t1 = curve.getTangentAt(u1);
    const s0 = new THREE.Vector3(-t0.z, 0, t0.x).normalize();
    const s1 = new THREE.Vector3(-t1.z, 0, t1.x).normalize();

    const a0 = p0.clone().addScaledVector(s0, sign * inner); a0.y = y;
    const b0 = p0.clone().addScaledVector(s0, sign * outer); b0.y = y;
    const a1 = p1.clone().addScaledVector(s1, sign * inner); a1.y = y;
    const b1 = p1.clone().addScaledVector(s1, sign * outer); b1.y = y;

    const c = (Math.floor(i / 5) % 2 === 0) ? [0.86, 0.10, 0.10] : [0.95, 0.95, 0.95];

    positions.push(
      a0.x, a0.y, a0.z, b0.x, b0.y, b0.z, a1.x, a1.y, a1.z,
      b0.x, b0.y, b0.z, b1.x, b1.y, b1.z, a1.x, a1.y, a1.z
    );
    for (let k = 0; k < 6; k++) colors.push(c[0], c[1], c[2]);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.computeVertexNormals();
  return g;
}

const kerbMat = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.85, metalness: 0.02, side: THREE.DoubleSide
});
scene.add(new THREE.Mesh(buildKerb(1), kerbMat));
scene.add(new THREE.Mesh(buildKerb(-1), kerbMat));

/* =========================================================
   START / FINISH LINE + GANTRY
   ========================================================= */
{
  const p0 = curve.getPointAt(0);
  const t0 = curve.getTangentAt(0);
  const yaw = Math.atan2(t0.x, t0.z);

  const group = new THREE.Group();
  group.position.set(p0.x, 0.05, p0.z);
  group.rotation.y = yaw;

  const lineMat = new THREE.MeshStandardMaterial({
    map: makeCheckerTexture(), roughness: 0.8, metalness: 0.0
  });
  const line = new THREE.Mesh(new THREE.PlaneGeometry(HALF_W * 2, 3), lineMat);
  line.rotation.x = -Math.PI / 2;
  group.add(line);

  const postMat = new THREE.MeshStandardMaterial({ color: 0xdedede, metalness: 0.6, roughness: 0.35 });
  const bannerMat = new THREE.MeshStandardMaterial({ color: 0xd6202e, metalness: 0.3, roughness: 0.5 });
  for (const sx of [-1, 1]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.7, 8, 0.7), postMat);
    post.position.set(sx * (HALF_W + 1.6), 4, 0);
    post.castShadow = true;
    group.add(post);
  }
  const banner = new THREE.Mesh(new THREE.BoxGeometry(HALF_W * 2 + 4.6, 1.6, 0.5), bannerMat);
  banner.position.set(0, 8.2, 0);
  banner.castShadow = true;
  group.add(banner);

  scene.add(group);
}

/* =========================================================
   TREES + BUILDINGS (instanced)
   ========================================================= */
const trackSamples = [];
for (let i = 0; i < 260; i++) trackSamples.push(curve.getPointAt(i / 260));

function distToTrack(x, z) {
  let best = Infinity;
  for (const s of trackSamples) {
    const dx = s.x - x, dz = s.z - z;
    const d = dx * dx + dz * dz;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}

{
  const N = 170;
  const dummy = new THREE.Object3D();
  const trunkGeo = new THREE.CylinderGeometry(0.28, 0.5, 3.2, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 0.95 });
  const leafGeo = new THREE.ConeGeometry(2.7, 7, 8);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f7a35, roughness: 0.95, flatShading: true });

  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, N);
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, N);
  trunks.castShadow = true; leaves.castShadow = true;

  let placed = 0, guard = 0;
  const leafColors = [new THREE.Color(0x2f7a35), new THREE.Color(0x3d8f3a), new THREE.Color(0x276b30), new THREE.Color(0x4a9c46)];
  while (placed < N && guard++ < 6000) {
    const x = (Math.random() - 0.5) * 900;
    const z = (Math.random() - 0.5) * 900;
    if (distToTrack(x, z) < HALF_W + 9) continue;
    const s = 0.75 + Math.random() * 0.9;

    dummy.position.set(x, 1.6 * s, z);
    dummy.rotation.set(0, Math.random() * Math.PI * 2, 0);
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    trunks.setMatrixAt(placed, dummy.matrix);

    dummy.position.set(x, (3.2 + 3.2) * s, z);
    dummy.updateMatrix();
    leaves.setMatrixAt(placed, dummy.matrix);
    leaves.setColorAt(placed, leafColors[(Math.random() * leafColors.length) | 0]);

    placed++;
  }
  trunks.count = placed;
  leaves.count = placed;
  scene.add(trunks, leaves);

  /* Buildings */
  const B = 26;
  const bGeo = new THREE.BoxGeometry(1, 1, 1);
  const bMat = new THREE.MeshStandardMaterial({ roughness: 0.75, metalness: 0.1 });
  const buildings = new THREE.InstancedMesh(bGeo, bMat, B);
  buildings.castShadow = true;
  buildings.receiveShadow = true;
  const bCols = [0xb8b2a6, 0x9aa4b0, 0xc9b89c, 0x8f8b86, 0xa8b6c2, 0xd0c3ae];
  let bPlaced = 0; guard = 0;
  while (bPlaced < B && guard++ < 6000) {
    const x = (Math.random() - 0.5) * 780;
    const z = (Math.random() - 0.5) * 780;
    if (distToTrack(x, z) < HALF_W + 42) continue;
    const w = 12 + Math.random() * 20;
    const d = 12 + Math.random() * 20;
    const h = 10 + Math.random() * 34;
    dummy.position.set(x, h / 2, z);
    dummy.rotation.set(0, Math.random() * Math.PI, 0);
    dummy.scale.set(w, h, d);
    dummy.updateMatrix();
    buildings.setMatrixAt(bPlaced, dummy.matrix);
    buildings.setColorAt(bPlaced, new THREE.Color(bCols[(Math.random() * bCols.length) | 0]));
    bPlaced++;
  }
  buildings.count = bPlaced;
  scene.add(buildings);
}

/* =========================================================
   CAR MODEL (primitives)
   ========================================================= */
function createCar(colorHex) {
  const group = new THREE.Group();
  const visual = new THREE.Group();
  group.add(visual);

  const bodyMat  = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.55, roughness: 0.28 });
  const darkMat  = new THREE.MeshStandardMaterial({ color: 0x15171c, metalness: 0.5, roughness: 0.55 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x9fd8ff, metalness: 0.9, roughness: 0.08, transparent: true, opacity: 0.55 });
  const headMat  = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffcc, emissiveIntensity: 1.6, roughness: 0.25 });
  const tailMat  = new THREE.MeshStandardMaterial({ color: 0x2a0303, emissive: 0xff2200, emissiveIntensity: 1.4, roughness: 0.35 });
  const chromeMat= new THREE.MeshStandardMaterial({ color: 0xd8dde6, metalness: 0.95, roughness: 0.2 });

  // main chassis
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 3.9), bodyMat);
  chassis.position.y = 0.62;
  visual.add(chassis);

  // lower skirt
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(1.96, 0.3, 3.5), darkMat);
  skirt.position.y = 0.34;
  visual.add(skirt);

  // nose
  const nose = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.34, 1.1), bodyMat);
  nose.position.set(0, 0.5, 2.35);
  visual.add(nose);

  // cockpit glass
  const cockpit = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.56, 1.8), glassMat);
  cockpit.position.set(0, 1.1, -0.25);
  visual.add(cockpit);

  // roof
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.34, 0.14, 1.35), bodyMat);
  roof.position.set(0, 1.39, -0.35);
  visual.add(roof);

  // rear deck
  const deck = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 1.0), bodyMat);
  deck.position.set(0, 0.95, -1.8);
  visual.add(deck);

  // spoiler
  const wing = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.09, 0.55), darkMat);
  wing.position.set(0, 1.36, -2.3);
  visual.add(wing);
  for (const sx of [-0.72, 0.72]) {
    const strut = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.42, 0.12), darkMat);
    strut.position.set(sx, 1.14, -2.26);
    visual.add(strut);
  }

  // headlights
  for (const sx of [-0.58, 0.58]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.17, 0.1), headMat);
    hl.position.set(sx, 0.6, 2.88);
    visual.add(hl);
  }
  // taillights
  for (const sx of [-0.62, 0.62]) {
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.17, 0.1), tailMat);
    tl.position.set(sx, 0.78, -2.62);
    visual.add(tl);
  }

  // wheels
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1e, roughness: 0.98 });
  const rimMat  = new THREE.MeshStandardMaterial({ color: 0xb9c0cc, metalness: 0.95, roughness: 0.25 });

  const wheelDefs = [
    [-0.98, 1.35, true], [0.98, 1.35, true],
    [-0.98, -1.55, false], [0.98, -1.55, false]
  ];
  const spinWheels = [];
  const steerWheels = [];

  for (const [wx, wz, isFront] of wheelDefs) {
    const steer = new THREE.Group();
    steer.position.set(wx, 0.45, wz);
    const spin = new THREE.Group();

    const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.34, 16), tireMat);
    tire.rotation.z = Math.PI / 2;
    spin.add(tire);

    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.36, 12), rimMat);
    rim.rotation.z = Math.PI / 2;
    spin.add(rim);

    const spokeA = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.78, 0.085), rimMat);
    spin.add(spokeA);
    const spokeB = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.085, 0.78), rimMat);
    spin.add(spokeB);

    steer.add(spin);
    visual.add(steer);
    spinWheels.push(spin);
    if (isFront) steerWheels.push(steer);
  }

  // front splitter detail
  const splitter = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.08, 0.35), chromeMat);
  splitter.position.set(0, 0.28, 2.85);
  visual.add(splitter);

  group.traverse(o => { if (o.isMesh) o.castShadow = true; });

  return { group, visual, spinWheels, steerWheels };
}

/* =========================================================
   RACER AI
   ========================================================= */
const ordinal = ['1st', '2nd', '3rd', '4th'];

class Racer {
  constructor(opts) {
    this.name = opts.name;
    this.isPlayer = !!opts.isPlayer;
    this.skill = opts.skill;
    this.bias = opts.bias;
    this.baseDist = opts.dist;

    this.dist = opts.dist;
    this.lateral = opts.lateral;
    this.targetLateral = opts.lateral;
    this.speed = 14;
    this.lap = 1;
    this.roll = 0;
    this.wheelAngle = 0;

    this.maxSpeed = 76 * this.skill;
    this.maxLatAccel = 80;
    this.accelRate = 30;
    this.brakeRate = 62;

    const built = createCar(opts.color);
    this.mesh = built.group;
    this.visual = built.visual;
    this.spinWheels = built.spinWheels;
    this.steerWheels = built.steerWheels;
    scene.add(this.mesh);

    this.place();
  }

  update(dt, others) {
    const u = ((this.dist / TRACK_LEN) % 1 + 1) % 1;

    /* --- corner speed planning with braking distance --- */
    let vTarget = this.maxSpeed;
    for (let d = 0; d <= 95; d += 8) {
      const cu = (u + d / TRACK_LEN) % 1;
      const c = curvAt(cu);
      const vCorner = Math.sqrt(this.maxLatAccel / Math.max(c, 0.0009));
      const allowed = Math.sqrt(vCorner * vCorner + 2 * this.brakeRate * d);
      if (allowed < vTarget) vTarget = allowed;
    }

    /* --- racing line --- */
    this.targetLateral = this.bias + Math.sin(u * Math.PI * 6) * 0.9;

    /* --- traffic / overtaking --- */
    let nearest = null;
    let nearestGap = Infinity;
    for (const o of others) {
      if (o === this) continue;
      let gap = o.dist - this.dist;
      gap = ((gap % TRACK_LEN) + TRACK_LEN) % TRACK_LEN;
      if (gap < nearestGap) { nearestGap = gap; nearest = o; }
    }

    if (nearest && nearestGap < 22) {
      const dl = nearest.lateral - this.lateral;
      if (Math.abs(dl) < 3.8) {
        const dir = dl >= 0 ? -1 : 1;
        let t = THREE.MathUtils.clamp(nearest.lateral + dir * 4.8, -MAX_LAT, MAX_LAT);
        if (Math.abs(t - this.lateral) < 1.1) {
          t = THREE.MathUtils.clamp(nearest.lateral - dir * 4.8, -MAX_LAT, MAX_LAT);
        }
        this.targetLateral = t;
      }
      if (nearestGap < 11) {
        vTarget = Math.min(vTarget, nearest.speed * (0.82 + nearestGap * 0.028));
      }
    }

    /* --- longitudinal dynamics --- */
    const dv = vTarget - this.speed;
    if (dv > 0) this.speed += Math.min(dv, this.accelRate * dt);
    else this.speed += Math.max(dv, -this.brakeRate * dt);
    this.speed = Math.max(this.speed, 6);

    this.dist += this.speed * dt;
    this.lap = Math.floor(this.dist / TRACK_LEN) + 1;

    /* --- lateral steering --- */
    const latDelta = THREE.MathUtils.clamp(this.targetLateral - this.lateral, -14 * dt, 14 * dt);
    this.lateral += latDelta;
    this.lateral = THREE.MathUtils.clamp(this.lateral, -MAX_LAT, MAX_LAT);

    /* --- wheels --- */
    this.wheelAngle += (this.speed / 0.45) * dt;
    for (const w of this.spinWheels) w.rotation.x = this.wheelAngle;
    const steerAmt = THREE.MathUtils.clamp(latDelta / Math.max(dt, 1e-4) * 0.055, -0.5, 0.5);
    for (const w of this.steerWheels) w.rotation.y += (steerAmt - w.rotation.y) * Math.min(1, dt * 9);
  }

  place() {
    const u = ((this.dist / TRACK_LEN) % 1 + 1) % 1;
    const p = curve.getPointAt(u);
    const t = curve.getTangentAt(u);
    const side = new THREE.Vector3(-t.z, 0, t.x).normalize();

    this.mesh.position.copy(p).addScaledVector(side, this.lateral);
    this.mesh.position.y = 0;

    const uAhead = (u + 7 / TRACK_LEN) % 1;
    const pA = curve.getPointAt(uAhead);
    const tA = curve.getTangentAt(uAhead);
    const sideA = new THREE.Vector3(-tA.z, 0, tA.x).normalize();
    const look = pA.clone().addScaledVector(sideA, this.lateral);
    look.y = 0;
    this.mesh.lookAt(look);

    /* body roll from curvature */
    const t1 = curve.getTangentAt(u);
    const t2 = curve.getTangentAt((u + 0.006) % 1);
    const signed = t1.x * t2.z - t1.z * t2.x;
    const targetRoll = THREE.MathUtils.clamp(-signed * this.speed * 0.55, -0.16, 0.16);
    this.roll += (targetRoll - this.roll) * 0.12;
    this.visual.rotation.z = this.roll;
  }
}

/* =========================================================
   CREATE THE FIELD
   ========================================================= */
const racers = [];

const player = new Racer({
  name: 'YOU', isPlayer: true, color: 0xd8202c, skill: 1.0,
  bias: 0.0, dist: 6.0, lateral: 3.0
});
racers.push(player);

racers.push(new Racer({ name: 'AZURE', color: 0x2277e8, skill: 1.02, bias: 1.6, dist: 14.0, lateral: -3.2 }));
racers.push(new Racer({ name: 'SUNBURST', color: 0xf2c114, skill: 0.985, bias: -1.8, dist: 10.0, lateral: 3.2 }));
racers.push(new Racer({ name: 'VIPER', color: 0x1fbf5a, skill: 0.97, bias: 0.6, dist: 1.5, lateral: -3.2 }));

for (const r of racers) r.place();

/* =========================================================
   CHASE CAMERA
   ========================================================= */
const camPos = new THREE.Vector3();
const camLook = new THREE.Vector3();
let camReady = false;
const tmpFwd = new THREE.Vector3();

function updateCamera(dt) {
  const car = player.mesh;
  tmpFwd.set(0, 0, 1).applyQuaternion(car.quaternion);

  const speed = player.speed;
  const back = 9.5 + speed * 0.115;
  const height = 3.6 + speed * 0.014;

  const desired = car.position.clone().addScaledVector(tmpFwd, -back);
  desired.y = car.position.y + height;

  const lookTarget = car.position.clone().addScaledVector(tmpFwd, 13);
  lookTarget.y = car.position.y + 1.5;

  if (!camReady) {
    camPos.copy(desired);
    camLook.copy(lookTarget);
    camReady = true;
  }

  camPos.lerp(desired, 1 - Math.exp(-7.5 * dt));
  camLook.lerp(lookTarget, 1 - Math.exp(-11 * dt));

  camera.position.copy(camPos);
  const tsec = performance.now() * 0.001;
  const shake = Math.min(speed / 76, 1) * 0.045;
  camera.position.x += Math.sin(tsec * 31.7) * shake;
  camera.position.y += Math.sin(tsec * 24.3) * shake * 0.7;
  camera.lookAt(camLook);

  const targetFov = 62 + speed * 0.30;
  camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-4 * dt));
  camera.updateProjectionMatrix();
}

/* =========================================================
   HUD
   ========================================================= */
const speedEl = document.getElementById('speedVal');
const lapEl = document.getElementById('lapVal');
const posEl = document.getElementById('posVal');
let hudTick = 0;

function updateHUD(dt) {
  hudTick += dt;
  if (hudTick < 0.06) return;
  hudTick = 0;

  speedEl.textContent = Math.round(player.speed * 3.6);
  lapEl.textContent = Math.min(player.lap, TOTAL_LAPS);

  const order = racers.slice().sort((a, b) => b.dist - a.dist);
  const idx = order.indexOf(player);
  posEl.textContent = ordinal[Math.min(idx, 3)];
}

/* =========================================================
   SUN FOLLOW
   ========================================================= */
function updateSun() {
  const p = player.mesh.position;
  sun.position.set(p.x + 95, 155, p.z + 75);
  sun.target.position.copy(p);
  sun.target.updateMatrixWorld();
}

/* =========================================================
   RESIZE
   ========================================================= */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastTime = 0;

function animate(now) {
  requestAnimationFrame(animate);

  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 1 / 25) dt = 1 / 25;
  if (dt < 0) dt = 0;

  for (const r of racers) r.update(dt, racers);
  for (const r of racers) r.place();

  updateCamera(dt);
  updateSun();
  updateHUD(dt);

  sky.position.copy(camera.position);

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);
</script>

    return `<svg viewBox="0 0 512 512" role="img" aria-label="${safeTitle} by ${safeArtist}" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient><radialGradient id="sun"><stop stop-color="#fff3d4"/><stop offset=".25" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient></defs>
      <rect width="512" height="512" fill="url(#${id})"/>${motifs[index % motifs.length]}
      <rect y="382" width="512" height="130" fill="url(#fade${index})" opacity=".75"/>
      <defs><linearGradient id="fade${index}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07070a" stop-opacity="0"/><stop offset="1" stop-color="#07070a" stop-opacity=".85"/></linearGradient></defs>
      <text x="30" y="451" fill="#fff" font-family="Arial, sans-serif" font-size="${safeTitle.length > 17 ? 27 : 34}" font-weight="700" letter-spacing="-1">${safeTitle}</text>
      <text x="32" y="477" fill="#fff" fill-opacity=".78" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">${safeArtist.toUpperCase()}</text>
    </svg>`;
  }

  tracks.forEach((track, i) => { track.art = art(i, track.album, track.artist, track.colors); });
  function icon(name) { return icons[name] || ""; }
  function trackArt(index) { return tracks[index].art; }
  function formatTime(seconds) {
    const n = Math.max(0, Math.floor(seconds));
    return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0");
  }

  $("#brand-mark").innerHTML = icon("logo");
  $(".nav-link[data-view='home']").innerHTML = icon("home") + "<span>Home</span>";
  $(".nav-link[data-view='search']").innerHTML = icon("search") + "<span>Search</span>";
  $("#library-icon").innerHTML = icon("library");
  $("#add-icon").innerHTML = icon("plus");
  $("#search-icon").innerHTML = icon("search");
  $("#back-button").innerHTML = icon("back");
  $("#forward-button").innerHTML = icon("forward");
  $("#chevron-icon").innerHTML = icon("chevron");
  $("#shuffle-button").innerHTML = icon("shuffle");
  $("#previous-button").innerHTML = icon("previous");
  $("#next-button").innerHTML = icon("next");
  $("#repeat-button").innerHTML = icon("repeat");
  $("#like-button").innerHTML = icon("heart");
  $("#queue-button").innerHTML = icon("queue");
  $("#device-button").innerHTML = icon("device");
  $("#volume-button").innerHTML = icon("volume");

  function renderSidebar() {
    $("#playlist-list").innerHTML = playlists.map((pl, i) => {
      const t = tracks[pl.cover];
      return `<button class="playlist-link ${currentView === "playlist" && selectedPlaylist === i ? "selected" : ""}" data-playlist="${i}">
        <span class="side-cover">${t.art}</span><span class="playlist-meta"><strong>${pl.name}</strong><span>${pl.artist}</span></span>
      </button>`;
    }).join("");
    document.querySelectorAll(".nav-link").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.view === currentView || (btn.dataset.view === "search" && currentView === "search"));
      if (btn.dataset.view === "home") btn.innerHTML = icon(currentView === "home" ? "homeFilled" : "home") + "<span>Home</span>";
    });
  }

  function card(index) {
    const t = tracks[index];
    return `<article class="music-card" data-play-track="${index}" tabindex="0" aria-label="Play ${t.album}">
      <div class="cover-wrap">${t.art}<button class="card-play" data-play-track="${index}" aria-label="Play ${t.album}">${icon("play")}</button></div>
      <h3>${t.album}</h3><p>${t.artist} · Album</p>
    </article>`;
  }

  function section(title, ids, label = "Show all") {
    return `<section class="section"><div class="section-head"><h2>${title}</h2><button class="show-all">${label}</button></div><div class="card-row">${ids.map(card).join("")}</div></section>`;
  }

  function renderHome() {
    const quick = [0, 1, 2, 3, 4, 5].map((idx, n) => {
      const pl = playlists[n % playlists.length];
      const cover = tracks[pl.cover];
      return `<div class="quick-card" data-playlist="${n % playlists.length}" tabindex="0">
        <div class="quick-art">${cover.art}</div><strong>${pl.name}</strong>
        <button class="quick-play" data-playlist="${n % playlists.length}" aria-label="Open ${pl.name}">${icon("play")}</button>
      </div>`;
    }).join("");
    return `<h1 class="greeting">Good evening</h1>
      <div class="quick-grid">${quick}</div>
      ${section("Made for you", [0,2,5,7,11,3])}
      ${section("Recently played", [8,1,4,10,9,6])}
      ${section("Your heavy rotation", [2,0,8,5,11,7])}`;
  }

  function renderPlaylist() {
    const pl = playlists[selectedPlaylist];
    const cover = tracks[pl.cover];
    const rows = pl.trackIds.map((id, n) => {
      const t = tracks[id];
      return `<tr class="track-row ${id === currentTrack ? "active" : ""}" data-play-track="${id}">
        <td><div class="track-title-cell"><span style="width:16px;text-align:center">${n + 1}</span><div class="table-cover">${t.art}</div><div><strong>${t.title}</strong><span>${t.artist}</span></div></div></td>
        <td>${t.album}</td><td class="duration-cell">${formatTime(t.duration)}</td>
      </tr>`;
    }).join("");
    return `<div class="playlist-hero">
        <div class="playlist-hero-art">${cover.art}</div>
        <div class="playlist-hero-copy"><div class="page-label">PLAYLIST</div><h1>${pl.name}</h1><p>${pl.desc}</p><div class="playlist-owner">♫ ${pl.artist} <span> · ${pl.trackIds.length} songs, about 22 min</span></div></div>
      </div>
      <div class="playlist-actions">
        <button class="large-play" data-playlist-start="${selectedPlaylist}" aria-label="Play playlist">${icon("play")}</button>
        <button class="subtle-action" aria-label="Save playlist">${icon("heart")}</button>
        <button class="subtle-action" aria-label="More options">${icon("more")}</button>
      </div>
      <table class="track-table"><thead><tr><th> # &nbsp; Title</th><th>Album</th><th style="text-align:right;padding-right:8px">◷</th></tr></thead><tbody>${rows}</tbody></table>
      <div style="height:34px"></div>${section("You might also like", [1,5,7,10,11,4])}`;
  }

  function renderArtist() {
    return `<div class="artist-hero"><div class="verified"><span>✓</span>Verified Artist</div><h1>M83</h1><p>12,684,220 monthly listeners</p></div>
      <div class="playlist-actions"><button class="large-play" data-play-track="0" aria-label="Play M83">${icon("play")}</button><button class="chip" style="border:1px solid #aaa;background:transparent;padding:7px 15px">Following</button><button class="subtle-action" aria-label="More options">${icon("more")}</button></div>
      <section class="section"><div class="section-head"><h2>Popular</h2><button class="show-all">See discography</button></div>
        <table class="track-table"><thead><tr><th> # &nbsp; Title</th><th>Album</th><th style="text-align:right;padding-right:8px">◷</th></tr></thead><tbody>
        ${[0,11,8,7,5].map((id,n)=>{const t=tracks[id];return `<tr class="track-row ${id===currentTrack?"active":""}" data-play-track="${id}"><td><div class="track-title-cell"><span style="width:16px;text-align:center">${n+1}</span><div class="table-cover">${t.art}</div><div><strong>${t.title}</strong><span>${t.artist}</span></div></div></td><td>${t.album}</td><td class="duration-cell">${formatTime(t.duration)}</td></tr>`}).join("")}
        </tbody></table></section>
      ${section("Popular releases", [0,11,8,7,5,2])}`;
  }

  function renderLibrary() {
    return `<h1 class="greeting">Your Library</h1><div class="library-tools" style="padding:0 0 18px;display:flex"><button class="chip">Playlists</button><button class="chip">Albums</button><button class="chip">Artists</button></div>
      <div class="card-row">${playlists.map((pl,i)=>`<article class="music-card" data-playlist="${i}"><div class="cover-wrap">${tracks[pl.cover].art}</div><h3>${pl.name}</h3><p>${pl.artist}</p></article>`).join("")}</div>
      <div style="height:28px"></div>${section("Albums in your library", [3,0,10,6,2,8])}`;
  }

  function renderSearch() {
    const q = searchTerm.trim().toLowerCase();
    if (!q) return `<h1 class="search-heading">Start exploring</h1><div class="section"><div class="section-head"><h2>Browse all</h2></div><div class="card-row">${[0,3,5,8,2,10].map(card).join("")}</div></div>${section("Popular right now", [1,4,7,9,11,6])}`;
    const results = tracks.map((t,i)=>({t,i})).filter(({t}) => `${t.title} ${t.artist} ${t.album}`.toLowerCase().includes(q));
    if (!results.length) return `<h1 class="search-heading">Search results for “${escapeHTML(searchTerm)}”</h1><div class="empty-state">No results found. Try searching for something else.</div>`;
    const first = results[0];
    return `<h1 class="search-heading">Search results</h1><div class="search-results">
      <section class="result-block"><h2>Top result</h2><div class="top-result" data-play-track="${first.i}">
        <div class="cover-wrap">${first.t.art}</div><h3>${first.t.title}</h3><p>${first.t.artist}</p><span class="result-tag">SONG</span>
      </div></section>
      <section class="result-block"><h2>Songs</h2><div class="result-list">${results.map(({t,i})=>`<div class="result-line" data-play-track="${i}"><div class="table-cover">${t.art}</div><div class="line-meta"><strong>${t.title}</strong><span>♫ &nbsp;${t.artist} · ${t.album}</span></div><button class="line-play" data-play-track="${i}" aria-label="Play ${t.title}">${icon("play")}</button><span style="font-size:11px;color:#aaa">${formatTime(t.duration)}</span></div>`).join("")}</div></section></div>`;
  }

  function escapeHTML(text) {
    return String(text).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  function renderView(push = false) {
    if (push && historyStack[historyIndex] !== currentView) {
      historyStack.splice(historyIndex + 1);
      historyStack.push(currentView);
      historyIndex = historyStack.length - 1;
    }
    renderSidebar();
    view.innerHTML = currentView === "home" ? renderHome()
      : currentView === "playlist" ? renderPlaylist()
      : currentView === "artist" ? renderArtist()
      : currentView === "library" ? renderLibrary()
      : renderSearch();
  }

  function goTo(target) {
    if (target === "playlist" || target === "artist" || target === "library" || target === "home" || target === "search") {
      currentView = target;
      if (target === "search") $("#search-input").focus();
      renderView(true);
    }
  }

  function updatePlayer() {
    const t = tracks[currentTrack];
    $("#player-cover").innerHTML = t.art;
    $("#player-cover").classList.toggle("playing", isPlaying);
    $("#player-title").textContent = t.title;
    $("#player-artist").textContent = t.artist;
    $("#duration").textContent = formatTime(t.duration);
    $("#elapsed").textContent = formatTime(elapsed);
    const pct = Math.min(100, elapsed / t.duration * 100);
    $("#progress-fill").style.width = pct + "%";
    $("#progress-knob").style.left = pct + "%";
    $("#play-button").innerHTML = icon(isPlaying ? "pause" : "play");
    $("#play-button").setAttribute("aria-label", isPlaying ? "Pause" : "Play");
    $("#visualizer").classList.toggle("active", isPlaying);
    $("#mini-visualizer").classList.toggle("active", isPlaying);
    $("#like-button").innerHTML = icon(isLiked ? "heartFill" : "heart");
    $("#like-button").classList.toggle("liked", isLiked);
    $("#volume-fill").style.width = (volume * 100) + "%";
    $("#volume-knob").style.left = (volume * 100) + "%";
    if (currentView === "playlist" || currentView === "artist") {
      view.querySelectorAll(".track-row").forEach(row => row.classList.toggle("active", Number(row.dataset.playTrack) === currentTrack));
    }
  }

  function playTrack(index) {
    currentTrack = (index + tracks.length) % tracks.length;
    elapsed = 0;
    isPlaying = true;
    isLiked = false;
    updatePlayer();
  }

  function startPlaylist(index) {
    selectedPlaylist = Number(index);
    currentView = "playlist";
    renderView(true);
    playTrack(playlists[selectedPlaylist].trackIds[0]);
  }

  function nextTrack(direction = 1) {
    if (shuffle) {
      let next = currentTrack;
      while (next === currentTrack && tracks.length > 1) next = Math.floor(Math.random() * tracks.length);
      playTrack(next);
    } else {
      playTrack((currentTrack + direction + tracks.length) % tracks.length);
    }
  }

  document.addEventListener("click", e => {
    const playTarget = e.target.closest("[data-play-track]");
    const playlistTarget = e.target.closest("[data-playlist]");
    const playlistStart = e.target.closest("[data-playlist-start]");
    const navTarget = e.target.closest("[data-view]");

    if (playlistStart) { startPlaylist(playlistStart.dataset.playlistStart); return; }
    if (playTarget) {
      e.stopPropagation();
      playTrack(Number(playTarget.dataset.playTrack));
      return;
    }
    if (playlistTarget) {
      startPlaylist(playlistTarget.dataset.playlist);
      return;
    }
    if (navTarget) {
      goTo(navTarget.dataset.view);
      return;
    }
  });

  view.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".music-card, .quick-card")) {
      e.preventDefault();
      const p = e.target.dataset.playlist;
      if (p !== undefined) startPlaylist(p);
      else if (e.target.dataset.playTrack !== undefined) playTrack(Number(e.target.dataset.playTrack));
    }
  });

  $("#search-input").addEventListener("focus", () => {
    if (currentView !== "search") { currentView = "search"; renderView(true); }
  });
  $("#search-input").addEventListener("input", e => {
    searchTerm = e.target.value;
    if (currentView !== "search") currentView = "search";
    renderView();
  });
  $("#play-button").addEventListener("click", () => { isPlaying = !isPlaying; updatePlayer(); });
  $("#next-button").addEventListener("click", () => nextTrack(1));
  $("#previous-button").addEventListener("click", () => {
    if (elapsed > 3) { elapsed = 0; updatePlayer(); }
    else nextTrack(-1);
  });
  $("#shuffle-button").addEventListener("click", e => {
    shuffle = !shuffle; e.currentTarget.classList.toggle("on", shuffle);
  });
  $("#repeat-button").addEventListener("click", e => {
    repeat = !repeat; e.currentTarget.classList.toggle("on", repeat);
  });
  $("#like-button").addEventListener("click", () => { isLiked = !isLiked; updatePlayer(); });

  $("#progress-track").addEventListener("click", e => {
    const r = e.currentTarget.getBoundingClientRect();
    elapsed = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * tracks[currentTrack].duration;
    updatePlayer();
  });
  $("#volume-track").addEventListener("click", e => {
    const r = e.currentTarget.getBoundingClientRect();
    volume = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    updatePlayer();
  });
  $("#back-button").addEventListener("click", () => {
    if (historyIndex > 0) {
      historyIndex--;
      currentView = historyStack[historyIndex];
      renderView();
    } else { currentView = "home"; renderView(); }
  });
  $("#forward-button").addEventListener("click", () => {
    if (historyIndex < historyStack.length - 1) {
      historyIndex++;
      currentView = historyStack[historyIndex];
      renderView();
    }
  });
  $("#premium-link").addEventListener("click", e => e.preventDefault());
  $("#profile-button").addEventListener("click", () => {
    $("#profile-button").style.background = $("#profile-button").style.background ? "" : "#393939";
  });

  setInterval(() => {
    if (!isPlaying) return;
    elapsed += 1;
    if (elapsed >= tracks[currentTrack].duration) {
      if (repeat) elapsed = 0;
      else nextTrack(1);
    } else updatePlayer();
  }, 1000);

  renderView();
  updatePlayer();
})();
</script>
</body>
</html>

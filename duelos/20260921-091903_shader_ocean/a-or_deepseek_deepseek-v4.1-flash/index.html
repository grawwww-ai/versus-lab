<!DOCTYPE html>
<html lang="en">
<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stormy Ocean at Sunset — WebGL2 Raymarched</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #glcanvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("glcanvas");
  var gl = canvas.getContext("webgl2", {
    antialias: false,
    alpha: false,
    depth: false,
    stencil: false,
    premultipliedAlpha: false,
    preserveDrawingBuffer: false,
    powerPreference: "high-performance"
  });

  if (!gl) {
    document.body.innerHTML =
      '<p style="color:#eee;font:14px sans-serif;padding:1em">' +
      'WebGL2 is not available in this browser.</p>';
    return;
  }

  /* ------------------------------------------------------------------ *
   *  Vertex shader: a single oversized triangle covering the viewport.
   * ------------------------------------------------------------------ */
  var VERT_SRC = [
    "#version 300 es",
    "in vec2 aPos;",
    "void main(){",
    "  gl_Position = vec4(aPos, 0.0, 1.0);",
    "}"
  ].join("\n");

  /* ------------------------------------------------------------------ *
   *  Fragment shader: the whole scene.
   * ------------------------------------------------------------------ */
  var FRAG_SRC = [
    "#version 300 es",
    "precision highp float;",
    "",
    "out vec4 fragColor;",
    "",
    "uniform vec2  iResolution;",
    "uniform float iTime;",
    "",
    "const mat2 ROT = mat2(0.80, 0.60, -0.60, 0.80);",
    "",
    "/* ---------------- noise ---------------- */",
    "float hash21(vec2 p){",
    "  p = fract(p * vec2(123.34, 456.21));",
    "  p += dot(p, p + 45.32);",
    "  return fract(p.x * p.y);",
    "}",
    "",
    "float noise2(vec2 x){",
    "  vec2 i = floor(x);",
    "  vec2 f = fract(x);",
    "  vec2 u = f * f * (3.0 - 2.0 * f);",
    "  float a = hash21(i);",
    "  float b = hash21(i + vec2(1.0, 0.0));",
    "  float c = hash21(i + vec2(0.0, 1.0));",
    "  float d = hash21(i + vec2(1.0, 1.0));",
    "  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);",
    "}",
    "",
    "float fbm(vec2 p){",
    "  float s = 0.0;",
    "  float a = 0.5;",
    "  for(int i = 0; i < 3; i++){",
    "    s += a * noise2(p);",
    "    p = ROT * p * 2.07;",
    "    a *= 0.5;",
    "  }",
    "  return s;",
    "}",
    "",
    "/* ---------------- ocean height field ---------------- */",
    "float oceanH(vec2 p, float t){",
    "  vec2 q = p * 0.20;",
    "  float h = 0.0;",
    "  h += fbm(q * 1.00 + vec2( t * 0.30,  t * 0.11)) * 1.00;",
    "  h += fbm(q * 2.11 + vec2(-t * 0.52,  t * 0.28)) * 0.55;",
    "  h += fbm(q * 4.13 + vec2( t * 0.86, -t * 0.61)) * 0.28;",
    "  h += fbm(q * 7.70 + vec2(-t * 1.35,  t * 1.02)) * 0.13;",
    "  return (h - 0.83) * 1.75;",
    "}",
    "",
    "vec3 oceanNormal(vec2 p, float t){",
    "  float e = 0.16;",
    "  float hL = oceanH(p - vec2(e, 0.0), t);",
    "  float hR = oceanH(p + vec2(e, 0.0), t);",
    "  float hD = oceanH(p - vec2(0.0, e), t);",
    "  float hU = oceanH(p + vec2(0.0, e), t);",
    "  return normalize(vec3(hL - hR, 2.0 * e, hD - hU));",
    "}",
    "",
    "/* ---------------- sky ---------------- */",
    "vec3 skyColor(vec3 rd, vec3 sunDir, float t){",
    "  float y = max(rd.y, 0.0);",
    "",
    "  vec3 zenith  = vec3(0.028, 0.042, 0.092);",
    "  vec3 horizon = vec3(0.235, 0.132, 0.140);",
    "  vec3 col = mix(horizon, zenith, pow(y, 0.42));",
    "",
    "  float sd = max(dot(rd, sunDir), 0.0);",
    "",
    "  /* ---- clouds ---- */",
    "  if(rd.y > 0.0015){",
    "    vec2 uv = rd.xz / (rd.y + 0.085);",
    "    uv = uv * 1.45 + vec2(t * 0.016, t * 0.0065);",
    "",
    "    float n1 = fbm(uv * 0.85);",
    "    float n2 = fbm(uv * 2.15 + 17.0);",
    "    float dens = smoothstep(0.33, 0.79, n1 * 0.95 + n2 * 0.50);",
    "    dens *= smoothstep(0.0, 0.055, rd.y);",
    "",
    "    float lit = pow(sd, 2.2);",
    "    vec3 cDark = vec3(0.040, 0.048, 0.078);",
    "    vec3 cLit  = vec3(0.74, 0.34, 0.185);",
    "    vec3 cc = mix(cDark, cLit, lit * 0.90 + 0.05);",
    "    cc += vec3(1.0, 0.55, 0.24) * pow(sd, 14.0) * 0.38;",
    "",
    "    col = mix(col, cc, dens * 0.93);",
    "  }",
    "",
    "  /* ---- sun glow ---- */",
    "  col += vec3(1.00, 0.42, 0.13) * pow(sd, 8.0) * 0.78;",
    "  col += vec3(1.00, 0.30, 0.07) * pow(sd, 2.0) * 0.20;",
    "",
    "  /* ---- sun disc ---- */",
    "  float disc = smoothstep(0.99920, 0.99975, sd);",
    "  col += vec3(1.0, 0.72, 0.38) * disc * 7.0;",
    "",
    "  return col;",
    "}",
    "",
    "/* ---------------- main ---------------- */",
    "void main(){",
    "  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution) / iResolution.y;",
    "  float t = iTime;",
    "",
    "  /* ---------- camera: gently bobbing as if on a boat ---------- */",
    "  vec3 ro = vec3(sin(t * 0.53) * 0.35,",
    "                 2.80 + sin(t * 1.13) * 0.16 + sin(t * 2.37) * 0.055,",
    "                 cos(t * 0.41) * 0.35);",
    "",
    "  float pitch = -0.085 + sin(t * 0.83) * 0.026 + sin(t * 1.67) * 0.009;",
    "  float roll  = sin(t * 0.71) * 0.035 + sin(t * 1.31) * 0.012;",
    "  float yaw   = sin(t * 0.29) * 0.06;",
    "",
    "  vec3 fwd   = normalize(vec3(sin(yaw) * cos(pitch), sin(pitch), -cos(yaw) * cos(pitch)));",
    "  vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));",
    "  vec3 up    = cross(right, fwd);",
    "",
    "  vec3 r2 = right * cos(roll) + up * sin(roll);",
    "  vec3 u2 = up * cos(roll) - right * sin(roll);",
    "",
    "  vec3 rd = normalize(fwd * 1.55 + r2 * uv.x + u2 * uv.y);",
    "",
    "  vec3 sunDir = normalize(vec3(0.44, 0.075, -1.0));",
    "",
    "  vec3 col = skyColor(rd, sunDir, t);",
    "",
    "  /* ---------- ocean ---------- */",
    "  if(rd.y < 0.0){",
    "    float tmax  = 260.0;",
    "    float tt    = 0.20;",
    "    float prevT = tt;",
    "    float hitT  = -1.0;",
    "",
    "    for(int i = 0; i < 100; i++){",
    "      vec3 p = ro + rd * tt;",
    "      float h = oceanH(p.xz, t);",
    "      float d = p.y - h;",
    "      if(d < 0.0){ hitT = tt; break; }",
    "      prevT = tt;",
    "      float step = max(0.05, d * 0.5);",
    "      if(tt > 30.0) step = max(step, min(tt * 0.05, d * 3.0));",
    "      tt += step;",
    "      if(tt > tmax) break;",
    "    }",
    "",
    "    if(hitT > 0.0){",
    "      /* binary refinement of the intersection */",
    "      float a = prevT;",
    "      float b = hitT;",
    "      for(int i = 0; i < 6; i++){",
    "        float m = 0.5 * (a + b);",
    "        vec3 pm = ro + rd * m;",
    "        if(pm.y - oceanH(pm.xz, t) > 0.0) a = m; else b = m;",
    "      }",
    "      float dist = 0.5 * (a + b);",
    "      vec3  pos  = ro + rd * dist;",
    "      vec3  n    = oceanNormal(pos.xz, t);",
    "      vec3  viewDir = -rd;",
    "",
    "      /* fresnel */",
    "      float fres = 0.02 + 0.98 * pow(1.0 - max(dot(viewDir, n), 0.0), 5.0);",
    "",
    "      /* sky reflection */",
    "      vec3 refl = reflect(rd, n);",
    "      refl.y = max(refl.y, 0.001);",
    "      vec3 skyRefl = skyColor(normalize(refl), sunDir, t);",
    "",
    "      /* water body colour */",
    "      float ph = pos.y;",
    "      vec3 deep  = vec3(0.006, 0.018, 0.030);",
    "      vec3 crest = vec3(0.038, 0.078, 0.098);",
    "      vec3 body  = mix(deep, crest, smoothstep(-0.60, 1.10, ph));",
    "",
    "      /* light bleeding through the wave faces */",
    "      float sss = pow(max(dot(n, sunDir), 0.0), 2.5) * smoothstep(-0.30, 0.90, ph);",
    "      body += vec3(0.42, 0.15, 0.035) * sss * 0.85;",
    "",
    "      vec3 water = mix(body, skyRefl, fres);",
    "",
    "      /* sun specular */",
    "      vec3  hv   = normalize(sunDir + viewDir);",
    "      float sp   = max(dot(n, hv), 0.0);",
    "      float spec = pow(sp, 300.0) * 4.0 + pow(sp, 30.0) * 0.25;",
    "      water += vec3(1.0, 0.55, 0.24) * spec;",
    "",
    "      /* foam on the crests */",
    "      float steep = 1.0 - n.y;",
    "      float fh = smoothstep(0.20, 0.95, ph);",
    "      float fs = smoothstep(0.05, 0.28, steep);",
    "      float fn = fbm(pos.xz * 1.4 + vec2(t * 0.22, -t * 0.17));",
    "      float foam = fh * (0.30 + 1.0 * fs) * (0.45 + 1.3 * fn);",
    "      foam = smoothstep(0.45, 1.0, foam);",
    "",
    "      vec3 foamCol = vec3(0.66, 0.67, 0.70) *",
    "                     (0.30 + 0.70 * clamp(dot(n, sunDir) * 3.0 + 0.35, 0.0, 1.0));",
    "      foamCol += vec3(1.0, 0.50, 0.20) * spec * 0.6;",
    "      water = mix(water, foamCol, foam);",
    "",
    "      /* fog near the horizon */",
    "      float fogAmt = 1.0 - exp(-pow(max(dist - 12.0, 0.0) * 0.0075, 2.0));",
    "      vec3  fogCol = skyColor(normalize(vec3(rd.x, 0.035, rd.z)), sunDir, t);",
    "      water = mix(water, fogCol, clamp(fogAmt, 0.0, 1.0));",
    "",
    "      col = water;",
    "    }",
    "  }",
    "",
    "  col = max(col, vec3(0.0));",
    "  fragColor = vec4(col, 1.0);",
    "}"
  ].join("\n");

  /* ------------------------------------------------------------------ *
   *  Shader helpers
   * ------------------------------------------------------------------ */
  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      var log = gl.getShaderInfoLog(s);
      console.error("Shader compile error:\n" + log + "\n" + src);
      throw new Error("Shader compile error: " + log);
    }
    return s;
  }

  var vs = compile(gl.VERTEX_SHADER, VERT_SRC);
  var fs = compile(gl.FRAGMENT_SHADER, FRAG_SRC);

  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, "aPos");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    var plog = gl.getProgramInfoLog(prog);
    console.error("Program link error: " + plog);
    throw new Error("Program link error: " + plog);
  }
  gl.useProgram(prog);

  /* full-screen triangle */
  var vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  var vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([-1, -1, 3, -1, -1, 3]),
    gl.STATIC_DRAW
  );
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  var uRes  = gl.getUniformLocation(prog, "iResolution");
  var uTime = gl.getUniformLocation(prog, "iTime");

  /* ------------------------------------------------------------------ *
   *  Resizing — canvas always fills the window.
   *  The drawing buffer is capped to a pixel budget for performance;
   *  CSS stretches it back to full size.
   * ------------------------------------------------------------------ */
  var PIXEL_BUDGET = 620000;

  function resize() {
    var w = Math.max(1, window.innerWidth);
    var h = Math.max(1, window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 1.0);

    var scale = Math.sqrt(PIXEL_BUDGET / Math.max(1, w * h * dpr * dpr));
    scale = Math.min(1.0, Math.max(0.30, scale));

    var bw = Math.max(1, Math.round(w * dpr * scale));
    var bh = Math.max(1, Math.round(h * dpr * scale));

    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
      gl.viewport(0, 0, bw, bh);
    }
  }

  window.addEventListener("resize", resize, false);
  window.addEventListener("orientationchange", resize, false);
  resize();

  /* ------------------------------------------------------------------ *
   *  Render loop
   * ------------------------------------------------------------------ */
  var startTime = null;

  function frame(now) {
    if (startTime === null) startTime = now;
    var time = (now - startTime) * 0.001;

    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, time);

    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

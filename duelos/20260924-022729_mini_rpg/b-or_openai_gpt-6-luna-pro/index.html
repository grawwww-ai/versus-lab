<!DOCTYPE html>
<html lang="en">
<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amulet of Mossvale — Mini RPG</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; background: #111b20; color: #f5efd4;
    font-family: "Courier New", monospace;
  }
  body { display: grid; place-items: center; padding: 12px; }
  canvas {
    display: block; width: min(100%, 1000px); height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border: 3px solid #d3b875; box-shadow: 0 10px 45px #0009;
    background: #182329;
  }
  .caption { max-width: 1000px; width: 100%; color: #c9c3a9; font-size: 12px; padding: 8px 2px 0; }
</style>
</head>
<body>
<div>
  <canvas id="game" width="1000" height="640" aria-label="Playable top-down RPG"></canvas>
  <div class="caption">A tiny, music-free adventure. Demo is on by default: press any movement/action key to take over, or press <b>P</b> to toggle the demo.</div>
</div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  const W = 1000, H = 640, VIEW_W = 750, TILE = 24;
  const MAP_W = 40, MAP_H = 26, WORLD_W = MAP_W * TILE, WORLD_H = MAP_H * TILE;
  const map = Array.from({length: MAP_H}, () => Array(MAP_W).fill(0));
  const rand = (x, y) => {
    const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return n - Math.floor(n);
  };
  const inMap = (x,y) => x >= 0 && y >= 0 && x < MAP_W && y < MAP_H;
  function setTile(x,y,t) { if (inMap(x,y)) map[y][x] = t; }
  function lineTiles(x1,y1,x2,y2,t) {
    let x=x1, y=y1;
    while (x !== x2) { setTile(x,y,t); x += Math.sign(x2-x); }
    while (y !== y2) { setTile(x,y,t); y += Math.sign(y2-y); }
    setTile(x2,y2,t);
  }

  // 0 grass, 1 path, 2 water, 3 tree, 4 dungeon floor, 5 dungeon wall.
  for (let y=0; y<MAP_H; y++) for (let x=0; x<MAP_W; x++) {
    if (x===0 || y===0 || x===MAP_W-1 || y===MAP_H-1) setTile(x,y,2);
    else if (x>=29 && y>=8 && y<=23) setTile(x,y,4);
    else if (x>=14 && x<=27 && rand(x,y)>.37) setTile(x,y,3);
    else setTile(x,y,0);
  }
  // Village clearing.
  for (let y=2; y<=16; y++) for (let x=1; x<=14; x++) setTile(x,y,0);
  // Dungeon walls and a clear entrance.
  for (let x=29; x<=38; x++) { setTile(x,8,5); setTile(x,23,5); }
  for (let y=8; y<=23; y++) { setTile(29,y,5); setTile(38,y,5); }
  setTile(29,15,4);
  // Travel route through the forest and into the ruins.
  lineTiles(5,10,24,10,1);
  lineTiles(24,10,24,15,1);
  lineTiles(24,15,35,15,1);
  lineTiles(35,15,35,17,1);
  // Clear a little space around landmarks.
  for (let y=7;y<=12;y++) for (let x=18;x<=22;x++) if(map[y][x]===3) setTile(x,y,0);
  for (let y=14;y<=17;y++) for (let x=33;x<=36;x++) setTile(x,y,4);

  const houses = [
    {x:3,y:4,w:3,h:3,color:"#a9573c",roof:"#77392f"},
    {x:9,y:4,w:3,h:3,color:"#d09a55",roof:"#8a553b"},
    {x:5,y:13,w:4,h:2,color:"#b87345",roof:"#694333"}
  ];
  const center = (tx,ty) => ({x:(tx+.5)*TILE, y:(ty+.5)*TILE});
  const hero = {x:center(5,10).x, y:center(5,10).y, dir:"down", hp:10, maxHp:10,
    level:1, xp:0, nextXp:30, speed:128, attackCd:0, anim:0, hurt:0};
  const elder = {...center(9,10), name:"Elder Rowan"};
  const monster = {...center(20,10), hp:3, maxHp:3, alive:true, attackCd:0, anim:0};
  const amulet = {...center(35,16), found:false};
  let questStage = 0; // 0 talk, 1 defeat monster, 2 find amulet, 3 complete
  let demo = true, inventoryOpen = false, soundOn = true;
  let items = {Potion:1, "Moss coin":0, "Ancient amulet":0};
  let keys = {};
  let cameraX=0, cameraY=0, elapsed=0, lastTime=0, dialogue=null;
  let dialogueTimer=0, attackFlash=0, aiWaypoint=0, demoFinished=false;
  const floats = [];
  let audioCtx = null;

  function sfx(freq=440, duration=.07, type="square") {
    if (!soundOn) return;
    try {
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
      osc.type=type; osc.frequency.value=freq;
      gain.gain.setValueAtTime(.045,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime+duration);
    } catch(e) {}
  }
  function floatText(x,y,text,color="#fff3a6") {
    floats.push({x,y,text,color,life:1});
  }
  function say(title,text,duration=3.8) {
    dialogue={title,text}; dialogueTimer=duration;
  }
  function addXp(n) {
    hero.xp+=n; floatText(hero.x,hero.y-25,"+"+n+" XP","#ffe078");
    while(hero.xp>=hero.nextXp) {
      hero.xp-=hero.nextXp; hero.level++; hero.nextXp+=25;
      hero.maxHp+=2; hero.hp=hero.maxHp;
      say("LEVEL UP!",`You reached level ${hero.level}. Your health is restored!`,3);
      sfx(660,.18,"triangle");
    }
  }
  function completeMonster() {
    if(!monster.alive) return;
    monster.alive=false; items["Moss coin"]++;
    floatText(monster.x,monster.y-15,"MONSTER DEFEATED!","#ffe078");
    addXp(35); questStage=2; aiWaypoint=0;
    say("Quest updated","The forest creature is beaten. Find the amulet in the dungeon ruins!",4);
    sfx(220,.2,"sawtooth");
  }
  function attack() {
    if(hero.attackCd>0) return;
    hero.attackCd=.48; attackFlash=.16;
    sfx(180,.055,"square");
    if(monster.alive) {
      const d=Math.hypot(monster.x-hero.x,monster.y-hero.y);
      if(d<49) {
        monster.hp--; floatText(monster.x,monster.y-18,"-1","#ffb39b");
        monster.hurt=.16;
        if(monster.hp<=0) completeMonster();
      }
    }
  }
  function interact() {
    if(Math.hypot(hero.x-elder.x,hero.y-elder.y)<48) {
      if(questStage===0) {
        questStage=1;
        say("Elder Rowan","A beast guards the old road. Defeat it, then bring me the amulet from the dungeon.",4.4);
        sfx(580,.08,"triangle");
      } else if(questStage===3) {
        say("Elder Rowan","Mossvale will remember your courage. Thank you, friend!",3.2);
      } else {
        say("Elder Rowan","The old road leads east. Keep your eyes open, traveler.",2.8);
      }
      return;
    }
    if(questStage===2 && Math.hypot(hero.x-amulet.x,hero.y-amulet.y)<46) {
      amulet.found=true; questStage=3; items["Ancient amulet"]++;
      floatText(amulet.x,amulet.y-20,"AMULET FOUND!","#fff38c");
      addXp(20); say("Quest complete!","You found the ancient amulet. The village is safe!",4.5);
      sfx(880,.22,"triangle");
    } else {
      say("Nothing nearby","There is no one or anything close enough to interact with.",1.8);
    }
  }
  function usePotion() {
    if(items.Potion>0 && hero.hp<hero.maxHp) {
      items.Potion--; hero.hp=Math.min(hero.maxHp,hero.hp+5);
      floatText(hero.x,hero.y-25,"+HEALTH","#a9ffb2"); sfx(520,.12,"triangle");
    }
  }

  function blocked(x,y) {
    const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE);
    if(!inMap(tx,ty)) return true;
    const t=map[ty][tx];
    if(t===2 || t===3 || t===5) return true;
    for(const h of houses) {
      if(x>h.x*TILE-5 && x<(h.x+h.w)*TILE+5 && y>h.y*TILE+5 && y<(h.y+h.h)*TILE+5) return true;
    }
    return false;
  }
  function moveActor(actor,dx,dy) {
    if(dx) {
      const nx=actor.x+dx;
      if(!blocked(nx-7,actor.y) && !blocked(nx+7,actor.y)) actor.x=nx;
    }
    if(dy) {
      const ny=actor.y+dy;
      if(!blocked(actor.x,ny-7) && !blocked(actor.x,ny+7)) actor.y=ny;
    }
  }
  function aiControl(dt) {
    if(questStage===3) { demoFinished=true; return; }
    let target;
    if(questStage===0) target=elder;
    else if(questStage===1) target=monster.alive?monster:elder;
    else {
      const route=[center(24,10),center(24,15),center(34,15),amulet];
      while(aiWaypoint<route.length-1 && Math.hypot(hero.x-route[aiWaypoint].x,hero.y-route[aiWaypoint].y)<18) aiWaypoint++;
      target=route[Math.min(aiWaypoint,route.length-1)];
    }
    const d=Math.hypot(target.x-hero.x,target.y-hero.y);
    if(questStage===1 && monster.alive && d<48) {
      attack();
      return;
    }
    if(questStage===0 && d<39) {
      interact(); return;
    }
    if(questStage===2 && Math.hypot(hero.x-amulet.x,hero.y-amulet.y)<38) {
      interact(); return;
    }
    if(d>5) {
      const vx=(target.x-hero.x)/d, vy=(target.y-hero.y)/d;
      moveActor(hero,vx*hero.speed*dt,vy*hero.speed*dt);
      if(Math.abs(vx)>Math.abs(vy)) hero.dir=vx>0?"right":"left";
      else hero.dir=vy>0?"down":"up";
      hero.anim+=dt*10;
    }
  }

  function update(dt) {
    elapsed+=dt; dt=Math.min(dt,.04);
    hero.attackCd=Math.max(0,hero.attackCd-dt);
    hero.hurt=Math.max(0,(hero.hurt||0)-dt);
    attackFlash=Math.max(0,attackFlash-dt);
    if(dialogue) { dialogueTimer-=dt; if(dialogueTimer<=0) dialogue=null; }

    if(demo) aiControl(dt);
    else {
      let dx=0,dy=0;
      if(keys.ArrowLeft||keys.a) dx--;
      if(keys.ArrowRight||keys.d) dx++;
      if(keys.ArrowUp||keys.w) dy--;
      if(keys.ArrowDown||keys.s) dy++;
      if(dx||dy) {
        const n=Math.hypot(dx,dy); dx/=n; dy/=n;
        moveActor(hero,dx*hero.speed*dt,dy*hero.speed*dt);
        if(Math.abs(dx)>Math.abs(dy)) hero.dir=dx>0?"right":"left";
        else hero.dir=dy>0?"down":"up";
        hero.anim+=dt*10;
      } else hero.anim=0;
      if(keys[" "]) attack();
    }

    if(monster.alive) {
      monster.anim+=dt*7;
      const d=Math.hypot(hero.x-monster.x,hero.y-monster.y);
      if(d<190) {
        if(d>24) {
          const vx=(hero.x-monster.x)/d, vy=(hero.y-monster.y)/d;
          moveActor(monster,vx*48*dt,vy*48*dt);
        } else {
          monster.attackCd-=dt;
          if(monster.attackCd<=0) {
            monster.attackCd=1.15; hero.hp=Math.max(0,hero.hp-1);
            hero.hurt=.25; floatText(hero.x,hero.y-20,"-1 HP","#ff8b82"); sfx(95,.09,"sawtooth");
            if(hero.hp===0) {
              hero.hp=hero.maxHp; hero.x=center(5,10).x; hero.y=center(5,10).y;
              say("Back on your feet","You were rescued in the village. Try again!",3);
            }
          }
        }
      }
    }
    for(let i=floats.length-1;i>=0;i--) {
      const f=floats[i]; f.life-=dt; f.y-=22*dt;
      if(f.life<=0) floats.splice(i,1);
    }
    cameraX=Math.max(0,Math.min(WORLD_W-VIEW_W,hero.x-VIEW_W/2));
    cameraY=Math.max(0,Math.min(WORLD_H-H,hero.y-H/2));
  }

  function rect(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
  function drawTile(x,y,t) {
    const sx=x*TILE-cameraX, sy=y*TILE-cameraY;
    const variation=rand(x,y);
    if(t===0) {
      rect(sx,sy,TILE,TILE,variation>.5?"#528448":"#4c8043");
      if(variation>.81) { rect(sx+5,sy+7,2,3,"#78a454"); rect(sx+17,sy+17,2,2,"#39703d"); }
    } else if(t===1) {
      rect(sx,sy,TILE,TILE,"#b7945b"); rect(sx,sy+2,TILE,TILE-4,"#c7a66a");
      if(variation>.55) rect(sx+5,sy+12,3,2,"#a88752");
    } else if(t===2) {
      rect(sx,sy,TILE,TILE,"#326c83");
      rect(sx+4,sy+6,8,2,"#65a9b0"); rect(sx+14,sy+17,6,2,"#4c909f");
    } else if(t===3) {
      rect(sx,sy,TILE,TILE,"#47763e"); rect(sx+3,sy+5,18,16,"#285b39");
      rect(sx+6,sy+2,12,17,"#347044"); rect(sx+9,sy+21,6,3,"#725035");
      rect(sx+7,sy+7,3,3,"#52924f");
    } else if(t===4) {
      rect(sx,sy,TILE,TILE,"#514d62");
      rect(sx+1,sy+1,22,22,variation>.5?"#625d70":"#5c586b");
      rect(sx+4,sy+5,2,2,"#81788a");
    } else {
      rect(sx,sy,TILE,TILE,"#38394a");
      rect(sx+1,sy+1,22,22,"#777080");
      rect(sx+3,sy+3,18,18,"#454456");
      rect(sx+5,sy+5,14,2,"#928799");
    }
  }
  function drawHouse(h) {
    const x=h.x*TILE-cameraX, y=h.y*TILE-cameraY, w=h.w*TILE, height=h.h*TILE;
    rect(x+2,y+12,w,height-8,"#513b32");
    rect(x+5,y+18,w-10,height-18,h.color);
    rect(x-4,y+2,w+8,16,h.roof);
    rect(x+4,y,w-8,5,"#c17a49");
    rect(x+w/2-5,y+height-22,10,22,"#49342e");
    rect(x+w/2-3,y+height-19,2,2,"#e4c477");
    rect(x+8,y+25,9,8,"#84bbc0"); rect(x+11,y+25,2,8,"#e5d29b");
  }
  function drawSprite(x,y,type,dir,frame,hurt=false) {
    const bob=frame?Math.sin(frame)*1.4:0, sx=Math.round(x), sy=Math.round(y+bob);
    // Ground shadow.
    rect(sx-9,sy+7,18,4,"#17251b99");
    if(type==="hero") {
      if(hurt) rect(sx-8,sy-13,16,21,"#fff");
      rect(sx-6,sy-12,12,14,"#315b9b");
      rect(sx-5,sy-16,10,8,"#e9b77d");
      rect(sx-6,sy-18,12,4,"#684337");
      rect(sx-4,sy-9,8,3,"#e3c75e");
      if(dir==="down") { rect(sx-3,sy-13,2,2,"#28232a"); rect(sx+2,sy-13,2,2,"#28232a"); }
      else if(dir==="left") rect(sx-6,sy-13,2,2,"#28232a");
      else if(dir==="right") rect(sx+4,sy-13,2,2,"#28232a");
      const step=frame && Math.floor(frame)%2 ? 2:0;
      rect(sx-5,sy+1,4,7-step,"#443643"); rect(sx+1,sy+1,4,7-(step?0:2),"#443643");
      if(attackFlash>0) {
        const ax=dir==="left"?-17:dir==="right"?10:-3;
        const ay=dir==="up"?-24:dir==="down"?8:-8;
        rect(sx+ax,sy+ay,7,12,"#e5e8dc");
      }
    } else if(type==="elder") {
      rect(sx-7,sy-12,14,20,"#7861a0"); rect(sx-5,sy-17,10,8,"#e3b98b");
      rect(sx-7,sy-20,14,5,"#d8d6cd"); rect(sx-3,sy-12,6,5,"#eee0ae");
      rect(sx-2,sy+7,4,7,"#624c39");
    } else {
      rect(sx-9,sy-9,18,15,"#a64437"); rect(sx-7,sy-14,14,9,"#bf5841");
      rect(sx-7,sy-7,4,3,"#f3d876"); rect(sx+3,sy-7,4,3,"#f3d876");
      rect(sx-7,sy+5,4,6,"#673c38"); rect(sx+3,sy+5,4,6,"#673c38");
      rect(sx-12,sy-3,4,3,"#7a332e"); rect(sx+8,sy-3,4,3,"#7a332e");
    }
  }
  function drawWorld() {
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,VIEW_W,H); ctx.clip();
    rect(0,0,VIEW_W,H,"#355f3a");
    const x0=Math.max(0,Math.floor(cameraX/TILE)), y0=Math.max(0,Math.floor(cameraY/TILE));
    const x1=Math.min(MAP_W,Math.ceil((cameraX+VIEW_W)/TILE)+1);
    const y1=Math.min(MAP_H,Math.ceil((cameraY+H)/TILE)+1);
    for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++) drawTile(x,y,map[y][x]);
    houses.forEach(drawHouse);

    // Dungeon entrance arch and signpost.
    let ex=29*TILE-cameraX, ey=14*TILE-cameraY;
    rect(ex-2,ey-15,28,31,"#292a38"); rect(ex+3,ey-11,18,27,"#171c29");
    rect(ex+6,ey-8,12,23,"#805a46"); rect(ex+8,ey-5,8,20,"#282534");
    let sx=13*TILE-cameraX, sy=10*TILE-cameraY;
    rect(sx,sy-12,3,26,"#725033"); rect(sx-8,sy-14,19,9,"#d8bf78");
    text("VILLAGE",sx-8,sy-7,7,"#493b2b");

    // Quest marker / amulet.
    if(!amulet.found && questStage>=2) {
      const ax=amulet.x-cameraX, ay=amulet.y-cameraY;
      const pulse=Math.sin(elapsed*5)*2;
      rect(ax-5,ay-9+pulse,10,13,"#ead773");
      rect(ax-2,ay-6+pulse,4,7,"#fff5aa");
      text("!",ax-2,ay-22+pulse,12,"#fff38c");
    }
    // NPC and monster.
    drawSprite(elder.x-cameraX,elder.y-cameraY,"elder","down",0);
    text("Elder Rowan",elder.x-cameraX-29,elder.y-cameraY-29,9,"#fff1bd");
    if(monster.alive) {
      drawSprite(monster.x-cameraX,monster.y-cameraY,"monster","down",monster.anim,monster.hurt>0);
      // Monster health bar.
      rect(monster.x-cameraX-13,monster.y-cameraY-22,26,4,"#34232b");
      rect(monster.x-cameraX-12,monster.y-cameraY-21,24*monster.hp/monster.maxHp,2,"#e95c4d");
    }
    drawSprite(hero.x-cameraX,hero.y-cameraY,"hero",hero.dir,hero.anim,hero.hurt>0);
    for(const f of floats) {
      ctx.globalAlpha=Math.max(0,f.life);
      text(f.text,f.x-cameraX,f.y-cameraY,11,f.color,"center");
      ctx.globalAlpha=1;
    }
    // Subtle day/night cycle; music-free, with optional little SFX.
    const night=(Math.sin((elapsed/82)*Math.PI*2-Math.PI/2)+1)/2;
    ctx.fillStyle=`rgba(20,26,65,${.04+night*.25})`; ctx.fillRect(0,0,VIEW_W,H);
    ctx.restore();
  }
  function text(str,x,y,size=12,color="#fff",align="left") {
    ctx.font=`bold ${size}px "Courier New", monospace`;
    ctx.textAlign=align; ctx.textBaseline="middle";
    ctx.fillStyle="#172025"; ctx.fillText(str,x+1,y+1);
    ctx.fillStyle=color; ctx.fillText(str,x,y);
    ctx.textAlign="left";
  }
  function panelBox(x,y,w,h) {
    rect(x,y,w,h,"#19272b"); rect(x+2,y+2,w-4,h-4,"#29393a");
    rect(x,y,w,2,"#d3b875"); rect(x,y+h-2,w,2,"#756140");
  }
  function drawMinimap(x,y,w,h) {
    panelBox(x,y,w,h);
    const sx=(w-10)/MAP_W, sy=(h-10)/MAP_H;
    for(let my=0;my<MAP_H;my++) for(let mx=0;mx<MAP_W;mx++) {
      const t=map[my][mx];
      const colors=["#57854a","#c2a166","#326c83","#315d38","#625d70","#454456"];
      rect(x+5+mx*sx,y+5+my*sy,Math.ceil(sx),Math.ceil(sy),colors[t]);
    }
    const dot=(wx,wy,c,r=3)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+5+wx/WORLD_W*(w-10),y+5+wy/WORLD_H*(h-10),r,0,Math.PI*2);ctx.fill();};
    dot(elder.x,elder.y,"#fff4bc",2.5);
    if(monster.alive) dot(monster.x,monster.y,"#fa6c52",2.5);
    if(!amulet.found && questStage>=2) dot(amulet.x,amulet.y,"#fff267",2.5);
    dot(hero.x,hero.y,"#65e9ff",3.5);
  }
  function drawDialogue() {
    if(!dialogue) return;
    panelBox(25,H-105,VIEW_W-50,82);
    text(dialogue.title,42,H-84,13,"#f6d77a");
    wrapText(dialogue.text,42,H-62,VIEW_W-95,12,"#f5efd4");
    text("E / SPACE to continue",VIEW_W-43,H-35,9,"#c8c3aa","right");
  }
  function wrapText(str,x,y,maxW,size,color) {
    ctx.font=`bold ${size}px "Courier New", monospace`;
    let line="", yy=y;
    for(const word of str.split(" ")) {
      const test=line?line+" "+word:word;
      if(ctx.measureText(test).width>maxW && line) { text(line,x,yy,size,color); yy+=15; line=word; }
      else line=test;
    }
    if(line) text(line,x,yy,size,color);
  }
  function drawPanel() {
    rect(VIEW_W,0,W-VIEW_W,H,"#182529");
    rect(VIEW_W,0,3,H,"#d3b875");
    text("MOSSVALE",VIEW_W+18,25,19,"#f2d784");
    text("THE AMULET OF MOSSVALE",VIEW_W+18,45,9,"#c7c3ad");

    panelBox(VIEW_W+12,60,226,83);
    text(`HP  ${"♥".repeat(Math.max(0,hero.hp))}${"·".repeat(Math.max(0,hero.maxHp-hero.hp))}`,VIEW_W+22,79,13,hero.hp<=3?"#ff847a":"#ffa29a");
    text(`LEVEL ${hero.level}    XP ${hero.xp}/${hero.nextXp}`,VIEW_W+22,103,11,"#f5e8b7");
    rect(VIEW_W+22,119,204,8,"#172127");
    rect(VIEW_W+23,120,202*hero.xp/hero.nextXp,6,"#e4be58");

    panelBox(VIEW_W+12,151,226,93);
    text("QUEST • FIND THE AMULET",VIEW_W+22,169,11,"#f2d784");
    const objective=questStage===0?"Talk to Elder Rowan":
      questStage===1?"Defeat the forest monster":
      questStage===2?"Find the amulet in the dungeon":"Return the amulet • COMPLETE";
    wrapText(objective,VIEW_W+22,190,198,11,questStage===3?"#a9eca4":"#f5efd4");
    text(`STEP ${Math.min(questStage+1,3)} / 3`,VIEW_W+22,229,9,"#b9b49f");

    text("INVENTORY",VIEW_W+17,265,11,"#f2d784");
    text(`🧪 Potion x${items.Potion}  [1]`,VIEW_W+22,284,10,"#d7e4d0");
    text(`● Moss coin x${items["Moss coin"]}`,VIEW_W+22,301,10,"#dfc776");
    text(`◆ Ancient amulet x${items["Ancient amulet"]}`,VIEW_W+22,318,10,"#d9d3b4");
    text("I: inventory   M: sound",VIEW_W+22,337,9,"#a9b2a8");

    drawMinimap(VIEW_W+15,350,220,145);
    text("MINIMAP",VIEW_W+22,359,9,"#f3e4b5");

    panelBox(VIEW_W+12,505,226,123);
    text(demo?"DEMO: ON  •  P to stop":"PLAYER: IN CONTROL",VIEW_W+22,522,10,demo?"#a6e2a6":"#85ddf1");
    text("WASD / arrows  Move",VIEW_W+22,542,10,"#eee8d0");
    text("SPACE  Attack",VIEW_W+22,558,10,"#eee8d0");
    text("E  Talk / interact",VIEW_W+22,574,10,"#eee8d0");
    text("1  Potion   I  Inventory",VIEW_W+22,590,10,"#eee8d0");
    text("P  Toggle demo  •  M  SFX",VIEW_W+22,610,9,"#c3bfa9");
    if(demo && demoFinished) text("Demo run complete!",VIEW_W+124,633,9,"#a9eca4","center");
  }
  function drawOverlay() {
    if(inventoryOpen) {
      panelBox(155,170,440,290);
      text("BACKPACK",375,200,18,"#f2d784","center");
      text(`Potion ................ ${items.Potion}`,190,250,14,"#eee8d0");
      text(`Moss coin ............ ${items["Moss coin"]}`,190,282,14,"#dfc776");
      text(`Ancient amulet ....... ${items["Ancient amulet"]}`,190,314,14,"#d9d3b4");
      text("Press I to close",375,420,11,"#b9b49f","center");
    }
  }
  function render() {
    drawWorld();
    drawPanel();
    drawDialogue();
    drawOverlay();
  }

  const controlCodes=new Set(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","e","E","w","a","s","d","1","i","I"]);
  window.addEventListener("keydown",e=>{
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
    if(e.repeat) { if(e.key===" ") keys[" "]=true; return; }
    if(e.key==="p"||e.key==="P") {
      demo=!demo; demoFinished=false; keys={};
      if(demo) { aiWaypoint=0; say("Demo mode","The hero is back on autopilot. Press any control key to take over.",2.5); }
      else say("Your turn","Use WASD or the arrow keys to move.",2.2);
      return;
    }
    if(e.key==="m"||e.key==="M") { soundOn=!soundOn; return; }
    if(controlCodes.has(e.key) && demo) {
      demo=false; demoFinished=false; keys={};
      say("Your turn","Autoplay stopped. The hero responds to your controls now.",2.2);
    }
    if(e.key==="i"||e.key==="I") { inventoryOpen=!inventoryOpen; return; }
    if(e.key==="e"||e.key==="E") {
      if(dialogue) dialogue=null; else interact();
      return;
    }
    if(e.key==="1") { usePotion(); return; }
    if(e.key===" " && dialogue) { dialogue=null; }
    keys[e.key]=true;
  });
  window.addEventListener("keyup",e=>{ keys[e.key]=false; });
  window.addEventListener("blur",()=>{keys={};});

  function frame(ts) {
    if(!lastTime) lastTime=ts;
    const dt=(ts-lastTime)/1000; lastTime=ts;
    update(dt); render();
    requestAnimationFrame(frame);
  }
  // Opening callout makes the controls and automatic demo obvious from frame one.
  say("Welcome to Mossvale","Demo is ON. Watch the hero talk, fight, and seek the amulet. Press any movement/action key to play; P toggles autoplay.",6);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

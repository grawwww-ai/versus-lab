<!DOCTYPE html>
<html lang="en">
<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmuration — flocking simulation</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden;
    background: #01080e;
  }
  canvas {
    display: block;
    width: 100vw; height: 100vh;
  }
  #label {
    position: fixed;
    left: 20px;
    bottom: 18px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    font-size: 12px;
    line-height: 1.4;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(150, 220, 245, 0.62);
    text-shadow: 0 0 14px rgba(70, 190, 255, 0.55), 0 0 3px rgba(0,0,0,0.6);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
  #label b {
    color: rgba(235, 252, 255, 0.96);
    font-weight: 600;
    text-shadow: 0 0 16px rgba(120, 230, 255, 0.9);
  }
  #label i {
    font-style: normal;
    opacity: 0.55;
    padding: 0 0.35em;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label"><b id="count">0</b><i>·</i>individuals</div>
<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Setup
   * ------------------------------------------------------------------ */

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });
  var countEl = document.getElementById('count');

  var N = 2200;              // number of boids
  var NUM_PRED = 2;          // number of predators

  // Motion tuning (units: pixels per 60fps-frame)
  var MAXSPEED = 2.45;
  var MINSPEED = 1.05;
  var CELL     = 30;         // spatial hash cell size
  var NEI_R    = 28;         // neighbour / alignment / cohesion radius
  var NEI_R2   = NEI_R * NEI_R;
  var SEP_R    = 12;         // separation radius
  var SEP_R2   = SEP_R * SEP_R;
  var FLEE_R   = 168;        // predator fear radius
  var FLEE_R2  = FLEE_R * FLEE_R;

  var W = 0, H = 0, DPR = 1;
  var cols = 1, rows = 1;
  var counts, starts, cursor, items;

  var bgGrad = null;

  var bloom = document.createElement('canvas');
  var bx = bloom.getContext('2d');
  var BSCALE = 0.4;

  /* ------------------------------------------------------------------ *
   *  Boid / predator state (typed arrays for speed)
   * ------------------------------------------------------------------ */

  var px = new Float32Array(N), py = new Float32Array(N);
  var vx = new Float32Array(N), vy = new Float32Array(N);
  var pan = new Float32Array(N);   // 0..1 panic level, used for lighting

  var ppx = new Float32Array(NUM_PRED), ppy = new Float32Array(NUM_PRED);
  var pvx = new Float32Array(NUM_PRED), pvy = new Float32Array(NUM_PRED);

  /* ------------------------------------------------------------------ *
   *  Pre-rendered glow sprites (one per brightness bucket)
   * ------------------------------------------------------------------ */

  var SPR = 22;
  var BUCKET_RGB = [
    [ 34, 100, 165],
    [ 56, 166, 214],
    [108, 224, 244],
    [186, 248, 255],
    [255, 255, 255]
  ];
  var FILLS = [
    'rgba(34,100,165,0.24)',
    'rgba(56,166,214,0.30)',
    'rgba(108,224,244,0.38)',
    'rgba(186,248,255,0.48)',
    'rgba(255,255,255,0.58)'
  ];

  function makeSprite(r, g, b) {
    var cv = document.createElement('canvas');
    cv.width = cv.height = SPR;
    var c2 = cv.getContext('2d');
    var grd = c2.createRadialGradient(SPR / 2, SPR / 2, 0, SPR / 2, SPR / 2, SPR / 2);
    grd.addColorStop(0.00, 'rgba(' + r + ',' + g + ',' + b + ',0.95)');
    grd.addColorStop(0.28, 'rgba(' + r + ',' + g + ',' + b + ',0.38)');
    grd.addColorStop(0.62, 'rgba(' + r + ',' + g + ',' + b + ',0.09)');
    grd.addColorStop(1.00, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    c2.fillStyle = grd;
    c2.fillRect(0, 0, SPR, SPR);
    return cv;
  }

  var sprites = [];
  for (var si = 0; si < BUCKET_RGB.length; si++) {
    sprites.push(makeSprite(BUCKET_RGB[si][0], BUCKET_RGB[si][1], BUCKET_RGB[si][2]));
  }

  var paths = [new Path2D(), new Path2D(), new Path2D(), new Path2D(), new Path2D()];

  /* ------------------------------------------------------------------ *
   *  Resize
   * ------------------------------------------------------------------ */

  function resize() {
    var oldW = W, oldH = H;
    var newW = Math.max(1, window.innerWidth);
    var newH = Math.max(1, window.innerHeight);

    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = newW; H = newH;

    canvas.width  = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Deep-sea gradient used both as background and as the trail fade layer
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0.00, '#0b3a4d');
    bgGrad.addColorStop(0.30, '#062636');
    bgGrad.addColorStop(0.62, '#031623');
    bgGrad.addColorStop(1.00, '#010910');

    bloom.width  = Math.max(1, Math.round(W * BSCALE));
    bloom.height = Math.max(1, Math.round(H * BSCALE));

    cols = Math.max(1, Math.ceil(W / CELL));
    rows = Math.max(1, Math.ceil(H / CELL));
    var nCells = cols * rows;
    counts = new Int32Array(nCells);
    starts = new Int32Array(nCells + 1);
    cursor = new Int32Array(nCells);
    items  = new Int32Array(N);

    // Keep everyone inside the new viewport
    if (oldW > 0 && oldH > 0) {
      var sx = W / oldW, sy = H / oldH;
      for (var i = 0; i < N; i++) { px[i] *= sx; py[i] *= sy; }
      for (var p = 0; p < NUM_PRED; p++) { ppx[p] *= sx; ppy[p] *= sy; }
    }
  }

  /* ------------------------------------------------------------------ *
   *  Initial conditions
   * ------------------------------------------------------------------ */

  function initBoids() {
    var cx0 = W * 0.5, cy0 = H * 0.5;
    var rad = Math.min(W, H) * 0.36;

    for (var i = 0; i < N; i++) {
      var a = Math.random() * Math.PI * 2;
      var r = Math.sqrt(Math.random()) * rad;
      var x = cx0 + Math.cos(a) * r;
      var y = cy0 + Math.sin(a) * r * 0.85;
      px[i] = x; py[i] = y;

      // tangential swirl so the cloud starts alive
      var tx = -(y - cy0), ty = (x - cx0);
      var tl = Math.sqrt(tx * tx + ty * ty) || 1;
      vx[i] = (tx / tl) * 2.0 + (Math.random() - 0.5) * 0.7;
      vy[i] = (ty / tl) * 2.0 + (Math.random() - 0.5) * 0.7;
      pan[i] = 0;
    }
  }

  function initPredators() {
    for (var p = 0; p < NUM_PRED; p++) {
      var a = p * Math.PI + Math.PI * 0.3;
      ppx[p] = W * 0.5 + Math.cos(a) * W * 0.44;
      ppy[p] = H * 0.5 + Math.sin(a) * H * 0.44;
      pvx[p] = -Math.cos(a) * 3.5;
      pvy[p] = -Math.sin(a) * 3.5;
    }
  }

  /* ------------------------------------------------------------------ *
   *  Spatial hash grid
   * ------------------------------------------------------------------ */

  function buildGrid() {
    var invCell = 1 / CELL;
    var nCells = cols * rows;
    counts.fill(0);

    var i, gx, gy, c;
    for (i = 0; i < N; i++) {
      gx = (px[i] * invCell) | 0;
      gy = (py[i] * invCell) | 0;
      if (gx < 0) gx = 0; else if (gx >= cols) gx = cols - 1;
      if (gy < 0) gy = 0; else if (gy >= rows) gy = rows - 1;
      counts[gy * cols + gx]++;
    }

    var s = 0;
    for (c = 0; c < nCells; c++) {
      starts[c] = s;
      cursor[c] = s;
      s += counts[c];
    }
    starts[nCells] = s;

    for (i = 0; i < N; i++) {
      gx = (px[i] * invCell) | 0;
      gy = (py[i] * invCell) | 0;
      if (gx < 0) gx = 0; else if (gx >= cols) gx = cols - 1;
      if (gy < 0) gy = 0; else if (gy >= rows) gy = rows - 1;
      c = gy * cols + gx;
      items[cursor[c]++] = i;
    }
  }

  /* ------------------------------------------------------------------ *
   *  Predators — chase the local centre of mass of the shoal
   * ------------------------------------------------------------------ */

  var CHASE_R = 300;
  var CHASE_R2 = CHASE_R * CHASE_R;
  var CHASE_CELLS = Math.ceil(CHASE_R / CELL);

  function updatePredators(dt) {
    var invCell = 1 / CELL;

    for (var p = 0; p < NUM_PRED; p++) {
      var pxp = ppx[p], pyp = ppy[p];
      var cx = 0, cy = 0, n = 0;

      var gx = (pxp * invCell) | 0;
      var gy = (pyp * invCell) | 0;
      if (gx < 0) gx = 0; else if (gx >= cols) gx = cols - 1;
      if (gy < 0) gy = 0; else if (gy >= rows) gy = rows - 1;

      var x0 = gx - CHASE_CELLS; if (x0 < 0) x0 = 0;
      var x1 = gx + CHASE_CELLS; if (x1 > cols - 1) x1 = cols - 1;
      var y0 = gy - CHASE_CELLS; if (y0 < 0) y0 = 0;
      var y1 = gy + CHASE_CELLS; if (y1 > rows - 1) y1 = rows - 1;

      for (var yy = y0; yy <= y1; yy++) {
        var base = yy * cols;
        for (var xx = x0; xx <= x1; xx++) {
          var c = base + xx;
          var e = starts[c + 1];
          for (var k = starts[c]; k < e; k++) {
            var j = items[k];
            var dx = px[j] - pxp, dy = py[j] - pyp;
            var d2 = dx * dx + dy * dy;
            if (d2 < CHASE_R2) {
              cx += px[j]; cy += py[j]; n++;
            }
          }
        }
      }

      var tx, ty;
      if (n > 0) { tx = cx / n; ty = cy / n; }
      else { tx = W * 0.5; ty = H * 0.5; }

      // Keep predators away from the walls
      var M = 170;
      if (pxp < M) tx += (M - pxp) * 2.4;
      if (pxp > W - M) tx -= (M - (W - pxp)) * 2.4;
      if (pyp < M) ty += (M - pyp) * 2.4;
      if (pyp > H - M) ty -= (M - (H - pyp)) * 2.4;

      var ch = Math.atan2(pvy[p], pvx[p]);
      var dx2 = tx - pxp, dy2 = ty - pyp;
      var dl = Math.sqrt(dx2 * dx2 + dy2 * dy2);
      var th;
      if (dl < 70) th = ch;                 // deep inside the shoal: plough straight on
      else th = Math.atan2(dy2, dx2);

      var diff = th - ch;
      while (diff >  Math.PI) diff -= 6.283185307179586;
      while (diff < -Math.PI) diff += 6.283185307179586;
      var maxTurn = 0.036 * dt;
      if (diff >  maxTurn) diff =  maxTurn;
      if (diff < -maxTurn) diff = -maxTurn;

      var nh = ch + diff;
      var spd = 3.5;
      pvx[p] = Math.cos(nh) * spd;
      pvy[p] = Math.sin(nh) * spd;
      ppx[p] = pxp + pvx[p] * dt;
      ppy[p] = pyp + pvy[p] * dt;
    }
  }

  /* ------------------------------------------------------------------ *
   *  Boid update — separation / alignment / cohesion / escape
   * ------------------------------------------------------------------ */

  var TIME = 0;

  function updateBoids(dt) {
    var invCell = 1 / CELL;
    var margin = 150;

    for (var i = 0; i < N; i++) {
      var x = px[i], y = py[i];
      var vxi = vx[i], vyi = vy[i];

      var sepX = 0, sepY = 0;
      var aliX = 0, aliY = 0;
      var cohX = 0, cohY = 0;
      var cnt = 0;

      var gx = (x * invCell) | 0;
      var gy = (y * invCell) | 0;
      if (gx < 0) gx = 0; else if (gx >= cols) gx = cols - 1;
      if (gy < 0) gy = 0; else if (gy >= rows) gy = rows - 1;

      var gx0 = gx > 0 ? gx - 1 : 0;
      var gx1 = gx < cols - 1 ? gx + 1 : cols - 1;
      var gy0 = gy > 0 ? gy - 1 : 0;
      var gy1 = gy < rows - 1 ? gy + 1 : rows - 1;

      for (var cy = gy0; cy <= gy1; cy++) {
        var base = cy * cols;
        for (var cxx = gx0; cxx <= gx1; cxx++) {
          var c = base + cxx;
          var e = starts[c + 1];
          for (var k = starts[c]; k < e; k++) {
            var j = items[k];
            if (j === i) continue;
            var dx = px[j] - x;
            var dy = py[j] - y;
            var d2 = dx * dx + dy * dy;
            if (d2 > NEI_R2 || d2 < 1e-8) continue;

            cnt++;
            aliX += vx[j]; aliY += vy[j];
            cohX += px[j]; cohY += py[j];

            if (d2 < SEP_R2) {
              var d = Math.sqrt(d2);
              var w = (1 - d / SEP_R) / d;
              sepX -= dx * w;
              sepY -= dy * w;
            }
          }
        }
      }

      var ax = 0, ay = 0;

      if (cnt > 0) {
        var inv = 1 / cnt;

        var m = Math.sqrt(sepX * sepX + sepY * sepY);
        if (m > 1e-5) { ax += (sepX / m) * 0.42; ay += (sepY / m) * 0.42; }

        aliX = aliX * inv - vxi;
        aliY = aliY * inv - vyi;
        m = Math.sqrt(aliX * aliX + aliY * aliY);
        if (m > 1e-5) { ax += (aliX / m) * 0.17; ay += (aliY / m) * 0.17; }

        cohX = cohX * inv - x;
        cohY = cohY * inv - y;
        m = Math.sqrt(cohX * cohX + cohY * cohY);
        if (m > 1e-5) { ax += (cohX / m) * 0.13; ay += (cohY / m) * 0.13; }
      }

      // --- escape from predators (the flash-expansion driver) ---
      var panic = 0;
      for (var p = 0; p < NUM_PRED; p++) {
        var ex = x - ppx[p], ey = y - ppy[p];
        var e2 = ex * ex + ey * ey;
        if (e2 < FLEE_R2) {
          var ed = Math.sqrt(e2) + 0.001;
          var f = 1 - ed / FLEE_R;
          var w2 = f * f * 3.0;
          ax += (ex / ed) * w2;
          ay += (ey / ed) * w2;
          if (f > panic) panic = f;
        }
      }
      pan[i] = panic;

      // --- soft boundary ---
      if (x < margin) { var bf = (margin - x) / margin; ax += bf * bf * 1.9; }
      else if (x > W - margin) { bf = (margin - (W - x)) / margin; ax -= bf * bf * 1.9; }
      if (y < margin) { bf = (margin - y) / margin; ay += bf * bf * 1.9; }
      else if (y > H - margin) { bf = (margin - (H - y)) / margin; ay -= bf * bf * 1.9; }

      // --- gentle large-scale curl, keeps the cloud twisting ---
      var curl = Math.sin(x * 0.0038 + TIME * 0.00035) *
                 Math.cos(y * 0.0038 - TIME * 0.00026);
      ax += -vyi * curl * 0.045;
      ay +=  vxi * curl * 0.045;

      // --- clamp acceleration ---
      var maxA = 0.9 + panic * 2.6;
      var am = Math.sqrt(ax * ax + ay * ay);
      if (am > maxA) { var sc = maxA / am; ax *= sc; ay *= sc; }

      var nvx = vxi + ax * dt;
      var nvy = vyi + ay * dt;

      var sp = Math.sqrt(nvx * nvx + nvy * nvy);
      var maxS = MAXSPEED * (1 + panic * 0.9);
      if (sp > maxS) {
        var s1 = maxS / sp; nvx *= s1; nvy *= s1;
      } else if (sp < MINSPEED) {
        if (sp > 1e-5) { var s2 = MINSPEED / sp; nvx *= s2; nvy *= s2; }
        else { nvx = MINSPEED; nvy = 0; }
      }

      vx[i] = nvx; vy[i] = nvy;
      px[i] = x + nvx * dt;
      py[i] = y + nvy * dt;
    }
  }

  /* ------------------------------------------------------------------ *
   *  Render
   * ------------------------------------------------------------------ */

  function render() {
    // --- trail fade: repaint the background gradient with partial alpha ---
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.19;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    // --- clear low-res bloom buffer ---
    bx.setTransform(1, 0, 0, 1, 0, 0);
    bx.clearRect(0, 0, bloom.width, bloom.height);
    bx.setTransform(BSCALE, 0, 0, BSCALE, 0, 0);

    // --- batch boid dots into 5 brightness buckets ---
    var p0 = paths[0], p1 = paths[1], p2 = paths[2], p3 = paths[3], p4 = paths[4];
    var i, b;

    for (i = 0; i < N; i++) {
      var x = px[i], y = py[i];
      var sp = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);

      var t = (sp - MINSPEED) * 0.75;
      if (t < 0) t = 0; else if (t > 1) t = 1;

      var br = 0.10 + t * 0.88 + pan[i] * 1.05;
      if (br > 1) br = 1;

      b = (br * 5) | 0;
      if (b > 4) b = 4;

      var s = 1.85 + br * 1.7;
      var h = s * 0.5;

      switch (b) {
        case 0: p0.rect(x - h, y - h, s, s); break;
        case 1: p1.rect(x - h, y - h, s, s); break;
        case 2: p2.rect(x - h, y - h, s, s); break;
        case 3: p3.rect(x - h, y - h, s, s); break;
        default: p4.rect(x - h, y - h, s, s); break;
      }

      // soft glow accumulation on the low-res buffer
      bx.drawImage(sprites[b], x - 8, y - 8, 16, 16);
    }

    // --- additive draw of the boid dots ---
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = FILLS[0]; ctx.fill(p0);
    ctx.fillStyle = FILLS[1]; ctx.fill(p1);
    ctx.fillStyle = FILLS[2]; ctx.fill(p2);
    ctx.fillStyle = FILLS[3]; ctx.fill(p3);
    ctx.fillStyle = FILLS[4]; ctx.fill(p4);

    // --- upscale the bloom: this is what makes the shoal read as one body ---
    ctx.globalAlpha = 0.42;
    ctx.drawImage(bloom, 0, 0, W, H);
    ctx.globalAlpha = 1;

    // --- predators ---
    for (var p = 0; p < NUM_PRED; p++) {
      var ang = Math.atan2(pvy[p], pvx[p]);
      ctx.save();
      ctx.translate(ppx[p], ppy[p]);
      ctx.rotate(ang);

      ctx.beginPath();
      ctx.moveTo(19, 0);
      ctx.quadraticCurveTo(4, 8.5, -13, 7.5);
      ctx.quadraticCurveTo(-7.5, 0, -13, -7.5);
      ctx.quadraticCurveTo(4, -8.5, 19, 0);
      ctx.closePath();

      ctx.shadowColor = 'rgba(255,138,52,0.95)';
      ctx.shadowBlur = 26;
      ctx.fillStyle = 'rgba(255,186,108,0.80)';
      ctx.fill();

      ctx.shadowBlur = 8;
      ctx.fillStyle = 'rgba(255,244,220,0.95)';
      ctx.beginPath();
      ctx.moveTo(13, 0);
      ctx.quadraticCurveTo(2, 3.4, -6, 3);
      ctx.quadraticCurveTo(-2, 0, -6, -3);
      ctx.quadraticCurveTo(2, -3.4, 13, 0);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
  }

  /* ------------------------------------------------------------------ *
   *  Main loop
   * ------------------------------------------------------------------ */

  var last = 0;

  function frame(now) {
    var dt = (now - last) / 16.6667;
    last = now;
    if (!isFinite(dt) || dt <= 0) dt = 1;
    if (dt > 3) dt = 3;

    TIME += dt * 16.6667;

    buildGrid();
    updatePredators(dt);
    updateBoids(dt);
    render();

    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ *
   *  Boot
   * ------------------------------------------------------------------ */

  resize();
  initBoids();
  initPredators();
  countEl.textContent = N.toLocaleString('en-US');

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', resize, { passive: true });

  last = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>

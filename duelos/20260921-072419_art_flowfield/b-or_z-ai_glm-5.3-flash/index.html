<!DOCTYPE html>
<html lang="en">
<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift — a flow-field nocturne</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#07070a; }
  canvas { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<script>
'use strict';

/* ============================ small utilities ============================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const smooth = x => x * x * (3 - 2 * x);

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ===================== noise, written from scratch ====================== */
/* Improved Perlin noise (3D), seeded permutation table. The z axis is time,
   so the whole flow field morphs continuously instead of just scrolling.   */
const PERM = new Uint8Array(512);
(function () {
  const rand = mulberry32(1337);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = (rand() * (i + 1)) | 0;
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();

function grad3(h, x, y, z) {
  h &= 15;
  const u = h < 8 ? x : y;
  const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
  return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
}

function noise3(x, y, z) {
  const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
  x -= X; y -= Y; z -= Z;
  const xi = X & 255, yi = Y & 255, zi = Z & 255;
  const u = x * x * x * (x * (x * 6 - 15) + 10);
  const v = y * y * y * (y * (y * 6 - 15) + 10);
  const w = z * z * z * (z * (z * 6 - 15) + 10);
  const A = PERM[xi] + yi, AA = PERM[A] + zi, AB = PERM[A + 1] + zi;
  const B = PERM[xi + 1] + yi, BA = PERM[B] + zi, BB = PERM[B + 1] + zi;
  const n000 = grad3(PERM[AA], x, y, z);
  const n100 = grad3(PERM[BA], x - 1, y, z);
  const n010 = grad3(PERM[AB], x, y - 1, z);
  const n110 = grad3(PERM[BB], x - 1, y - 1, z);
  const n001 = grad3(PERM[AA + 1], x, y, z - 1);
  const n101 = grad3(PERM[BA + 1], x - 1, y, z - 1);
  const n011 = grad3(PERM[AB + 1], x, y - 1, z - 1);
  const n111 = grad3(PERM[BB + 1], x - 1, y - 1, z - 1);
  const x00 = n000 + u * (n100 - n000), x10 = n010 + u * (n110 - n010);
  const x01 = n001 + u * (n101 - n001), x11 = n011 + u * (n111 - n011);
  const y0 = x00 + v * (x10 - x00), y1 = x01 + v * (x11 - x01);
  return y0 + w * (y1 - y0);
}

function fbm(x, y, z, oct) {
  let a = 0.5, f = 1, s = 0, norm = 0;
  for (let o = 0; o < oct; o++) {
    s += a * noise3(x * f + o * 37.7, y * f + o * 17.3, z * f + o * 91.1);
    norm += a; a *= 0.5; f *= 2.03;
  }
  return s / norm;
}

/* ================= curated palettes (hand-picked ramps) ================= */
const PALETTES = [
  ["#200b08", "#6d1f0d", "#c14a17", "#e88a2e", "#f7c46a", "#ffedc4"], // kiln / ember
  ["#04231c", "#0b5a45", "#17936f", "#4cc59a", "#a5e3b6", "#f4ecc0"], // verdigris / jade
  ["#26060f", "#6e1030", "#b52645", "#e35b6e", "#f79d8e", "#ffe4c9"], // coral ink
  ["#041a20", "#0a4152", "#106e7d", "#22a3a0", "#7edcc3", "#e9fff0"]  // glacier
].map(def => def.map(hex => [
  parseInt(hex.slice(1, 3), 16),
  parseInt(hex.slice(3, 5), 16),
  parseInt(hex.slice(5, 7), 16)
]));

const NB = 26, NB2 = NB * 2;
const thinCol = new Array(NB), thickCol = new Array(NB);
const tmpRGB = [0, 0, 0];

function rampMix(pa, pb, mix, u) {
  let seg = (u * 5) | 0, f = u * 5 - seg;
  if (seg > 4) { seg = 4; f = 1; }
  const e = f * f * (3 - 2 * f);
  for (let c = 0; c < 3; c++) {
    const a = pa[seg][c] + (pa[seg + 1][c] - pa[seg][c]) * e;
    const b = pb[seg][c] + (pb[seg + 1][c] - pb[seg][c]) * e;
    tmpRGB[c] = (a + (b - a) * mix) | 0;
  }
}

/* Palette timeline: 11s hold, 7s crossfade, 18s per palette, 72s full cycle */
function updateColors(t) {
  const p = t / 18;
  const i = ((p | 0) % 4 + 4) % 4, i2 = (i + 1) % 4;
  const f = p - (p | 0);
  const mix = f <= 11 / 18 ? 0 : smooth((f - 11 / 18) / (7 / 18));
  for (let b = 0; b < NB; b++) {
    rampMix(PALETTES[i], PALETTES[i2], mix, (b + 0.5) / NB);
    thinCol[b]  = 'rgba(' + tmpRGB[0] + ',' + tmpRGB[1] + ',' + tmpRGB[2] + ',0.10)';
    thickCol[b] = 'rgba(' + tmpRGB[0] + ',' + tmpRGB[1] + ',' + tmpRGB[2] + ',0.05)';
  }
}

/* ============================ canvas & state ============================ */
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
let W = 0, H = 0, DPR = 1, sizeScale = 1, SPDbase = 44;

const MAXP = 7000;
let active = 3000;
const X = new Float32Array(MAXP), Y = new Float32Array(MAXP);
const PX = new Float32Array(MAXP), PY = new Float32Array(MAXP);
const SPD = new Float32Array(MAXP), JIT = new Float32Array(MAXP);
const LIFE = new Float32Array(MAXP), MAXL = new Float32Array(MAXP);
const FLASH = new Float32Array(MAXP);
const CLS = new Uint8Array(MAXP), BUCKET = new Uint8Array(MAXP);
const LASTW = new Int32Array(MAXP);
const order = new Int32Array(MAXP);
const counts = new Int32Array(NB2), starts = new Int32Array(NB2), cursor = new Int32Array(NB2);

/* ============ flow field: precomputed grid of curl-noise vectors ========= */
/* Velocity = curl of a domain-warped fBm potential: divergence-free, so
   particles stream along evolving contours instead of clumping into sinks. */
const field = {
  cell: 16, invCell: 1 / 16, gw: 0, gh: 0, pw: 0, ph: 0,
  psi: null, vx: null, vy: null, invLen: 1 / 300,
  resize(w, h) {
    this.cell = Math.max(14, Math.ceil(Math.max(w / 150, h / 95)));
    this.invCell = 1 / this.cell;
    this.gw = Math.floor(w / this.cell) + 1;
    this.gh = Math.floor(h / this.cell) + 1;
    this.pw = this.gw + 2; this.ph = this.gh + 2;
    this.psi = new Float32Array(this.pw * this.ph);
    this.vx = new Float32Array(this.gw * this.gh);
    this.vy = new Float32Array(this.gw * this.gh);
    this.invLen = 1 / clamp(Math.min(w, h) * 0.36, 130, 430);
  },
  update(t) {
    const { pw, ph, psi, invLen, cell } = this;
    const k = invLen;
    let idx = 0;
    for (let j = 0; j < ph; j++) {
      const ny = (j - 1) * cell * k;
      for (let i = 0; i < pw; i++) {
        const nx = (i - 1) * cell * k;
        // domain warp: two slow noise channels displace the sample point
        const wx = noise3(nx * 0.52 + 13.7, ny * 0.52 - 71.3, t * 0.043 + 3.1);
        const wy = noise3(nx * 0.52 - 47.9, ny * 0.52 + 28.4, t * 0.057 + 11.7);
        psi[idx++] = fbm(nx + 1.85 * wx + 5.2, ny + 1.85 * wy - 8.4, t * 0.085, 3);
      }
    }
    const { gw, gh, vx, vy } = this;
    let acc = 0, o = 0;
    for (let j = 0; j < gh; j++) {
      const row = (j + 1) * pw + 1;
      for (let i = 0; i < gw; i++, o++) {
        const p = row + i;
        const dvx = psi[p + pw] - psi[p - pw];  //  ∂ψ/∂y
        const dvy = psi[p - 1] - psi[p + 1];    // −∂ψ/∂x
        vx[o] = dvx; vy[o] = dvy;
        acc += dvx * dvx + dvy * dvy;
      }
    }
    // RMS-normalize so liveliness is identical on every screen size
    const s = 1 / (Math.sqrt(acc / (gw * gh * 2)) || 1e-6);
    const n = gw * gh;
    for (let q = 0; q < n; q++) { vx[q] *= s; vy[q] *= s; }
  }
};

let sVX = 0, sVY = 0, sPSI = 0;
function sample(x, y) {
  const gw = field.gw, gh = field.gh;
  let gx = x * field.invCell, gy = y * field.invCell;
  if (gx < 0) gx = 0; else if (gx > gw - 1) gx = gw - 1;
  if (gy < 0) gy = 0; else if (gy > gh - 1) gy = gh - 1;
  const i = gx | 0, j = gy | 0, fx = gx - i, fy = gy - j;
  const i1 = i < gw - 1 ? i + 1 : i, j1 = j < gh - 1 ? j + 1 : j;
  const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy);
  const w01 = (1 - fx) * fy, w11 = fx * fy;
  const b = j * gw + i, b1 = j * gw + i1, bg = j1 * gw + i, bg1 = j1 * gw + i1;
  const vx = field.vx, vy = field.vy, psi = field.psi, pw = field.pw;
  sVX = vx[b] * w00 + vx[b1] * w10 + vx[bg] * w01 + vx[bg1] * w11;
  sVY = vy[b] * w00 + vy[b1] * w10 + vy[bg] * w01 + vy[bg1] * w11;
  const p = (j + 1) * pw + i + 1;
  sPSI = psi[p] * w00 + psi[p + 1] * w10 + psi[p + pw] * w01 + psi[p + pw + 1] * w11;
}

/* ========================= reset-wave machinery ========================= */
let waveOn = false, waveX = 0, waveY = 0, waveR = 0, waveSpeed = 0, waveId = 0;
let nextWaveT = 11.5, waveCount = 0, waveHue = 0;
const WAVE_TRAIL = 95;
const RINGS = [[-80, 26, 0.05], [-52, 24, 0.10], [-27, 22, 0.17], [-8, 16, 0.24], [4, 9, 0.10]];

function startWave(t) {
  waveX = W * (0.15 + 0.7 * Math.random());
  waveY = H * (0.15 + 0.7 * Math.random());
  waveSpeed = Math.max(W, H) / 4.6;
  waveR = 0; waveOn = true; waveId++;
  waveCount++;
  waveHue = 0.3 * Math.sin(waveCount * 2.4 + 0.7);
  nextWaveT = Infinity;
}

function carveWave() {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = '#000';
  for (let r = 0; r < RINGS.length; r++) {
    const off = RINGS[r][0], half = RINGS[r][1];
    const rIn = Math.max(0, waveR + off - half), rOut = waveR + off + half;
    if (rOut <= 0 || rOut <= rIn) continue;
    ctx.globalAlpha = RINGS[r][2];
    ctx.beginPath();
    ctx.arc(waveX, waveY, rOut, 0, TAU);
    ctx.arc(waveX, waveY, rIn, 0, TAU, true);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ============================ particle life ============================= */
function spawn(i, flashV) {
  X[i] = Math.random() * W; Y[i] = Math.random() * H;
  PX[i] = X[i]; PY[i] = Y[i];
  SPD[i] = Math.pow(Math.random(), 1.4) * 1.6 + 0.55;
  if (Math.random() < 0.06) SPD[i] *= 2.7;           // rare fast streaks
  CLS[i] = Math.random() < 0.12 ? 1 : 0;             // some thick "ink"
  JIT[i] = (Math.random() - 0.5) * 0.11;
  MAXL[i] = 8 + Math.random() * 16;
  LIFE[i] = Math.random() * MAXL[i];
  FLASH[i] = flashV;
  LASTW[i] = -1;
}

/* =============================== sizing ================================= */
function doResize(first) {
  const oldW = W, oldH = H;
  W = Math.max(60, window.innerWidth);
  H = Math.max(60, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sizeScale = clamp(Math.sqrt((W * H) / (1920 * 1080)), 0.62, 1.8);
  SPDbase = 44 * sizeScale;
  field.resize(W, H);
  field.update(0);
  if (first) {
    active = Math.round(clamp((W * H) / 400, 2000, MAXP));
    for (let i = 0; i < active; i++) spawn(i, 0.5);  // gentle luminous birth
  } else {
    const rx = W / oldW, ry = H / oldH;
    for (let i = 0; i < active; i++) {
      X[i] = clamp(X[i] * rx, 0, W - 1); Y[i] = clamp(Y[i] * ry, 0, H - 1);
      PX[i] = X[i]; PY[i] = Y[i];
      FLASH[i] = Math.max(FLASH[i], 0.4);
    }
    waveOn = false;
    nextWaveT = lastT + 6;
  }
}

/* ============================= main loop ================================ */
let lastT = 0, prevTs = 0, frameNo = 0, perfAcc = 0, perfN = 0;

function frame(ts) {
  requestAnimationFrame(frame);
  if (!prevTs) prevTs = ts;
  let dt = (ts - prevTs) / 1000;
  prevTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) dt = 0.001;
  const t = ts / 1000;
  lastT = t;

  // adaptive quality: if the device can't keep up, thin the swarm
  if (t > 3) {
    perfAcc += dt; perfN++;
    if (perfN >= 240) {
      if (perfAcc / perfN > 0.030 && active > 2200) active = (active * 0.72) | 0;
      perfAcc = 0; perfN = 0;
    }
  }

  if ((frameNo++ % 3) === 0) field.update(t);

  const uBias = 0.10 * Math.sin(t * 0.10 + 1.7) + waveHue;

  /* ---- wave lifecycle ---- */
  if (!waveOn && t >= nextWaveT && t > 4) startWave(t);
  if (waveOn) {
    waveR += waveSpeed * dt;
    carveWave();
    if (waveR - WAVE_TRAIL > Math.hypot(W, H) + 20) {
      waveOn = false;
      nextWaveT = t + 7.5 + Math.random() * 4;
    }
  }

  /* ---- trail decay (keeps hue, only lowers alpha) ---- */
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = '#000';
  let fa = (0.030 + (Math.random() - 0.5) * 0.012) * Math.min(3, dt * 60);
  if (waveOn) fa *= 1.35;
  ctx.globalAlpha = clamp(fa, 0.012, 0.25);
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  /* ---- physics + color bucketing ---- */
  const maxStep = field.cell * 0.8, maxStep2 = maxStep * maxStep;
  counts.fill(0);
  for (let i = 0; i < active; i++) {
    sample(X[i], Y[i]);
    const v = SPDbase * SPD[i] * dt;
    let dx = sVX * v, dy = sVY * v;
    const d2 = dx * dx + dy * dy;
    if (d2 > maxStep2) { const s = maxStep / Math.sqrt(d2); dx *= s; dy *= s; }
    PX[i] = X[i]; PY[i] = Y[i];
    let nx = X[i] + dx, ny = Y[i] + dy, wrapped = false;
    if (nx < -2) { nx += W + 4; wrapped = true; } else if (nx > W + 2) { nx -= W + 4; wrapped = true; }
    if (ny < -2) { ny += H + 4; wrapped = true; } else if (ny > H + 2) { ny -= H + 4; wrapped = true; }
    X[i] = nx; Y[i] = ny;
    if (wrapped) { PX[i] = nx; PY[i] = ny; }

    LIFE[i] -= dt;
    if (LIFE[i] <= 0) spawn(i, 0);

    if (waveOn) {
      const ddx = nx - waveX, ddy = ny - waveY;
      if (ddx * ddx + ddy * ddy < waveR * waveR && LASTW[i] !== waveId) {
        LASTW[i] = waveId;
        let sx = 0, sy = 0, ok = false;              // reborn in the wake
        for (let tr = 0; tr < 4; tr++) {
          const a = Math.random() * TAU, dd = waveR - 4 - Math.random() * 55;
          sx = waveX + Math.cos(a) * dd; sy = waveY + Math.sin(a) * dd;
          if (sx > 4 && sx < W - 4 && sy > 4 && sy < H - 4) { ok = true; break; }
        }
        if (!ok) { sx = clamp(sx, 4, W - 4); sy = clamp(sy, 4, H - 4); }
        X[i] = sx; Y[i] = sy; PX[i] = sx; PY[i] = sy;
        LIFE[i] = MAXL[i]; FLASH[i] = 1;
      }
    }
    FLASH[i] -= dt * 1.5; if (FLASH[i] < 0) FLASH[i] = 0;

    let u = sPSI * 0.425 + 0.5 + JIT[i] + uBias;
    u = u < 0 ? 0 : (u > 1 ? 1 : u);
    const b = ((u * (NB - 1) + 0.5) | 0) + CLS[i] * NB;
    BUCKET[i] = b;
    counts[b]++;
  }

  /* ---- counting sort: one stroke() call per color bucket ---- */
  let sum = 0;
  for (let b = 0; b < NB2; b++) { starts[b] = sum; sum += counts[b]; }
  cursor.set(starts);
  for (let i = 0; i < active; i++) order[cursor[BUCKET[i]]++] = i;

  /* ---- additive rendering ---- */
  ctx.globalCompositeOperation = 'lighter';
  const lw = clamp(sizeScale, 0.85, 1.5);

  ctx.lineWidth = lw;
  for (let b = 0; b < NB; b++) {
    const s = starts[b], e = s + counts[b];
    if (e === s) continue;
    ctx.strokeStyle = thinCol[b];
    ctx.beginPath();
    for (let k = s; k < e; k++) {
      const i = order[k];
      ctx.moveTo(PX[i], PY[i]); ctx.lineTo(X[i], Y[i]);
    }
    ctx.stroke();
  }

  ctx.lineWidth = lw * 2.6;
  for (let b = NB; b < NB2; b++) {
    const s = starts[b], e = s + counts[b];
    if (e === s) continue;
    ctx.strokeStyle = thickCol[b - NB];
    ctx.beginPath();
    for (let k = s; k < e; k++) {
      const i = order[k];
      ctx.moveTo(PX[i], PY[i]); ctx.lineTo(X[i], Y[i]);
    }
    ctx.stroke();
  }

  // freshly reborn particles flash briefly — the visible frontier of the wave
  ctx.lineWidth = lw * 1.7;
  ctx.strokeStyle = 'rgba(255,242,214,0.42)';
  ctx.beginPath();
  let anyFlash = false;
  for (let i = 0; i < active; i++) {
    if (FLASH[i] > 0.12) {
      ctx.moveTo(PX[i], PY[i]); ctx.lineTo(X[i], Y[i]);
      anyFlash = true;
    }
  }
  if (anyFlash) ctx.stroke();

  updateColors(t);
}

/* ================================ boot ================================== */
window.addEventListener('resize', () => {
  clearTimeout(doResize._t);
  doResize._t = setTimeout(() => doResize(false), 120);
});
doResize(true);
updateColors(0);
requestAnimationFrame(frame);
</script>
</body>

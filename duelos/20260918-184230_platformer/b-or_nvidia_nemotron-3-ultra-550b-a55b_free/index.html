<!DOCTYPE html>
<html lang="en">
<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<meta charset="UTF-8">
<title>Pixel Platformer</title>
<style>
    body { margin:0; background:#1a1a2e; overflow:hidden; font-family: 'Courier New', Courier, monospace; }
    canvas { display:block; margin:auto; background:#000; image-rendering: pixelated; image-rendering: crisp-edges; }
    #ui { position:absolute; top:10px; left:10px; color:#fff; font-size:18px; text-shadow:1px 1px 0 #000; pointer-events:none; z-index:10; }
    #winScreen { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-size:40px; text-shadow:2px 2px 0 #000; z-index:20; }
    #winScreen button { margin-top:20px; padding:10px 30px; font-size:24px; background:#e94560; border:none; color:#fff; cursor:pointer; font-family:inherit; border-radius:4px; }
    #winScreen button:hover { background:#ff6b6b; }
    .hint { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); color:#aaa; font-size:14px; pointer-events:none; text-align:center; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<div id="ui">Coins: 0 | Score: 0</div>
<div id="winScreen">
    <div id="winText">YOU WIN!</div>
    <div id="finalScore">Score: 0</div>
    <button onclick="restartGame()">Play Again</button>
</div>
<div class="hint">Arrows/SPACE to move, R restart, P toggle AI demo</div>
<script>
// ============ CONSTANTS ============
const CANVAS_W = 640, CANVAS_H = 360;
const GRAVITY = 0.45;
const PLAYER_SPEED = 3.2;
const JUMP_FORCE = -11.5;
const TILE = 32;
const WORLD_W = 4000; // ~6.25 screens
const PLAYER_W = 16, PLAYER_H = 24;

// Colors
const COL = {
    skyTop: '#0d1b2a',
    skyBot: '#1b2a4a',
    cloud: '#ffffff',
    hill1: '#2d3a4f',
    hill2: '#1f2d3d',
    groundTop: '#2ecc71',
    groundSide: '#27ae60',
    groundDark: '#1e8a49',
    platTop: '#3498db',
    platSide: '#2980b9',
    platDark: '#1c6a9e',
    movingPlat: '#e67e22',
    coin: '#f1c40f',
    coinShine: '#fff',
    enemyBody: '#e74c3c',
    enemyEye: '#fff',
    enemyDetail: '#c0392b',
    flagPole: '#7f8c8d',
    flagCloth: '#e74c3c',
    heroSkin: '#ffdbac',
    heroShirt: '#3498db',
    heroPants: '#2c3e50',
    heroShoe: '#1a1a2e',
    heroOutline: '#1a1a2e',
    particle: ['#f1c40f','#fff','#f39c12'],
    scoreText: '#fff'
};

// ============ SPRITE DEFINITIONS (16x16 or 16x24) ============
// Each string row, each char a color key. We'll map chars to colors.
const HERO_SPRITE = [
    "........####........",
    "......######......",
    "......######......",
    ".....########.....",
    ".....########.....",
    "....##########....",
    "....##OO##OO##....", // O = skin
    "...##O##O##O##...",
    "..##OOOOOOOOOO##..",
    "..##OOOOOOOOOO##..",
    ".##OOOOOOOOOOOO##.",
    ".##OOSSSSSSSSOO##.", // S = shirt
    ".##OOSSSSSSSSOO##.",
    "##OOOSSSSSSSSOOO##",
    "##OOOSSSSSSSSOOO##",
    "#OOOOOSSSSSSSOOOO#",
    "#OOOOOSSSSSSSOOOO#",
    "#OOOOOPPPPPPPOOOO#", // P = pants
    "#OOOOOPPPPPPPOOOO#",
    "##OOOOPPPPPPPOOO##",
    "##OOOOPPPPPPPOOO##",
    "###OOPPPPPPOO###",
    "####SSSSSSSS####",
    "####SSSSSSSS####",
    "###SSSSSSSSSSS###"
].map(row => row.split(''));

const HERO_COLOR_MAP = {
    '#': COL.heroOutline,
    'O': COL.heroSkin,
    'S': COL.heroShirt,
    'P': COL.heroPants,
    '.': null
};

const ENEMY_SPRITE = [
    "....########....",
    "...##########...",
    "..############..",
    ".##############.",
    ".##EE##EE##EE##.", // E = body
    ".##EE##EE##EE##.",
    ".##############.",
    "..############..",
    "...##########...",
    "....########...."
].map(row => row.split(''));

const ENEMY_COLOR_MAP = {
    '#': COL.enemyDetail,
    'E': COL.enemyBody,
    '.': null
};

const COIN_SPRITE = [
    "....####....",
    "..########..",
    ".##########.",
    "############",
    "############",
    ".##########.",
    "..########..",
    "....####...."
].map(row => row.split(''));

const FLAG_SPRITE = [
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    ".....##.....",
    "#########...",
    "#########...",
    "#########...",
    "#########...",
    "#########...",
    "#########...",
    "#########...",
    "#########..."
].map(row => row.split(''));

const FLAG_COLOR_MAP = {
    '#': COL.flagCloth,
    '.': null
};

// ============ UTIL ============
function drawSprite(ctx, sprite, colorMap, x, y, scale=2, flipX=false) {
    ctx.save();
    ctx.translate(x + (flipX ? sprite[0].length*scale : 0), y);
    if (flipX) ctx.scale(-1, 1);
    for (let i=0;i<sprite.length;i++) {
        for (let j=0;j<sprite[i].length;j++) {
            const c = colorMap[sprite[i][j]];
            if (c) {
                ctx.fillStyle = c;
                ctx.fillRect(j*scale, i*scale, scale, scale);
            }
        }
    }
    ctx.restore();
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

// ============ ENTITIES ============
class Player {
    constructor(x,y) {
        this.x=x; this.y=y;
        this.vx=0; this.vy=0;
        this.w=PLAYER_W; this.h=PLAYER_H;
        this.onGround=false;
        this.facingRight=true;
        this.animTimer=0;
        this.coins=0;
        this.score=0;
        this.invincible=0;
    }
    update(input, platforms, movingPlats, enemies, coins, flag, dt) {
        // Horizontal
        let move=0;
        if (input.left) move=-1;
        if (input.right) move=1;
        this.vx = move * PLAYER_SPEED;
        if (move!==0) this.facingRight = move>0;

        // Jump
        if (input.jump && this.onGround) {
            this.vy = JUMP_FORCE;
            this.onGround=false;
        }

        // Gravity
        this.vy += GRAVITY;
        if (this.vy > 12) this.vy = 12;

        // Moving platform carry
        let onMoving = null;
        for (let mp of movingPlats) {
            if (rectsOverlap(this.x, this.y+this.h, this.w, 2, mp.x, mp.y, mp.w, mp.h)) {
                onMoving = mp;
                break;
            }
        }

        // X movement & collision
        this.x += this.vx;
        for (let p of platforms) {
            if (rectsOverlap(this.x, this.y, this.w, this.h, p.x, p.y, p.w, p.h)) {
                if (this.vx > 0) this.x = p.x - this.w;
                else if (this.vx < 0) this.x = p.x + p.w;
                this.vx = 0;
            }
        }
        for (let mp of movingPlats) {
            if (rectsOverlap(this.x, this.y, this.w, this.h, mp.x, mp.y, mp.w, mp.h)) {
                if (this.vx > 0) this.x = mp.x - this.w;
                else if (this.vx < 0) this.x = mp.x + mp.w;
                this.vx = 0;
            }
        }

        // Y movement
        this.y += this.vy;
        this.onGround = false;
        for (let p of platforms) {
            if (rectsOverlap(this.x, this.y, this.w, this.h, p.x, p.y, p.w, p.h)) {
                if (this.vy > 0) { this.y = p.y - this.h; this.vy = 0; this.onGround = true; }
                else if (this.vy < 0) { this.y = p.y + p.h; this.vy = 0; }
            }
        }
        for (let mp of movingPlats) {
            if (rectsOverlap(this.x, this.y, this.w, this.h, mp.x, mp.y, mp.w, mp.h)) {
                if (this.vy > 0) { this.y = mp.y - this.h; this.vy = 0; this.onGround = true; }
                else if (this.vy < 0) { this.y = mp.y + mp.h; this.vy = 0; }
            }
        }

        // Moving platform carry (after collision)
        if (onMoving && this.onGround) {
            this.x += onMoving.vx;
        }

        // Coin collection
        for (let i=coins.length-1;i>=0;i--) {
            let c=coins[i];
            if (rectsOverlap(this.x, this.y, this.w, this.h, c.x, c.y, c.w, c.h)) {
                coins.splice(i,1);
                this.coins++;
                this.score += 100;
                spawnParticles(c.x+c.w/2, c.y+c.h/2, COL.particle, 8);
            }
        }

        // Enemy interaction
        for (let i=enemies.length-1;i>=0;i--) {
            let e=enemies[i];
            if (rectsOverlap(this.x, this.y, this.w, this.h, e.x, e.y, e.w, e.h)) {
                // Stomp?
                if (this.vy > 0 && this.y + this.h - this.vy <= e.y + 4) {
                    // Stomp
                    this.vy = JUMP_FORCE * 0.7;
                    enemies.splice(i,1);
                    this.score += 200;
                    spawnParticles(e.x+e.w/2, e.y+e.h/2, ['#e74c3c','#c0392b','#fff'], 10);
                } else if (this.invincible<=0) {
                    // Hurt - simple knockback and reset? For demo, just reset level? 
                    // But requirement: hero defeats by jumping. We'll just knock back and invincibility.
                    this.invincible = 60;
                    this.vx = this.facingRight ? -8 : 8;
                    this.vy = JUMP_FORCE * 0.5;
                    // Could lose life, but not required. We'll just penalize score.
                    this.score = Math.max(0, this.score - 100);
                }
            }
        }

        // Flag
        if (rectsOverlap(this.x, this.y, this.w, this.h, flag.x, flag.y, flag.w, flag.h)) {
            game.win();
        }

        // Invincibility timer
        if (this.invincible>0) this.invincible--;

        // Animation timer
        this.animTimer += Math.abs(this.vx) + Math.abs(this.vy);
    }
    draw(ctx, camX) {
        const sx = this.x - camX;
        const sy = this.y;
        // Simple bobbing when running
        let flip = !this.facingRight;
        drawSprite(ctx, HERO_SPRITE, HERO_COLOR_MAP, sx, sy, 2, flip);
        // Invincibility flash
        if (this.invincible>0 && Math.floor(this.invincible/4)%2===0) {
            ctx.globalAlpha=0.5;
            drawSprite(ctx, HERO_SPRITE, HERO_COLOR_MAP, sx, sy, 2, flip);
            ctx.globalAlpha=1;
        }
    }
}

class Enemy {
    constructor(x,y, patrolLeft, patrolRight) {
        this.x=x; this.y=y;
        this.w=16; this.h=16;
        this.vx=1;
        this.patrolLeft=patrolLeft;
        this.patrolRight=patrolRight;
        this.dir=1;
    }
    update(platforms, movingPlats, dt) {
        this.x += this.vx * this.dir;
        // Turn at patrol edges
        if (this.x <= this.patrolLeft) { this.x = this.patrolLeft; this.dir=1; }
        if (this.x + this.w >= this.patrolRight) { this.x = this.patrolRight - this.w; this.dir=-1; }
        // Also turn if no ground ahead
        let aheadX = this.x + (this.dir>0 ? this.w+4 : -4);
        let groundAhead = false;
        for (let p of platforms) {
            if (aheadX > p.x && aheadX < p.x+p.w && Math.abs(this.y+this.h - p.y) < 4) { groundAhead=true; break; }
        }
        for (let mp of movingPlats) {
            if (aheadX > mp.x && aheadX < mp.x+mp.w && Math.abs(this.y+this.h - mp.y) < 4) { groundAhead=true; break; }
        }
        if (!groundAhead) this.dir*=-1;
        // Simple gravity? Enemies stay on platforms, assume placed correctly.
    }
    draw(ctx, camX) {
        drawSprite(ctx, ENEMY_SPRITE, ENEMY_COLOR_MAP, this.x-camX, this.y, 2, this.dir<0);
    }
}

class Coin {
    constructor(x,y) { this.x=x; this.y=y; this.w=12; this.h=12; this.bob=Math.random()*Math.PI*2; }
    update(dt) { this.bob += 0.08; this.y += Math.sin(this.bob)*0.15; }
    draw(ctx, camX) {
        const sx = this.x - camX;
        const sy = this.y;
        ctx.save();
        ctx.translate(sx+this.w/2, sy+this.h/2);
        // Rotating coin effect: scale X
        const scaleX = Math.abs(Math.cos(this.bob));
        ctx.scale(scaleX, 1);
        drawSprite(ctx, COIN_SPRITE, { '#': COL.coin, '.': null }, -6, -6, 1.5);
        ctx.restore();
        // Shine
        if (Math.sin(this.bob*2)>0.8) {
            ctx.fillStyle = COL.coinShine;
            ctx.fillRect(sx+2, sy+2, 2, 2);
        }
    }
}

class MovingPlatform {
    constructor(x,y,w,h, startX, endX, speed) {
        this.x=x; this.y=y; this.w=w; this.h=h;
        this.startX=startX; this.endX=endX; this.speed=speed;
        this.vx=speed;
    }
    update() {
        this.x += this.vx;
        if (this.vx>0 && this.x >= this.endX) { this.x=this.endX; this.vx=-this.speed; }
        if (this.vx<0 && this.x <= this.startX) { this.x=this.startX; this.vx=this.speed; }
    }
    draw(ctx, camX) {
        const sx=this.x-camX;
        ctx.fillStyle = COL.movingPlat;
        ctx.fillRect(sx, this.y, this.w, this.h);
        // Top highlight
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(sx, this.y, this.w, 4);
        // Side
        ctx.fillStyle = '#d35400';
        ctx.fillRect(sx+this.w-4, this.y, 4, this.h);
    }
}

class Flag {
    constructor(x,y) { this.x=x; this.y=y; this.w=16; this.h=48; this.wave=0; }
    update() { this.wave += 0.1; }
    draw(ctx, camX) {
        const sx=this.x-camX;
        // Pole
        ctx.fillStyle = COL.flagPole;
        ctx.fillRect(sx+6, this.y, 4, this.h);
        // Flag cloth waving
        ctx.save();
        ctx.translate(sx+10, this.y);
        for (let i=0;i<FLAG_SPRITE.length;i++) {
            const offset = Math.sin(this.wave + i*0.3)*3;
            for (let j=0;j<FLAG_SPRITE[i].length;j++) {
                if (FLAG_SPRITE[i][j]==='#') {
                    ctx.fillStyle = COL.flagCloth;
                    ctx.fillRect(j*2+offset, i*2, 2, 2);
                }
            }
        }
        ctx.restore();
    }
}

class Particle {
    constructor(x,y,color) {
        this.x=x; this.y=y;
        this.vx=(Math.random()-0.5)*6;
        this.vy=(Math.random()-0.5)*6 - 2;
        this.life=1;
        this.decay=0.02+Math.random()*0.02;
        this.color=color;
        this.size=2+Math.random()*3;
    }
    update() { this.x+=this.vx; this.y+=this.vy; this.vy+=0.1; this.life-=this.decay; }
    draw(ctx, camX) {
        if (this.life<=0) return;
        ctx.globalAlpha=this.life;
        ctx.fillStyle=this.color;
        ctx.fillRect(this.x-camX, this.y, this.size, this.size);
        ctx.globalAlpha=1;
    }
}

let particles=[];
function spawnParticles(x,y,colors,count) {
    for(let i=0;i<count;i++) {
        particles.push(new Particle(x,y, colors[Math.floor(Math.random()*colors.length)]));
    }
}

// ============ LEVEL GENERATION ============
function generateLevel() {
    const platforms=[];
    const movingPlats=[];
    const enemies=[];
    const coins=[];
    // Ground
    let groundY = CANVAS_H - 32;
    for (let x=0; x<WORLD_W; x+=TILE) {
        // Random gaps, but ensure not too many consecutive gaps
        if (x>200 && x<WORLD_W-200 && Math.random()<0.08) {
            // Create a gap of 2-4 tiles
            let gapLen = 2+Math.floor(Math.random()*3);
            x += gapLen*TILE;
            continue;
        }
        platforms.push({x, y:groundY, w:TILE, h:32});
    }
    // Floating platforms
    for (let i=0;i<30;i++) {
        let px = 200 + Math.random()*(WORLD_W-400);
        let py = 100 + Math.random()*(CANVAS_H-200);
        let pw = TILE * (2+Math.floor(Math.random()*4));
        platforms.push({x:px, y:py, w:pw, h:16});
    }
    // Moving platforms
    for (let i=0;i<8;i++) {
        let px = 300 + Math.random()*(WORLD_W-600);
        let py = 150 + Math.random()*(CANVAS_H-250);
        let pw = 96;
        let travel = 120 + Math.random()*160;
        let start = px;
        let end = px + travel;
        if (end > WORLD_W-100) end = WORLD_W-100;
        let speed = 1 + Math.random()*1.5;
        movingPlats.push(new MovingPlatform(px, py, pw, 16, start, end, speed));
    }
    // Enemies on platforms (ground and floating)
    for (let p of platforms) {
        if (p.w >= 64 && Math.random()<0.3) {
            let ex = p.x + 8 + Math.random()*(p.w-32);
            let ey = p.y - 16;
            enemies.push(new Enemy(ex, ey, p.x+8, p.x+p.w-24));
        }
    }
    for (let mp of movingPlats) {
        if (Math.random()<0.4) {
            let ex = mp.startX + 10;
            let ey = mp.y - 16;
            enemies.push(new Enemy(ex, ey, mp.startX+10, mp.endX-10));
        }
    }
    // Coins
    for (let i=0;i<60;i++) {
        let cx = 100 + Math.random()*(WORLD_W-200);
        let cy = 50 + Math.random()*(CANVAS_H-150);
        // Snap to near platforms? Just place randomly, some will be in air.
        coins.push(new Coin(cx, cy));
    }
    // Flag at end
    let flagX = WORLD_W - 100;
    let flagY = groundY - 48;
    const flag = new Flag(flagX, flagY);
    return {platforms, movingPlats, enemies, coins, flag};
}

// ============ PARALLAX BACKGROUND ============
const clouds = [];
const hills = [];
function initBackground() {
    for (let i=0;i<20;i++) {
        clouds.push({x:Math.random()*WORLD_W, y:Math.random()*100, w:60+Math.random()*80, h:20+Math.random()*30, speed:0.05+Math.random()*0.05});
    }
    for (let i=0;i<15;i++) {
        hills.push({x:Math.random()*WORLD_W, y:CANVAS_H-80-Math.random()*60, w:120+Math.random()*200, h:80+Math.random()*60, speed:0.2+Math.random()*0.15});
    }
}
function drawBackground(ctx, camX) {
    // Sky gradient
    const grad = ctx.createLinearGradient(0,0,0,CANVAS_H);
    grad.addColorStop(0, COL.skyTop);
    grad.addColorStop(1, COL.skyBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
    // Hills (parallax 0.3)
    for (let h of hills) {
        const sx = h.x - camX * h.speed;
        ctx.fillStyle = h.speed > 0.25 ? COL.hill1 : COL.hill2;
        ctx.beginPath();
        ctx.moveTo(sx, CANVAS_H);
        ctx.lineTo(sx + h.w/2, h.y);
        ctx.lineTo(sx + h.w, CANVAS_H);
        ctx.closePath();
        ctx.fill();
    }
    // Clouds (parallax 0.1)
    ctx.fillStyle = COL.cloud;
    for (let c of clouds) {
        const sx = c.x - camX * c.speed;
        // Draw cloud as few circles
        ctx.beginPath();
        ctx.arc(sx, c.y, c.h, 0, Math.PI*2);
        ctx.arc(sx+c.w*0.3, c.y-c.h*0.3, c.h*0.8, 0, Math.PI*2);
        ctx.arc(sx+c.w*0.6, c.y, c.h*0.9, 0, Math.PI*2);
        ctx.fill();
    }
}

// ============ GAME STATE ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const winScreen = document.getElementById('winScreen');
const winText = document.getElementById('winText');
const finalScore = document.getElementById('finalScore');

let game = {
    player: null,
    platforms: [],
    movingPlats: [],
    enemies: [],
    coins: [],
    flag: null,
    camX: 0,
    input: {left:false,right:false,jump:false},
    autoplay: false,
    won: false,
    init() {
        initBackground();
        const lvl = generateLevel();
        this.platforms = lvl.platforms;
        this.movingPlats = lvl.movingPlats;
        this.enemies = lvl.enemies;
        this.coins = lvl.coins;
        this.flag = lvl.flag;
        this.player = new Player(64, CANVAS_H-100);
        this.camX = 0;
        this.won = false;
        winScreen.style.display = 'none';
        particles = [];
    },
    update(dt) {
        if (this.won) return;
        // Autoplay AI
        if (this.autoplay) {
            this.input = this.getAIInput();
        }
        // Update entities
        for (let mp of this.movingPlats) mp.update();
        for (let e of this.enemies) e.update(this.platforms, this.movingPlats, dt);
        for (let c of this.coins) c.update(dt);
        this.flag.update();
        this.player.update(this.input, this.platforms, this.movingPlats, this.enemies, this.coins, this.flag, dt);
        // Camera follow
        this.camX += (this.player.x - this.camX - CANVAS_W/2) * 0.1;
        if (this.camX < 0) this.camX = 0;
        if (this.camX > WORLD_W - CANVAS_W) this.camX = WORLD_W - CANVAS_W;
        // Particles
        for (let i=particles.length-1;i>=0;i--) {
            particles[i].update();
            if (particles[i].life<=0) particles.splice(i,1);
        }
        // UI
        ui.textContent = `Coins: ${this.player.coins} | Score: ${this.player.score}`;
    },
    getAIInput() {
        const p = this.player;
        const flagX = this.flag.x;
        const input = {left:false, right:false, jump:false};
        // Always move right towards flag
        if (p.x < flagX - 20) input.right = true;
        else input.right = false;

        // Sensors
        const frontX = p.x + (p.facingRight ? p.w + 24 : -24);
        const footY = p.y + p.h;
        const midY = p.y + p.h/2;

        // Check ground ahead
        let groundAhead = false;
        for (let plat of this.platforms) {
            if (frontX > plat.x && frontX < plat.x+plat.w && Math.abs(footY - plat.y) < 8) { groundAhead=true; break; }
        }
        for (let mp of this.movingPlats) {
            if (frontX > mp.x && frontX < mp.x+mp.w && Math.abs(footY - mp.y) < 8) { groundAhead=true; break; }
        }

        // Check wall ahead
        let wallAhead = false;
        for (let plat of this.platforms) {
            if (p.facingRight) {
                if (frontX > plat.x && frontX < plat.x+4 && midY > plat.y && midY < plat.y+plat.h) { wallAhead=true; break; }
            } else {
                if (frontX < plat.x+plat.w && frontX > plat.x+plat.w-4 && midY > plat.y && midY < plat.y+plat.h) { wallAhead=true; break; }
            }
        }
        for (let mp of this.movingPlats) {
            if (p.facingRight) {
                if (frontX > mp.x && frontX < mp.x+4 && midY > mp.y && midY < mp.y+mp.h) { wallAhead=true; break; }
            } else {
                if (frontX < mp.x+mp.w && frontX > mp.x+mp.w-4 && midY > mp.y && midY < mp.y+mp.h) { wallAhead=true; break; }
            }
        }

        // Check enemy ahead on same platform
        let enemyAhead = false;
        for (let e of this.enemies) {
            if (p.facingRight) {
                if (e.x > p.x && e.x < p.x+80 && Math.abs(e.y - (p.y+p.h-16)) < 8) { enemyAhead=true; break; }
            } else {
                if (e.x < p.x && e.x > p.x-80 && Math.abs(e.y - (p.y+p.h-16)) < 8) { enemyAhead=true; break; }
            }
        }

        // Jump conditions
        if (p.onGround) {
            if (!groundAhead) input.jump = true; // gap
            if (wallAhead) input.jump = true; // wall
            if (enemyAhead) input.jump = true; // stomp enemy
            // Coin above?
            for (let c of this.coins) {
                if (c.x > p.x-20 && c.x < p.x+60 && c.y < p.y-20 && c.y > p.y-80) {
                    input.jump = true;
                    break;
                }
            }
        }

        // If stuck (not moving horizontally but trying), jump
        if (Math.abs(p.vx) < 0.1 && input.right && p.onGround) {
            // maybe stuck on small ledge
            input.jump = true;
        }

        return input;
    },
    draw() {
        // Background
        drawBackground(ctx, this.camX);
        // Platforms
        for (let p of this.platforms) {
            const sx = p.x - this.camX;
            // Draw tile-based ground
            ctx.fillStyle = COL.groundTop;
            ctx.fillRect(sx, p.y, p.w, 4);
            ctx.fillStyle = COL.groundSide;
            ctx.fillRect(sx, p.y+4, p.w, p.h-4);
            ctx.fillStyle = COL.groundDark;
            ctx.fillRect(sx+p.w-4, p.y+4, 4, p.h-4);
        }
        // Moving platforms
        for (let mp of this.movingPlats) mp.draw(ctx, this.camX);
        // Coins
        for (let c of this.coins) c.draw(ctx, this.camX);
        // Enemies
        for (let e of this.enemies) e.draw(ctx, this.camX);
        // Flag
        this.flag.draw(ctx, this.camX);
        // Player
        this.player.draw(ctx, this.camX);
        // Particles
        for (let pt of particles) pt.draw(ctx, this.camX);
    },
    win() {
        this.won = true;
        winText.textContent = "YOU WIN!";
        finalScore.textContent = `Score: ${this.player.score}  Coins: ${this.player.coins}`;
        winScreen.style.display = 'flex';
    }
};

// ============ INPUT ============
window.addEventListener('keydown', e => {
    if (e.code==='ArrowLeft') game.input.left=true;
    if (e.code==='ArrowRight') game.input.right=true;
    if (e.code==='Space' || e.code==='ArrowUp') game.input.jump=true;
    if (e.code==='KeyR') restartGame();
    if (e.code==='KeyP') { game.autoplay = !game.autoplay; console.log('Autoplay:', game.autoplay); }
});
window.addEventListener('keyup', e => {
    if (e.code==='ArrowLeft') game.input.left=false;
    if (e.code==='ArrowRight') game.input.right=false;
    if (e.code==='Space' || e.code==='ArrowUp') game.input.jump=false;
});

function restartGame() {
    game.init();
}

// ============ MAIN LOOP ============
let lastTime=0;
function loop(time) {
    const dt = (time-lastTime)/1000; lastTime=time;
    game.update(dt);
    game.draw();
    requestAnimationFrame(loop);
}
game.init();
requestAnimationFrame(loop);

</script>

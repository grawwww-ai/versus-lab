<!DOCTYPE html>
<html lang="en">
<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kart Rush — Auto Racing</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #06070c; color: #fff;
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;

  }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }

  .panel {
    position: absolute;
    background: rgba(10, 14, 26, 0.62);
    border: 2px solid rgba(255,255,255,0.16);
    border-radius: 12px;
    padding: 10px 13px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.45);

  #posList { left: 16px; top: 16px; min-width: 208px; }

    font-size: 11px; letter-spacing: 3px; opacity: .6; margin-bottom: 6px; font-weight: bold;
  }

    display: flex; align-items: center; gap: 8px; padding: 3px 4px; font-size: 15px;
    border-radius: 6px; line-height: 1.15;
  }
  #posList .row.me { background: rgba(255, 214, 70, 0.18); box-shadow: inset 0 0 0 1px rgba(255,214,70,.4); }
  #posList .pos { width: 30px; font-weight: bold; color: #ffd94a; font-size: 14px; }
  #posList .dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,.6); }
  #posList .nm { flex: 1; letter-spacing: .5px; }
  #posList .lap { font-size: 11px; opacity: .65; }

  #infoPanel { right: 16px; top: 16px; min-width: 170px; text-align: right; }
  #infoPanel .big { font-size: 30px; font-weight: bold; line-height: 1; letter-spacing: 1px; }
  #infoPanel .lbl { font-size: 10px; letter-spacing: 3px; opacity: .55; margin-top: 8px; }
  #infoPanel .val { font-size: 17px; font-weight: bold; }
  #infoPanel .sub { font-size: 12px; opacity: .75; margin-top: 4px; }

  #help {
    left: 16px; bottom: 16px; font-size: 13px; line-height: 1.75; max-width: 400px;
  }
  #help b { color: #ffd94a; }
  #help .k {
    display: inline-block; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.25);

  }
  #bigMsg.go { color: #52ff7a; }

  #demoBadge {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(255, 60, 60, 0.85); border-radius: 20px; padding: 7px 20px;
    font-weight: bold; letter-spacing: 3px; font-size: 13px; display: none;
    box-shadow: 0 0 22px rgba(255,60,60,.55);
  }
  #demoBadge.on { display: block; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }

  #banner {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    text-align: center; font-size: 40px; font-weight: bold; letter-spacing: 4px;
    text-shadow: 0 6px 24px rgba(0,0,0,.8); color: #fff; display: none;
  }
  #banner.on { display: block; }
  #banner small { display:block; font-size: 17px; letter-spacing: 2px; opacity: .8; margin-top: 10px; font-weight: normal; }
</style>
</head>
<body>
<div id="hud">
  <div id="posList" class="panel"><div class="title">POSITION</div><div id="posRows"></div></div>
  <div id="infoPanel" class="panel">
    <div class="lbl">LAP</div>
    <div class="big" id="lapTxt">1/3</div>
    <div class="lbl">SPEED</div>
    <div class="val" id="spdTxt">0 km/h</div>
    <div class="sub" id="timeTxt">0:00.0</div>
    <div class="sub" id="posTxt">3rd place</div>
  </div>
  <div id="help" class="panel">
    <b>DRIVE:</b> <span class="k">↑</span><span class="k">↓</span><span class="k">←</span><span class="k">→</span>
    (or W A S D) &nbsp; <b>DRIFT:</b> <span class="k">SPACE</span><br>
    <b>P</b> = autoplay demo &nbsp;·&nbsp; <b>C</b> = camera &nbsp;·&nbsp; <b>R</b> = respawn
  </div>
  <div id="demoBadge">DEMO MODE — PRESS ANY KEY TO PLAY</div>
  <div id="bigMsg"></div>
  <div id="banner"></div>
</div>

<script type="module">
import * as THREE from 'three';

/* =========================================================================
   RENDERER / SCENE
   ========================================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const SKY = 0x8fc9e8;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 190, 560);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.4, 1800);
camera.position.set(0, 12, -30);

scene.add(new THREE.HemisphereLight(0xd4ecff, 0x3d5a2b, 1.05));
const sun = new THREE.DirectionalLight(0xfff1d2, 1.45);
sun.position.set(160, 280, 110);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.22));

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================================
   TRACK CURVE
   ========================================================================= */
const CP = [
  [  40,  2, -46],
  [ 130,  5, -40],
  [ 215,  9,  -8],
  [ 262, 12,  55],
  [ 258, 12, 135],
  [ 210, 10, 195],
  [ 145,  7, 210],
  [  95,  3, 185],
  [  58,  0, 200],
  [  12, -3, 190],
  [ -55, -6, 165],
  [-105, -7, 110],
  [-115, -5,  40],
  [ -85, -2, -20],
  [ -35,  0, -50],
];

const curve = new THREE.CatmullRomCurve3(
  CP.map(p => new THREE.Vector3(p[0], p[1], p[2])), true, 'catmullrom', 0.5
);
curve.arcLengthDivisions = 4000;

const SAMP = 720;            // number of track samples
const HW = 7;                // half road width

const TP = [], TT = [], TR = [], TCUM = [];
for (let i = 0; i < SAMP; i++) {
  const u = i / SAMP;
  const p = curve.getPointAt(u);
  const t = curve.getTangentAt(u).normalize();
  const r = new THREE.Vector3(-t.z, 0, t.x).normalize(); // tangent × up
  TP.push(p); TT.push(t); TR.push(r);
}
let trackLen = 0;
for (let i = 0; i < SAMP; i++) {
  TCUM.push(trackLen);
  trackLen += TP[i].distanceTo(TP[(i + 1) % SAMP]);
}
const SPACING = trackLen / SAMP;

/* ---- ground height helper ------------------------------------------------ */
function groundOff(lat, x, z) {
  const a = Math.abs(lat);
  const t = Math.min(1, Math.max(0, (a - 8) / 42));
  const n = Math.sin(x * 0.043) * Math.cos(z * 0.039) * 2.2 +
            Math.sin(x * 0.019 + 1.3) * Math.cos(z * 0.023) * 3.0;
  return -0.12 - 0.9 * t + n * t;
}

/* =========================================================================
   TRACK MESHES
   ========================================================================= */
// ---- asphalt ----
{
  const pos = [], idx = [], uv = [];
  for (let i = 0; i <= SAMP; i++) {
    const k = i % SAMP, p = TP[k], r = TR[k];
    pos.push(p.x - r.x * HW, p.y, p.z - r.z * HW);
    pos.push(p.x + r.x * HW, p.y, p.z + r.z * HW);
    uv.push(0, i * 0.22, 1, i * 0.22);
  }
  for (let i = 0; i < SAMP; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0x41434c })));
}

// ---- kerbs (red / white) ----
function buildKerb(side) {
  const inner = HW * side;
  const outer = (HW + 1.5) * side;
  const pos = [], col = [];
  const cRed = new THREE.Color(0xe04434), cWht = new THREE.Color(0xf3f3f3);
  for (let i = 0; i < SAMP; i++) {
    const k1 = i, k2 = (i + 1) % SAMP;
    const p1 = TP[k1], r1 = TR[k1], p2 = TP[k2], r2 = TR[k2];
    const c = (Math.floor(i / 6) % 2 === 0) ? cRed : cWht;
    const A = [p1.x + r1.x * inner, p1.y + 0.07, p1.z + r1.z * inner];
    const B = [p1.x + r1.x * outer, p1.y - 0.05, p1.z + r1.z * outer];
    const C = [p2.x + r2.x * outer, p2.y - 0.05, p2.z + r2.z * outer];
    const D = [p2.x + r2.x * inner, p2.y + 0.07, p2.z + r2.z * inner];
    for (const v of [A, B, C, A, C, D]) {
      pos.push(v[0], v[1], v[2]);
      col.push(c.r, c.g, c.b);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  scene.add(new THREE.Mesh(g, m));
}
buildKerb(-1);
buildKerb(1);

// ---- surrounding ground ----
const groundCols = [-78, -50, -28, -14, -6.5, 6.5, 14, 28, 50, 78];
{
  const NC = groundCols.length;
  const pos = [], col = [], idx = [];
  const c = new THREE.Color();
  for (let i = 0; i <= SAMP; i++) {
    const k = i % SAMP, p = TP[k], r = TR[k];
    for (let j = 0; j < NC; j++) {
      const lat = groundCols[j];
      const x = p.x + r.x * lat, z = p.z + r.z * lat;
      pos.push(x, p.y + groundOff(lat, x, z), z);
      const t = Math.min(1, Math.abs(lat) / 78);
      c.setHSL(0.265 - t * 0.035, 0.44 - t * 0.14, 0.29 + t * 0.08);
      col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < SAMP; i++) {
    for (let j = 0; j < NC - 1; j++) {
      const a = i * NC + j, b = a + 1, cc = a + NC, d = cc + 1;
      idx.push(a, b, cc, b, d, cc);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })));
}

/* =========================================================================
   SCENERY  (trees, bushes, start gantry)
   ========================================================================= */
function nearTrack(x, z, thresh) {
  for (let i = 0; i < SAMP; i += 4) {
    const p = TP[i];
    const dx = p.x - x, dz = p.z - z;
    if (dx * dx + dz * dz < thresh * thresh) return true;
  }
  return false;
}

const dummy = new THREE.Object3D();
const tmpCol = new THREE.Color();

// trees
const TREE_COUNT = 230;
{
  const trunkGeo = new THREE.CylinderGeometry(0.32, 0.48, 3.4, 6);
  trunkGeo.translate(0, 1.7, 0);
  const leafGeo = new THREE.ConeGeometry(2.5, 6.8, 7);
  leafGeo.translate(0, 6.1, 0);

  const trunkMesh = new THREE.InstancedMesh(trunkGeo, new THREE.MeshLambertMaterial({ color: 0x6b4a2f }), TREE_COUNT);
  const leafMesh  = new THREE.InstancedMesh(leafGeo,  new THREE.MeshLambertMaterial({ color: 0xffffff }), TREE_COUNT);
  leafMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(TREE_COUNT * 3), 3);

  let placed = 0, guard = 0;
  while (placed < TREE_COUNT && guard < 20000) {
    guard++;
    const k = Math.floor(Math.random() * SAMP);
    const side = Math.random() < 0.5 ? -1 : 1;
    const lat = side * (15 + Math.random() * 48);
    const p = TP[k], r = TR[k];
    const x = p.x + r.x * lat, z = p.z + r.z * lat;
    if (nearTrack(x, z, 13)) continue;
    const y = p.y + groundOff(lat, x, z);
    const s = 0.7 + Math.random() * 0.8;

    dummy.position.set(x, y, z);
    dummy.rotation.set(0, Math.random() * Math.PI * 2, 0);
    dummy.scale.set(s, s * (0.85 + Math.random() * 0.5), s);
    dummy.updateMatrix();
    trunkMesh.setMatrixAt(placed, dummy.matrix);
    leafMesh.setMatrixAt(placed, dummy.matrix);
    tmpCol.setHSL(0.28 + (Math.random() - 0.5) * 0.05, 0.45 + Math.random() * 0.2, 0.24 + Math.random() * 0.12);
    leafMesh.setColorAt(placed, tmpCol);
    placed++;
  }
  trunkMesh.count = placed; leafMesh.count = placed;
  trunkMesh.instanceMatrix.needsUpdate = true;
  leafMesh.instanceMatrix.needsUpdate = true;
  if (leafMesh.instanceColor) leafMesh.instanceColor.needsUpdate = true;
  scene.add(trunkMesh, leafMesh);
}

// rocks / bushes
{
  const COUNT = 130;
  const geo = new THREE.IcosahedronGeometry(1, 0);
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: 0xffffff }), COUNT);
  mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(COUNT * 3), 3);
  let placed = 0, guard = 0;
  while (placed < COUNT && guard < 12000) {
    guard++;
    const k = Math.floor(Math.random() * SAMP);
    const side = Math.random() < 0.5 ? -1 : 1;
    const lat = side * (10 + Math.random() * 55);
    const p = TP[k], r = TR[k];
    const x = p.x + r.x * lat, z = p.z + r.z * lat;
    if (nearTrack(x, z, 10)) continue;
    const y = p.y + groundOff(lat, x, z);
    const s = 0.6 + Math.random() * 1.6;
    dummy.position.set(x, y + s * 0.35, z);
    dummy.rotation.set(Math.random(), Math.random() * 6.28, Math.random());
    dummy.scale.set(s, s * 0.75, s);
    dummy.updateMatrix();
    mesh.setMatrixAt(placed, dummy.matrix);
    if (Math.random() < 0.5) tmpCol.setHSL(0.28, 0.42, 0.22 + Math.random() * 0.1);
    else tmpCol.setHSL(0.1, 0.05, 0.38 + Math.random() * 0.2);
    mesh.setColorAt(placed, tmpCol);
    placed++;
  }
  mesh.count = placed;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);
}

// start / finish line + gantry
{
  const cvs = document.createElement('canvas');
  cvs.width = 64; cvs.height = 16;
  const ctx = cvs.getContext('2d');
  for (let y = 0; y < 2; y++) for (let x = 0; x < 8; x++) {
    ctx.fillStyle = ((x + y) % 2 === 0) ? '#f4f4f4' : '#1c1c1c';
    ctx.fillRect(x * 8, y * 8, 8, 8);
  }
  const tex = new THREE.CanvasTexture(cvs);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(HW * 2, 3),
    new THREE.MeshLambertMaterial({ map: tex })
  );
  const m4 = new THREE.Matrix4();
  m4.makeBasis(TR[0], TT[0], new THREE.Vector3(0, 1, 0));
  line.quaternion.setFromRotationMatrix(m4);
  line.position.copy(TP[0]).add(new THREE.Vector3(0, 0.03, 0));
  scene.add(line);

  // gantry
  const poleMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
  const bannerMat = new THREE.MeshLambertMaterial({ color: 0xcc2222 });
  for (const s of [-1, 1]) {
    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.7, 9, 0.7), poleMat);
    const base = TP[3].clone().addScaledVector(TR[3], (HW + 2) * s);
    pole.position.set(base.x, base.y + 4.5, base.z);
    scene.add(pole);
  }
  const banner = new THREE.Mesh(new THREE.BoxGeometry(HW * 2 + 5, 1.9, 0.5), bannerMat);
  const bp = TP[3].clone();
  const m4b = new THREE.Matrix4();
  m4b.makeBasis(TR[3].clone().negate(), new THREE.Vector3(0, 1, 0), TT[3]);
  banner.quaternion.setFromRotationMatrix(m4b);
  banner.position.set(bp.x, bp.y + 8.4, bp.z);
  scene.add(banner);
}

/* =========================================================================
   PARTICLES
   ========================================================================= */
const particleTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

class Particles {
  constructor(max) {
    this.max = max;
    this.pos = new Float32Array(max * 3);
    this.col = new Float32Array(max * 3);
    this.siz = new Float32Array(max);
    this.alp = new Float32Array(max);
    this.vel = new Float32Array(max * 3);
    this.life = new Float32Array(max);
    this.maxLife = new Float32Array(max);
    this.cursor = 0;
    for (let i = 0; i < max; i++) this.pos[i * 3 + 1] = -9999;

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute('aColor', new THREE.BufferAttribute(this.col, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(this.siz, 1));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(this.alp, 1));

    const mat = new THREE.ShaderMaterial({
      uniforms: { uTex: { value: particleTex } },
      vertexShader: `
        attribute vec3 aColor;
        attribute float aSize;
        attribute float aAlpha;
        varying vec3 vColor;
        varying float vAlpha;
        void main(){
          vColor = aColor; vAlpha = aAlpha;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * 480.0 / max(1.0, -mv.z);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec3 vColor;
        varying float vAlpha;
        void main(){
          float a = texture2D(uTex, gl_PointCoord).a * vAlpha;
          if (a < 0.012) discard;
          gl_FragColor = vec4(vColor, a);
        }`,
      transparent: true,
      depthWrite: false
    });

    this.points = new THREE.Points(geo, mat);
    this.points.frustumCulled = false;
    scene.add(this.points);
    this.geo = geo;
  }
  spawn(x, y, z, vx, vy, vz, size, life, r, g, b) {
    const i = this.cursor;
    this.cursor = (this.cursor + 1) % this.max;
    this.pos[i * 3] = x; this.pos[i * 3 + 1] = y; this.pos[i * 3 + 2] = z;
    this.vel[i * 3] = vx; this.vel[i * 3 + 1] = vy; this.vel[i * 3 + 2] = vz;
    this.life[i] = life; this.maxLife[i] = life;
    this.siz[i] = size; this.alp[i] = 1;
    this.col[i * 3] = r; this.col[i * 3 + 1] = g; this.col[i * 3 + 2] = b;
  }
  update(dt) {
    for (let i = 0; i < this.max; i++) {
      if (this.life[i] > 0) {
        this.life[i] -= dt;
        const k = Math.max(0, this.life[i] / this.maxLife[i]);
        this.alp[i] = k * k * 0.9;
        this.siz[i] += dt * 3.2;
        this.pos[i * 3]     += this.vel[i * 3] * dt;
        this.pos[i * 3 + 1] += this.vel[i * 3 + 1] * dt;
        this.pos[i * 3 + 2] += this.vel[i * 3 + 2] * dt;
        this.vel[i * 3 + 1] += 2.4 * dt;
        this.vel[i * 3] *= 0.985;
        this.vel[i * 3 + 2] *= 0.985;
        if (this.life[i] <= 0) { this.alp[i] = 0; this.pos[i * 3 + 1] = -9999; }
      }
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.aColor.needsUpdate = true;
    this.geo.attributes.aSize.needsUpdate = true;
    this.geo.attributes.aAlpha.needsUpdate = true;
  }
}
const particles = new Particles(900);

/* =========================================================================
   RACING LINE / SPEED PROFILE
   ========================================================================= */
const curvArr = new Float32Array(SAMP);
for (let i = 0; i < SAMP; i++) {
  const a = TT[i], b = TT[(i + 1) % SAMP];
  const cross = a.x * b.z - a.z * b.x;
  const dot = a.x * b.x + a.z * b.z;
  curvArr[i] = Math.atan2(cross, dot) / SPACING;
}
for (let pass = 0; pass < 7; pass++) {
  const t = curvArr.slice();
  for (let i = 0; i < SAMP; i++) {
    curvArr[i] = (t[(i - 1 + SAMP) % SAMP] + t[i] * 2 + t[(i + 1) % SAMP]) / 4;
  }
}

const racingOffset = new Float32Array(SAMP);
for (let i = 0; i < SAMP; i++) {
  racingOffset[i] = THREE.MathUtils.clamp(curvArr[i] * 22, -1, 1) * (HW * 0.52);
}
for (let pass = 0; pass < 22; pass++) {
  const t = racingOffset.slice();
  for (let i = 0; i < SAMP; i++) {
    racingOffset[i] = (t[(i - 1 + SAMP) % SAMP] + t[i] * 2 + t[(i + 1) % SAMP]) / 4;
  }
}

function yawRateAt(v) {
  return 2.15 * Math.min(1, v / 6) * (1 - 0.34 * Math.min(1, v / 44));
}
const speedLimit = new Float32Array(SAMP);
for (let i = 0; i < SAMP; i++) {
  const c = Math.abs(curvArr[i]);
  let v = 44;
  if (c > 1e-4) {
    let lo = 0, hi = 44;
    for (let it = 0; it < 22; it++) {
      const mid = (lo + hi) / 2;
      if (mid <= yawRateAt(mid) / c) lo = mid; else hi = mid;
    }
    v = lo;
  }
  speedLimit[i] = Math.min(44, v * 0.90);
}
for (let pass = 0; pass < 4; pass++) {
  for (let i = SAMP - 1; i >= 0; i--) {
    const j = (i + 1) % SAMP;
    const allow = Math.sqrt(speedLimit[j] * speedLimit[j] + 2 * 24 * SPACING);
    if (speedLimit[i] > allow) speedLimit[i] = allow;
  }
}

function makeKart(colorHex) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color: colorHex });

  const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.34, 3.0), bodyMat);
  chassis.position.y = 0.5; g.add(chassis);

  const nose = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.3, 1.1), bodyMat);
  nose.position.set(0, 0.45, 1.85); g.add(nose);

  for (const s of [-1, 1]) {
    const pod = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.32, 1.5), bodyMat);
    pod.position.set(s * 0.95, 0.5, 0.05); g.add(pod);
  }

  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.72, 0.3), darkMat);
  seat.position.set(0, 0.96, -0.72); g.add(seat);

  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.62, 10),
    new THREE.MeshLambertMaterial({ color: 0x2b3f6b }));
  torso.position.set(0, 1.06, -0.42); g.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 10),
    new THREE.MeshLambertMaterial({ color: 0xf1c9a0 }));
  head.position.set(0, 1.56, -0.36); g.add(head);

  const helmet = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 12, 10, 0, Math.PI * 2, 0, Math.PI * 0.62), bodyMat);
  helmet.position.set(0, 1.58, -0.36); g.add(helmet);

  const wheels = [], steerGroups = [];
  for (const [sx, sz, front] of [[-1, 1.15, true], [1, 1.15, true], [-1, -1.15, false], [1, -1.15, false]]) {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    if (front) {
      const sg = new THREE.Group();
      sg.position.set(sx * 0.95, 0.42, sz);
      sg.add(w); g.add(sg);
      steerGroups.push(sg); wheels.push(w);
    } else {
      w.position.set(sx * 0.95, 0.42, sz);
      g.add(w); wheels.push(w);
    }
  }

  // fake shadow
  const sh = new THREE.Mesh(
    new THREE.CircleGeometry(1.7, 18),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false })
  );
  sh.rotation.x = -Math.PI / 2;
  sh.position.y = 0.02;
  sh.scale.set(1, 1.5, 1);
  g.add(sh);

  return { group: g, wheels, steerGroups };
}

function playerInput() {
  const L = (keys['ArrowLeft'] || keys['KeyA']) ? 1 : 0;
  const R = (keys['ArrowRight'] || keys['KeyD']) ? 1 : 0;
  const U = (keys['ArrowUp'] || keys['KeyW']) ? 1 : 0;
  const D = (keys['ArrowDown'] || keys['KeyS']) ? 1 : 0;
  return {
    steer: L - R,
    throttle: U - D,
    drift: !!(keys['Space'] || keys['ShiftLeft'] || keys['ShiftRight'])
  };
}

function respawnPlayer() {
  const k = playerKart;
  const i = k.trackIdx;
  k.pos.copy(TP[i]).addScaledVector(TR[i], 0);
  k.pos.y = TP[i].y;
  k.yaw = Math.atan2(TT[i].x, TT[i].z);
  k.vel.set(0, 0, 0);
  k.laneOffset = 0;
}

/* =========================================================================
   PHYSICS
   ========================================================================= */
function updateBasis(k) {
  const s = Math.sin(k.yaw), c = Math.cos(k.yaw);
  k.fwd.set(s, 0, c);
  k.rgt.set(-c, 0, s);
}

function stepKart(k, input, dt) {
  const speed = k.vel.length();

  // --- steering ---
  const sf = Math.min(1, speed / 6);
  const yawRate = 2.15 * sf * (1 - 0.34 * Math.min(1, speed / k.maxSpeed)) * (input.drift ? 1.45 : 1.0);
  k.yaw += input.steer * yawRate * dt;

  updateBasis(k);

  let vF = k.vel.dot(k.fwd);
  let vR = k.vel.dot(k.rgt);

  // --- engine / brake ---
  if (input.throttle > 0) vF += 40 * input.throttle * dt;
  else if (input.throttle < 0) vF += 62 * input.throttle * dt;

  // --- drag ---
  vF -= 0.0105 * vF * Math.abs(vF) * dt;
  vF -= 0.5 * vF * dt;

  // --- lateral grip ---
  const grip = input.drift ? 2.0 : 6.0;
  vR *= Math.exp(-grip * dt);

  // --- surface ---
  const maxV = k.maxSpeed * (k.offroad ? 0.55 : 1);
  if (vF > maxV) vF -= (vF - maxV) * Math.min(1, dt * 4);
  if (vF < -14) vF = -14;
  if (k.offroad) vF -= vF * 0.9 * dt;

  k.vR = vR;
  k.vel.copy(k.fwd).multiplyScalar(vF).addScaledVector(k.rgt, vR);
  k.pos.addScaledVector(k.vel, dt);
}

function findTrackIndex(pos, prev) {
  let best = prev, bestD = Infinity;
  for (let k = -28; k <= 28; k++) {
    const i = (prev + k + SAMP * 2) % SAMP;
    const p = TP[i];
    const dx = p.x - pos.x, dz = p.z - pos.z;
    const d = dx * dx + dz * dz;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

function lateralOf(k) {
  const i = k.trackIdx;
  return (k.pos.x - TP[i].x) * TR[i].x + (k.pos.z - TP[i].z) * TR[i].z;
}

/* =========================================================================
   AI
   ========================================================================= */
function aiInput(k) {
  const speed = k.vel.length();

  const lookDist = 10 + speed * 0.42;
  const steps = Math.max(3, Math.round(lookDist / SPACING));
  const ti = (k.trackIdx + steps) % SAMP;

  const lat = racingOffset[ti] + k.laneOffset;
  const tx = TP[ti].x + TR[ti].x * lat;
  const tz = TP[ti].z + TR[ti].z * lat;

  const desiredYaw = Math.atan2(tx - k.pos.x, tz - k.pos.z);
  let diff = desiredYaw - k.yaw;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;

  const steer = THREE.MathUtils.clamp(diff * 2.0, -1, 1);

  const aheadSteps = Math.max(3, Math.round((5 + speed * 0.35) / SPACING));
  const targetSpeed = speedLimit[(k.trackIdx + aheadSteps) % SAMP] * (k.isPlayer && demoMode ? 1.03 : k.speedMul);

  let throttle;
  if (speed < targetSpeed - 0.6) throttle = 1;
  else if (speed > targetSpeed + 2.5) throttle = -1;
  else throttle = 0.35;

  const drift = Math.abs(diff) > 0.48 && speed > 22;

  return { throttle, steer, drift };
}

function updateLane(k, dt) {
  let desired = 0;
  const fwd = k.fwd, rgt = k.rgt;
  for (const o of karts) {
    if (o === k) continue;
    const dx = o.pos.x - k.pos.x, dz = o.pos.z - k.pos.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 18 && dist > 0.01) {
      const ahead = dx * fwd.x + dz * fwd.z;
      if (ahead > 0) {
        const lat = dx * rgt.x + dz * rgt.z;
        if (Math.abs(lat) < 3.2) {
          desired = (lat >= 0 ? -1 : 1) * 3.6;
        }
      }
    }
  }
  desired = THREE.MathUtils.clamp(desired, -4.2, 4.2);
  k.laneOffset += (desired - k.laneOffset) * Math.min(1, dt * 2.6);
}

const tracksideCams = [];

  const side = (idx % 2 === 0) ? 1 : -1;
  tracksideCams.push({
    idx,
    pos: new THREE.Vector3(

function getLeader() {
  let best = karts[0];
  for (const k of karts) if (k.prog > best.prog) best = k;
  return best;
}

function updateCamera(dt) {
  const followed = (camMode === 'leader') ? getLeader() : playerKart;

  if (!tracksideMode) {
    cutTimer -= dt;
    if (cutTimer <= 0) {
      tracksideMode = true;
      tracksideTimer = 3.4;
      const leader = getLeader();
      let best = null, bestScore = Infinity;
      for (const c of tracksideCams) {
        let d = (c.idx - leader.trackIdx + SAMP * 2) % SAMP;
        const score = Math.abs(d - 75);
        if (score < bestScore) { bestScore = score; best = c; }
      }
      if (best) tracksidePos.copy(best.pos);
      cutTimer = 9 + Math.random() * 6;
    }
  } else {
    tracksideTimer -= dt;
    if (tracksideTimer <= 0) tracksideMode = false;
  }

  const speed = followed.vel.length();
  const targetFov = THREE.MathUtils.clamp(70 + speed * 0.28, 70, 86);

  if (tracksideMode) {
    camera.position.copy(tracksidePos);
    camLook.lerp(followed.pos, 1);
    camera.lookAt(followed.pos.x, followed.pos.y + 1.4, followed.pos.z);
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 3);
  } else {
    const back = _v1.copy(followed.fwd).multiplyScalar(-1);
    const desired = _v2.copy(followed.pos)
      .addScaledVector(back, 8.6)
      .add(new THREE.Vector3(0, 3.7, 0));

    if (!camInit) { camPos.copy(desired); camInit = true; }
    camPos.lerp(desired, 1 - Math.exp(-dt * 7));

    const lookTarget = _v3.copy(followed.pos)
      .addScaledVector(followed.fwd, 7)
      .add(new THREE.Vector3(0, 1.7, 0));
    camLook.lerp(lookTarget, 1 - Math.exp(-dt * 10));

    camera.position.copy(camPos);
    camera.lookAt(camLook);
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 3);
  }
  camera.updateProjectionMatrix();
}

  const order = karts.slice().sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished) return -1;
    if (b.finished) return 1;
    return b.prog - a.prog;
  });
  order.forEach((k, i) => { k.position = i + 1; });

  const sig = order.map(k => k.idx + ':' + k.lap).join('|');
  if (sig !== lastOrderSig) {
    lastOrderSig = sig;
    let html = '';

      const p = i + 1;

              `<span class="dot" style="background:${col}"></span>` +
              `<span class="nm">${k.name}</span>` +
              `<span class="lap">${lapDisp}</span></div>`;
    });
    posRowsEl.innerHTML = html;
  }

  const p = playerKart;
  const lapDisp = Math.max(1, Math.min(TOTAL_LAPS, p.lap));
  lapTxt.textContent = p.finished ? 'DONE' : lapDisp + '/' + TOTAL_LAPS;
  spdTxt.textContent = Math.round(p.vel.length() * 3.6) + ' km/h';
  const t = p.finished ? p.finishTime : raceTime;
  const mm = Math.floor(t / 60);

  timeTxt.textContent = (p.bestLap > 0 ? 'BEST ' + p.bestLap.toFixed(2) + 's  ·  ' : '') + mm + ':' + ss;
  posTxt.textContent = p.position + suffix(p.position) + ' place';
}

function updateCountdownUI() {
  let txt = '', cls = '';
  if (raceState === 'countdown') {
    if (countdownT > 4) txt = 'READY';
    else if (countdownT > 3) txt = '3';
    else if (countdownT > 2) txt = '2';
    else if (countdownT > 1) txt = '1';
    else { txt = 'GO!'; cls = 'go'; }
  } else if (raceTime < 0.9) {
    txt = 'GO!'; cls = 'go';
  }
  bigMsg.textContent = txt;
  bigMsg.className = cls;
  bigMsg.style.opacity = txt ? '1' : '0';

/* =========================================================================
   MAIN UPDATE
   ========================================================================= */
const _qYaw = new THREE.Quaternion();
const _qPitch = new THREE.Quaternion();
const _qRoll = new THREE.Quaternion();
const _axisY = new THREE.Vector3(0, 1, 0);
const _axisX = new THREE.Vector3(1, 0, 0);
const _axisZ = new THREE.Vector3(0, 0, 1);

function update(dt) {
  // ---- countdown ----
  if (raceState === 'countdown') {
    countdownT -= dt;
    if (countdownT <= 0) { raceState = 'racing'; raceTime = 0; }
  } else {
    raceTime += dt;
  }
  updateCountdownUI();

  const frozen = raceState === 'countdown';

  // ---- inputs & physics ----
  for (const k of karts) {
    let input;
    if (frozen) input = { throttle: 0, steer: 0, drift: false };
    else if (k.isPlayer && !demoMode) input = playerInput();
    else input = aiInput(k);

    if (!frozen) updateLane(k, dt);

    if (frozen) {
      k.vel.set(0, 0, 0);
      updateBasis(k);
    } else {
      stepKart(k, input, dt);
    }

    // track index / lap logic
    const newIdx = findTrackIndex(k.pos, k.trackIdx);
    if (newIdx < k.trackIdx - SAMP / 2) {
      k.lap++;
      if (k.lap > 0 && k.lapStart > 0) {
        const lt = raceTime - k.lapStart;
        if (lt > 1 && (k.bestLap === 0 || lt < k.bestLap)) k.bestLap = lt;
      }
      k.lapStart = raceTime;
      if (!k.finished && k.lap > TOTAL_LAPS) {
        k.finished = true;
        k.finishTime = raceTime;
      }
    } else if (newIdx > k.trackIdx + SAMP / 2) {
      k.lap--;
    }
    k.trackIdx = newIdx;

    // lateral / offroad
    const lat = lateralOf(k);
    k.offroad = Math.abs(lat) > HW + 0.9;

    // safety net — keep everyone near the circuit
    if (Math.abs(lat) > 18) {
      const corr = Math.abs(lat) - 18;
      k.pos.addScaledVector(TR[k.trackIdx], -Math.sign(lat) * corr);
    }

    // ground height
    const targetY = TP[k.trackIdx].y + (k.offroad ? -0.18 : 0);
    k.pos.y += (targetY - k.pos.y) * Math.min(1, dt * 18);

    // progress
    const seg = (k.trackIdx + 1) % SAMP;
    const ax = TP[k.trackIdx].x, az = TP[k.trackIdx].z;
    const bx = TP[seg].x - ax, bz = TP[seg].z - az;
    const len2 = bx * bx + bz * bz || 1;
    const t = THREE.MathUtils.clamp(((k.pos.x - ax) * bx + (k.pos.z - az) * bz) / len2, 0, 1);
    k.prog = k.lap * trackLen + TCUM[k.trackIdx] + t * SPACING;

    // drifting flag for particles
    k.drifting = Math.abs(k.vR) > 3.2 && k.vel.length() > 12;
  }

  // ---- kart-kart collisions ----
  for (let i = 0; i < karts.length; i++) {
    for (let j = i + 1; j < karts.length; j++) {
      const a = karts[i], b = karts[j];
      const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z;
      const dist = Math.hypot(dx, dz);
      const minD = 2.6;
      if (dist < minD && dist > 0.0001) {
        const nx = dx / dist, nz = dz / dist;
        const push = (minD - dist) * 0.5;
        a.pos.x -= nx * push; a.pos.z -= nz * push;
        b.pos.x += nx * push; b.pos.z += nz * push;
        const rel = (b.vel.x - a.vel.x) * nx + (b.vel.z - a.vel.z) * nz;
        if (rel < 0) {
          a.vel.x += nx * rel * 0.5; a.vel.z += nz * rel * 0.5;
          b.vel.x -= nx * rel * 0.5; b.vel.z -= nz * rel * 0.5;
        }
      }
    }
  }

  // ---- visuals ----
  let steerVis = 0;
  for (const k of karts) {
    // orientation
    const slope = Math.asin(THREE.MathUtils.clamp(TT[k.trackIdx].y, -0.95, 0.95));
    const roll = THREE.MathUtils.clamp(-k.vR * 0.012, -0.26, 0.26);

    _qYaw.setFromAxisAngle(_axisY, k.yaw);
    _qPitch.setFromAxisAngle(_axisX, -slope);
    _qRoll.setFromAxisAngle(_axisZ, roll);
    k.group.quaternion.copy(_qYaw).multiply(_qPitch).multiply(_qRoll);
    k.group.position.copy(k.pos);

    // wheels
    const vF = k.vel.dot(k.fwd);
    k.wheelSpin += (vF / 0.42) * dt;
    for (const w of k.wheels) w.rotation.x = k.wheelSpin;

    // steering visual
    if (k.isPlayer && !demoMode) {
      steerVis = playerInput().steer * 0.45;
    } else {
      const ai = aiInput(k);
      steerVis = ai.steer * 0.45;
    }
    for (const sg of k.steerGroups) sg.rotation.y += (steerVis - sg.rotation.y) * Math.min(1, dt * 14);

    // particles
    if (!frozen && (k.drifting || (k.offroad && k.vel.length() > 5))) {
      const n = k.drifting ? 2 : 1;
      for (let p = 0; p < n; p++) {
        const side = (Math.random() - 0.5) * 1.9;
        const bx = k.pos.x - k.fwd.x * 1.3 + k.rgt.x * side;
        const bz = k.pos.z - k.fwd.z * 1.3 + k.rgt.z * side;
        const by = k.pos.y + 0.25;
        if (k.offroad) {
          particles.spawn(bx, by, bz,
            (Math.random() - 0.5) * 3 - k.vel.x * 0.12, 1.6 + Math.random() * 1.5,
            (Math.random() - 0.5) * 3 - k.vel.z * 0.12,
            0.75 + Math.random() * 0.5, 0.7 + Math.random() * 0.4,
            0.84, 0.74, 0.53);
        } else {
          particles.spawn(bx, by, bz,
            (Math.random() - 0.5) * 2.4 - k.vel.x * 0.1, 1.1 + Math.random() * 1.2,
            (Math.random() - 0.5) * 2.4 - k.vel.z * 0.1,
            0.55 + Math.random() * 0.4, 0.5 + Math.random() * 0.35,
            0.80, 0.80, 0.84);
        }
      }
    }
  }

  particles.update(dt);
  updateCamera(dt);
  updateHUD();

  // finish banner
  if (playerKart.finished && !bannerEl.classList.contains('on')) {
    bannerEl.classList.add('on');
    bannerEl.innerHTML = 'RACE COMPLETE<small>' + playerKart.position + suffix(playerKart.position) +
      ' PLACE · ' + playerKart.finishTime.toFixed(2) + 's</small>';
  }
}

/* =========================================================================
   LOOP
   ========================================================================= */
setDemo(true);
let lastTime = performance.now();

renderer.setAnimationLoop(() => {
  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.06) dt = 0.06;
  update(dt);
  renderer.render(scene, camera);
});
</script>

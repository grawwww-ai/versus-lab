<!DOCTYPE html>
<html lang="en">
<head><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<meta charset="UTF-8">
<title>Snake</</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0e14;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    overflow: hidden;
  }
  #wrap {
    text-align: center;
  }
  canvas {
    background: #10151d;
    border: 2px solid #2a3648;
    border-radius: 6px;
    display: block;
    box-shadow: 0 0 40px rgba(0, 255, 140, 0.08);
  }
  #hint {
    color: #5a6a80;
    font-size: 12px;
    margin-top: 10px;
    letter-spacing: 1px;
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="520"></canvas>
  <div id="hint">ARROWS: MOVE &nbsp;|&nbsp; SPACE: RESTART &nbsp;|&nbsp; P: TOGGLE AUTOPLAY DEMO</div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");

  var COLS = 24, ROWS = 24, CELL = 20;
  var HUD_H = 40;
  var STEP = 80;                 // ms per game tick (12.5 moves/sec)
  var MAX_STEP = 45;            // fastest tick

  var snake, dir, pendingDirs, food, score, alive, gameSpeed;
  var demo = false;
  var deadAt = 0;               // timestamp of death (for demo auto-restart)

  function reset() {
    var cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = { x: 1, y: 0 };
    pendingDirs = [];
    score = 0;
    alive = true;
    gameSpeed = STEP;
    spawnFood();
    deadAt = 0;
  }

  function spawnFood() {
    var free = [], x, y;
    for (y = 0; y < ROWS; y++)
      for (x = 0; x < COLS; x++) {
        var occupied = false;
        for (var i = 0; i < snake.length; i++)
          if (snake[i].x === x && snake[i].y === y) { occupied = true; break; }
        if (!occupied) free.push({ x: x, y: y });
      }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function inBounds(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }

  // ---- input ----
  var keyDirs = {
    ArrowUp:    { x: 0, y: -1 },
    ArrowDown:  { x: 0, y: 1 },
    ArrowLeft:  { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }
  };

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space") {
      e.preventDefault();
      if (!alive) reset();
      return;
    }
    if (e.code === "KeyP") {
      e.preventDefault();
      demo = !demo;
      if (!alive) reset();
      return;
    }
    var d = keyDirs[e.key];
    if (!d) return;
    e.preventDefault();
    if (!alive || demo) return;
    var last = pendingDirs.length ? pendingDirs[pendingDirs.length - 1] : dir;
    // reject 180° turns and duplicates; buffer up to 3 queued turns
    if ((d.x === last.x && d.y === last.y) || (d.x === -last.x && d.y === -last.y)) return;
    if (pendingDirs.length < 3) pendingDirs.push(d);
  });

  // ---- simulation ----
  function update() {
    if (!alive) {
      if (demo && performance.now() - deadAt > 1500) reset(); // demo: keep going
      return;
    }

    if (demo) {
      var a = aiChooseDir();
      if (a) dir = a;
    } else if (pendingDirs.length) {
      dir = pendingDirs.shift();
    }

    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;

    // wall collision
    if (!inBounds(nx, ny)) { die(); return; }

    var willEat = food && nx === food.x && ny === food.y;
    var checkLen = willEat ? snake.length : snake.length - 1; // tail vacates unless growing

    for (var i = 0; i < checkLen; i++) {
      if (snake[i].x === nx && snake[i].y === ny) { die(); return; }
    }

    snake.unshift({ x: nx, y: ny });

    if (willEat) {
      score++;
      if (gameSpeed > MAX_STEP) gameSpeed = Math.max(MAX_STEP, STEP - score * 1.2);
      if (!spawnFood()) die(); // board full — impossible in practice
    } else {
      snake.pop();
    }
  }

  function die() {
    alive = false;
    deadAt = performance.now();
  }

  // ---- AI (autoplay demo) ----
  function makeGrid(excludeTail) {
    var g = new Array(COLS * ROWS);
    for (var i = 0; i < COLS * ROWS; i++) g[i] = false;
    var len = snake.length - (excludeTail ? 1 : 0);
    for (var j = 0; j < len; j++) g[snake[j].y * COLS + snake[j].x] = true;
    return g;
  }

  // BFS distance from a cell to the food; -1 if unreachable.
  function distToFood(sx, sy, blocked) {
    if (sx === food.x && sy === food.y) return 0;
    var q = [[sx, sy]], seen = new Array(COLS * ROWS), i;
    for (i = 0; i < COLS * ROWS; i++) seen[i] = false;
    seen[sy * COLS + sx] = true;
    var headIdx = 0;
    var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    while (headIdx < q.length) {
      var c = q[headIdx++];
      for (var k = 0; k < 4; k++) {
        var x = c[0] + dirs[k][0], y = c[1] + dirs[k][1];
        if (!inBounds(x, y) || blocked[y * COLS + x] || seen[y * COLS + x]) continue;
        if (x === food.x && y === food.y) {
          // reconstruct length
          var d = 1;
          var stack = [[x, y]];
          var prev = new Array(COLS * ROWS), p;
          for (p = 0; p < COLS * ROWS; p++) prev[p] = -1;
          prev[sy * COLS + sx] = -2;
          var qq = [[sx, sy]], hi = 0;
          var s = new Array(COLS * ROWS);
          for (p = 0; p < COLS * ROWS; p++) s[p] = false;
          s[sy * COLS + sx] = true;
          while (hi < qq.length) {
            var cc = qq[hi++];
            for (var m = 0; m < 4; m++) {
              var xx = cc[0] + dirs[m][0], yy = cc[1] + dirs[m][1];
              if (!inBounds(xx, yy) || blocked[yy * COLS + xx] || s[yy * COLS + xx]) continue;
              s[yy * COLS + xx] = true;
              prev[yy * COLS + xx] = cc[1] * COLS + cc[0];
              if (xx === x && yy === y) return pathLen(prev, x, y);
              qq.push([xx, yy]);
            }
          }
          return 1;
        }
        seen[y * COLS + x] = true;
        q.push([x, y]);
      }
    }
    return -1;
  }

  function pathLen(prev, tx, ty) {
    var n = 1, c = prev[ty * COLS + tx];
    while (c >= 0) { n++; c = prev[c]; }
    return n;
  }

  // BFS from a cell to a target cell (used for tail-reachability safety check).
  function reachable(sx, sy, tx, ty, blocked) {
    if (sx === tx && sy === ty) return true;
    var q = [[sx, sy]], seen = new Array(COLS * ROWS);
    for (var i = 0; i < COLS * ROWS; i++) seen[i] = false;
    seen[sy * COLS + sx] = true;
    var hi = 0, dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    while (hi < q.length) {
      var c = q[hi++];
      for (var k = 0; k < 4; k++) {
        var x = c[0] + dirs[k][0], y = c[1] + dirs[k][1];
        if (!inBounds(x, y) || seen[y * COLS + x]) continue;
        if (blocked[y * COLS + x] && !(x === tx && y === ty)) continue;
        if (x === tx && y === ty) return true;
        seen[y * COLS + x] = true;
        q.push([x, y]);
      }
    }
    return false;
  }

  // Count free space reachable from a cell (flood fill).
  function area(sx, sy, blocked) {
    var q = [[sx, sy]], seen = new Array(COLS * ROWS), i, n = 0;
    for (i = 0; i < COLS * ROWS; i++) seen[i] = false;
    seen[sy * COLS + sx] = true;
    var hi = 0, dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    while (hi < q.length) {
      n++;
      var c = q[hi++];
      for (var k = 0; k < 4; k++) {
        var x = c[0] + dirs[k][0], y = c[1] + dirs[k][1];
        if (!inBounds(x, y) || seen[y * COLS + x] || blocked[y * COLS + x]) continue;
        seen[y * COLS + x] = true;
        q.push([x, y]);
      }
    }
    return n;
  }

  function aiChooseDir() {
    var head = snake[0];
    var cand = [];
    var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    var blocked = makeGrid(true); // tail cell will be vacated next tick

    for (var k = 0; k < 4; k++) {
      var d = dirs[k];
      if (d[0] === -dir.x && d[1] === -dir.y) continue; // no reverse
      var nx = head.x + d[0], ny = head.y + d[1];
      if (!inBounds(nx, ny) || blocked[ny * COLS + nx]) continue;
      cand.push({ nx: nx, ny: ny, d: { x: d[0], y: d[1] } });
    }
    if (!cand.length) return null;

    // 1) Prefer a shortest BFS path to food, with a tail-reachability safety check.
    var best = null, bestDist = Infinity;
    for (var i = 0; i < cand.length; i++) {
      var c = cand[i];
      var dist = distToFood(c.nx, c.ny, blocked);
      if (dist >= 0 && dist < bestDist) { bestDist = dist; best = c; }
    }

    if (best) {
      var safe = true;
      if (best.nx === food.x && best.ny === food.y) {
        // we would eat now: after the move, tail does NOT vacate; check the
        // extended body can still reach its own tail.
        var b2 = makeGrid(false); // all current body cells
        // tail of the new body is snake[last]
        var tail = snake[snake.length - 1];
        safe = reachable(best.nx, best.ny, tail.x, tail.y, b2);
      } else {
        safe = area(best.nx, best.ny, blocked) >= snake.length;
      }
      if (safe) return best.d;
    }

    // 2) Fallback: move to the safest (largest reachable area) cell,
    //    preferring to keep the tail reachable.
    var fb = null, fbScore = -1;
    for (var j = 0; j < cand.length; j++) {
      var c2 = cand[j];
      var a = area(c2.nx, c2.ny, blocked);
      var tail2 = snake[snake.length - 1];
      var sc = a + (reachable(c2.nx, c2.ny, tail2.x, tail2.y, blocked) ? 100000 : 0);
      if (sc > fbScore) { fbScore = sc; fb = c2; }
    }
    return fb.d;
  }

  // ---- rendering ----
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // HUD background
    ctx.fillStyle = "#0c1119";
    ctx.fillRect(0, 0, canvas.width, HUD_H);
    ctx.strokeStyle = "#2a3648";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, HUD_H - 0.5);
    ctx.lineTo(canvas.width, HUD_H - 0.5);
    ctx.stroke();

    // score at top center
    ctx.fillStyle = "#e8f0ff";
    ctx.font = "bold 20px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("SCORE: " + score, canvas.width / 2, HUD_H / 2);

    if (demo) {
      ctx.fillStyle = "#39d98a";
      ctx.font = "bold 13px monospace";
      ctx.fillText("● DEMO", canvas.width - 48, HUD_H / 2);
    }

    // board
    var ox = 0, oy = HUD_H;
    ctx.save();
    ctx.translate(ox, oy);

    // subtle grid
    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    ctx.lineWidth = 1;
    for (var gx = 1; gx < COLS; gx++) {
      ctx.beginPath();
      ctx.moveTo(gx * CELL + 0.5, 0);
      ctx.lineTo(gx * CELL + 0.5, ROWS * CELL);
      ctx.stroke();
    }
    for (var gy = 1; gy < ROWS; gy++) {
      ctx.beginPath();
      ctx.moveTo(0, gy * CELL + 0.5);
      ctx.lineTo(COLS * CELL, gy * CELL + 0.5);
      ctx.stroke();
    }

    // food
    if (food) {
      var fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
      ctx.fillStyle = "#ff5252";
      ctx.shadowColor = "rgba(255,82,82,0.7)";
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(fx, fy, CELL * 0.32, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // snake
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var t = snake.length > 1 ? i / (snake.length - 1) : 0; // 0 at head
      var r = 150 - Math.floor(t * 90);
      var g = 255 - Math.floor(t * 60);
      var b = 170 - Math.floor(t * 90);
      ctx.fillStyle = i === 0 ? "#7dffab" : "rgb(" + r + "," + g + "," + b + ")";
      var pad = i === 0 ? 1 : 1.5;
      roundRect(ctx, s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
    }

    // eyes on head
    if (snake.length) {
      var h = snake[0];
      var hx = h.x * CELL + CELL / 2, hy = h.y * CELL + CELL / 2;
      var ex = dir.y !== 0 ? 4.5 : 0, ey = dir.x !== 0 ? 4.5 : 0;
      var fx2 = dir.x * 4, fy2 = dir.y * 4;
      ctx.fillStyle = "#0a0e14";
      ctx.beginPath();
      ctx.arc(hx + fx2 + ex, hy + fy2 + ey, 2.2, 0, Math.PI * 2);
      ctx.arc(hx + fx2 - ex, hy + fy2 - ey, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // game over overlay
    if (!alive) {
      ctx.fillStyle = "rgba(8,10,14,0.72)";
      ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);
      ctx.fillStyle = "#ff5252";
      ctx.font = "bold 34px monospace";
      ctx.fillText("GAME OVER", COLS * CELL / 2, ROWS * CELL / 2 - 22);
      ctx.fillStyle = "#c8d4e8";
      ctx.font = "16px monospace";
      if (demo) {
        ctx.fillText("restart in…", COLS * CELL / 2, ROWS * CELL / 2 + 14);
      } else {
        ctx.fillText("PRESS SPACE TO RESTART", COLS * CELL / 2, ROWS * CELL / 2 + 14);
      }
    }

    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // ---- main loop: fixed timestep updates, smooth rAF render ----
  var last = performance.now(), acc = 0;
  function frame(t) {
    var dt = Math.min(t - last, 250);
    last = t;
    acc += dt;
    while (acc >= gameSpeed) {
      acc -= gameSpeed;
      update();
    }
    draw();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

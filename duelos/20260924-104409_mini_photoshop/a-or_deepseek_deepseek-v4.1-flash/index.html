<title>PixelForge — Mini Image Editor</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0d0f12;color:#c6cdd6;overflow:hidden;
    font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;
  }
  .app{display:flex;flex-direction:column;height:100vh;min-height:0}

  /* ---------- top bar ---------- */
  .topbar{
    height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;background:linear-gradient(#24282e,#1a1d22);border-bottom:1px solid #080a0c;
  }
  .brand{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:2.4px;color:#e9eef4}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#5b9dff,#a06bff)}
  .brand .sub{font-weight:400;letter-spacing:.2px;color:#59616d;font-size:11.5px;margin-left:4px}
  .badge{
    font-size:10.5px;letter-spacing:1.4px;color:#7ee787;background:#152218;
    border:1px solid #27412c;padding:3px 10px;border-radius:20px;display:flex;align-items:center;gap:6px;
  }
  .badge i{width:6px;height:6px;border-radius:50%;background:#7ee787;animation:blip 1.4s infinite}
  @keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- body ---------- */
  .body{flex:1;display:flex;min-height:0}

  /* ---------- toolbar ---------- */
  .toolbar{
    width:60px;flex:0 0 60px;background:#171a1e;border-right:1px solid #080a0c;
    display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:5px;overflow:hidden;
  }
  .tool{
    width:42px;height:42px;border-radius:9px;display:grid;place-items:center;color:#828b98;
    cursor:pointer;transition:background .13s,color .13s,box-shadow .13s;position:relative;
  }
  .tool:hover{background:#232830;color:#dde4ec}
  .tool.active{background:#26364f;color:#8dbcff;box-shadow:inset 0 0 0 1px #3d6bb0}
  .tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tsep{width:32px;height:1px;background:#2a2f36;margin:6px 0}
  .toolbar .label{font-size:9px;letter-spacing:1.2px;color:#4e5764;margin-top:2px}
  input[type=color]{
    -webkit-appearance:none;appearance:none;border:1px solid #333a43;width:38px;height:30px;
    border-radius:7px;background:#0f1215;padding:2px;cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:5px}
  input[type=color]::-moz-color-swatch{border:none;border-radius:5px}
  .swatches{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}
  .swatches button{
    width:17px;height:17px;border-radius:5px;border:1px solid rgba(255,255,255,.14);
    cursor:pointer;transition:transform .12s,box-shadow .12s;padding:0;
  }
  .swatches button:hover{transform:scale(1.14)}
  .swatches button.sel{box-shadow:0 0 0 2px #5b9dff}

  /* ---------- stage ---------- */
  .stage{
    flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
    padding:18px;background:
      radial-gradient(circle at 50% 40%,#1a1e24 0%,#0f1215 72%);
    position:relative;
  }
  .canvasWrap{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;
  }
  #view{
    max-width:100%;max-height:100%;display:block;border-radius:5px;
    box-shadow:0 18px 46px rgba(0,0,0,.66),0 0 0 1px #000;
    cursor:crosshair;background:#0a0d12;
  }

  /* ---------- right panel ---------- */
  .panel{
    width:272px;flex:0 0 272px;background:#171a1e;border-left:1px solid #080a0c;
    display:flex;flex-direction:column;min-height:0;
  }
  .sec{display:flex;flex-direction:column;min-height:0}
  .sec-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px 7px;font-size:10px;letter-spacing:1.6px;color:#69727f;font-weight:700;
  }
  .sec-head .mini{
    background:#232830;border:1px solid #2e343c;color:#939ca8;font-size:9.5px;letter-spacing:1px;
    padding:3px 8px;border-radius:5px;cursor:pointer;
  }
  .sec-head .mini:hover{background:#2b313a;color:#cfd7e0}

  .layer-list{overflow-y:auto;padding:0 8px 6px;flex:1;min-height:0}
  .layer-row{
    display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;margin-bottom:4px;transition:background .12s,border-color .12s;
  }
  .layer-row:hover{background:#1e232a}
  .layer-row.selected{background:#22303f;border-color:#3a6098}
  .layer-row .eye{
    width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;border:none;background:none;
    color:#4d5560;cursor:pointer;border-radius:5px;
  }
  .layer-row .eye:hover{background:#2a3038}
  .layer-row .eye.on{color:#7fb4ff}
  .layer-row .eye svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
  .layer-row .thumb{
    width:56px;height:34px;flex:0 0 56px;border-radius:4px;background:#0c0f13;
    border:1px solid #2b3138;display:block;
  }
  .layer-row .linfo{min-width:0;flex:1}
  .layer-row .lname{font-size:12px;color:#d3dae2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .layer-row .lmeta{font-size:10px;color:#6a7480;letter-spacing:.3px}
  .layer-row.hidden-layer .linfo{opacity:.42}

  .layer-controls{display:flex;gap:5px;padding:6px 10px 8px}
  .layer-controls button{
    flex:1;height:26px;border-radius:6px;background:#232830;border:1px solid #2e343c;color:#9aa3af;
    display:grid;place-items:center;cursor:pointer;transition:.12s;
  }
  .layer-controls button:hover{background:#2c333c;color:#dbe2ea}
  .layer-controls button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .props{padding:2px 12px 12px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid #22272d}
  .prow{display:flex;align-items:center;gap:8px}
  .prow label{width:52px;font-size:10px;letter-spacing:1px;color:#69727f;font-weight:600}
  .prow .val{width:38px;text-align:right;font-size:10.5px;color:#7b8592;font-variant-numeric:tabular-nums}
  select{
    flex:1;background:#1e232a;border:1px solid #2e343c;color:#c2cbd5;border-radius:6px;
    height:24px;font-size:11.5px;padding:0 5px;outline:none;cursor:pointer;
  }

  .filters{padding-bottom:12px}
  .frow{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:6px;transition:background .15s}
  .frow.flash{background:#212a37}
  .frow label{width:62px;font-size:10px;letter-spacing:1px;color:#69727f;font-weight:600}
  .frow .val{width:36px;text-align:right;font-size:10.5px;color:#7b8592;font-variant-numeric:tabular-nums}

  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:4px;background:#2b313a;border-radius:4px;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#89bbff;
    border:2px solid #15181c;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:#89bbff;border:2px solid #15181c;cursor:pointer;
  }

  /* ---------- status ---------- */
  .status{
    height:27px;flex:0 0 27px;background:#14171b;border-top:1px solid #080a0c;
    display:flex;align-items:center;gap:18px;padding:0 13px;font-size:11px;color:#5d6673;letter-spacing:.4px;
  }
  .status b{color:#c2cbd5;font-weight:600;margin-left:5px}
  .status .chip{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid #333a43;vertical-align:-1px;margin-left:6px}
  .status .grow{flex:1}
  .status .msg{color:#5f7d92;letter-spacing:1px;font-size:10px}

  /* ---------- demo cursor ---------- */
  #cursor{
    position:fixed;left:0;top:0;width:22px;height:22px;pointer-events:none;z-index:9999;
    transform:translate(-100px,-100px);opacity:1;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));
  }
  #cursor svg{display:block}
  #cursor .ripple{
    position:absolute;left:4px;top:4px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
    border:2px solid #6ba8ff;opacity:0;
  }
  #cursor.click .ripple{animation:rip .5s ease-out}
  @keyframes rip{0%{opacity:.95;transform:scale(.35)}100%{opacity:0;transform:scale(3.6)}}

  .flashEl{animation:fl .45s ease-out}
  @keyframes fl{0%{box-shadow:0 0 0 3px rgba(91,157,255,.9)}100%{box-shadow:0 0 0 0 rgba(91,157,255,0)}}
</style>

<script>
(function(){
"use strict";

/* =========================================================
   SETUP
   ========================================================= */
const W = 760, H = 470;
const view = document.getElementById('view');
const vctx = view.getContext('2d');

const cursorEl = document.getElementById('cursor');
const layerList = document.getElementById('layerList');
const stTool = document.getElementById('stTool');
const stLayer = document.getElementById('stLayer');
const stSize = document.getElementById('stSize');
const stColor = document.getElementById('stColor');
const stPos = document.getElementById('stPos');
const stMsg = document.getElementById('stMsg');

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp  = (a,b,t)=>a+(b-a)*t;
const easeInOut = p => p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
const centerOf = el => { const r = el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; };
const $ = id => document.getElementById(id);

/* =========================================================
   STATE
   ========================================================= */
let layers = [];
let activeLayer = 0;
let tool = 'brush';
let color = '#ffd166';
let brushSize = 10;
let textValue = '';
let textPos = {x:380, y:92};
let uid = 0;
let layerCounter = 0;

const TOOL_NAMES = {brush:'Brush', eraser:'Eraser', shape:'Shapes', text:'Text'};

/* preview canvas (shape rubber-band) */
const previewC = document.createElement('canvas');
previewC.width = W; previewC.height = H;
const pctx = previewC.getContext('2d');
let previewActive = false;

/* =========================================================
   LAYERS
   ========================================================= */
function makeCanvas(){ const c = document.createElement('canvas'); c.width=W; c.height=H; return c; }

function addLayer(name, opts){
  opts = opts || {};
  const c = makeCanvas();
  const L = {
    id: ++uid,
    name: name,
    canvas: c,
    ctx: c.getContext('2d'),
    visible: opts.visible !== false,
    opacity: opts.opacity === undefined ? 1 : opts.opacity,
    blend: opts.blend || 'source-over',
    blendLabel: opts.blendLabel || 'Normal'
  };
  layers.push(L);
  return L;
}

function getLayer(name){ return layers.find(l => l.name === name); }

function setActiveLayerByName(name){
  const i = layers.findIndex(l => l.name === name);
  if(i >= 0 && i !== activeLayer){ activeLayer = i; renderLayers(); updateStatus(); }
}

/* =========================================================
   PROCEDURAL LANDSCAPE
   ========================================================= */
function ridge(ctx, rng, baseY, h, col, n){
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  ctx.lineTo(0, baseY - h*(0.3 + rng()*0.7));
  for(let i=1;i<=n;i++){
    ctx.lineTo((i/n)*W, baseY - h*(0.22 + rng()*0.9));
  }
  ctx.lineTo(W, baseY);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
}

function pine(ctx, x, y, s, col){
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x, y - s*1.55);
  ctx.lineTo(x - s*0.62, y - s*0.45);
  ctx.lineTo(x + s*0.62, y - s*0.45);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x, y - s*2.1);
  ctx.lineTo(x - s*0.42, y - s*1.15);
  ctx.lineTo(x + s*0.42, y - s*1.15);
  ctx.closePath(); ctx.fill();
}

function drawLandscape(ctx){
  const horizon = H*0.62;
  const rng = mulberry32(1337);

  /* sky */
  const sky = ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#080f2a');
  sky.addColorStop(0.30,'#1b2c58');
  sky.addColorStop(0.56,'#74477a');
  sky.addColorStop(0.78,'#dd784f');
  sky.addColorStop(1,'#ffc978');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,horizon+1);

  /* stars */
  for(let i=0;i<80;i++){
    const x = rng()*W;
    const y = rng()*horizon*0.52;
    const a = (0.12 + rng()*0.6) * (1 - y/(horizon*0.62));
    ctx.fillStyle = 'rgba(255,255,255,'+a.toFixed(3)+')';
    ctx.fillRect(x, y, 1.5, 1.5);
  }

  /* sun */
  const sunX = W*0.72, sunY = horizon - 72, sunR = 36;
  ctx.save();
  ctx.shadowColor = 'rgba(255,196,120,0.95)';
  ctx.shadowBlur = 55;
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI*2);
  ctx.fillStyle = '#ffefbb';
  ctx.fill();
  ctx.restore();

  /* mountain ridges */
  ridge(ctx, mulberry32(3),  horizon+6, 195, '#4b4a72', 6);
  ridge(ctx, mulberry32(11), horizon+6, 132, '#33355c', 9);
  ridge(ctx, mulberry32(23), horizon+6,  78, '#1f2139', 14);

  /* water */
  const water = ctx.createLinearGradient(0,horizon,0,H);
  water.addColorStop(0,'#e79a5b');
  water.addColorStop(0.12,'#a3655a');
  water.addColorStop(0.45,'#39325a');
  water.addColorStop(1,'#0f1324');
  ctx.fillStyle = water;
  ctx.fillRect(0, horizon, W, H-horizon);

  /* sun reflection on water */
  const r2 = mulberry32(99);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<46;i++){
    const y = horizon + 3 + i*2.5;
    const spread = 16 + i*1.7;
    const w = spread * (0.45 + r2()*0.95);
    ctx.fillStyle = 'rgba(255,214,150,'+(0.30*(1-i/46)).toFixed(3)+')';
    ctx.fillRect(sunX - w/2, y, w, 1.6);
  }
  ctx.restore();

  /* wave lines */
  ctx.strokeStyle = 'rgba(190,205,235,0.10)';
  ctx.lineWidth = 1;
  for(let i=0;i<26;i++){
    const y = horizon + 18 + i*6.4;
    const w = 60 + r2()*260;
    const x = r2()*(W-w);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x+w, y);
    ctx.stroke();
  }

  /* shoreline pines */
  for(let i=0;i<15;i++){
    const x = 26 + i*52 + (r2()-0.5)*22;
    const s = 13 + r2()*19;
    pine(ctx, x, horizon + 8 + r2()*4, s, '#131829');
  }

  /* birds */
  ctx.strokeStyle = 'rgba(22,26,46,0.85)';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  for(let i=0;i<6;i++){
    const bx = 90 + r2()*260;
    const by = 70 + r2()*110;
    const s = 4 + r2()*4;
    ctx.beginPath();
    ctx.moveTo(bx-s*1.6, by);
    ctx.quadraticCurveTo(bx-s*0.8, by-s*1.1, bx, by);
    ctx.quadraticCurveTo(bx+s*0.8, by-s*1.1, bx+s*1.6, by);
    ctx.stroke();
  }
}

function drawGlow(ctx){
  const sunX = W*0.72, sunY = H*0.62 - 72;
  const g = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 250);
  g.addColorStop(0,   'rgba(255,220,150,0.85)');
  g.addColorStop(0.34,'rgba(255,152,86,0.26)');
  g.addColorStop(0.68,'rgba(255,110,70,0.06)');
  g.addColorStop(1,   'rgba(255,110,70,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

/* =========================================================
   TEXT LAYER
   ========================================================= */
function drawTextLayer(){
  const L = getLayer('Text');
  if(!L) return;
  const ctx = L.ctx;
  ctx.clearRect(0,0,W,H);
  if(!textValue) return;
  ctx.save();
  ctx.font = '600 46px Georgia, "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#fff4d8';
  ctx.fillText(textValue, textPos.x, textPos.y);
  ctx.restore();
}

/* =========================================================
   COMPOSITING
   ========================================================= */
function render(){
  vctx.clearRect(0,0,W,H);
  for(let i=0;i<layers.length;i++){
    const L = layers[i];
    if(!L.visible || L.opacity <= 0) continue;
    vctx.globalAlpha = L.opacity;
    vctx.globalCompositeOperation = L.blend;
    vctx.drawImage(L.canvas,0,0);
  }
  if(previewActive){
    vctx.globalAlpha = 1;
    vctx.globalCompositeOperation = 'source-over';
    vctx.drawImage(previewC,0,0);
  }
  vctx.globalAlpha = 1;
  vctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   LAYER PANEL UI
   ========================================================= */
const EYE_SVG = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.2 10-6.2S22 12 22 12s-3.6 6.2-10 6.2S2 12 2 12z"/><circle cx="12" cy="12" r="2.7"/></svg>';
let thumbRefs = [];

function renderLayers(){
  layerList.innerHTML = '';
  thumbRefs = [];
  for(let i=layers.length-1;i>=0;i--){
    const L = layers[i];
    const row = document.createElement('div');
    row.className = 'layer-row' + (i===activeLayer?' selected':'') + (L.visible?'':' hidden-layer');
    row.dataset.i = i;
    row.innerHTML =
      '<button class="eye'+(L.visible?' on':'')+'" title="Toggle visibility">'+EYE_SVG+'</button>'+
      '<canvas class="thumb" width="56" height="34"></canvas>'+
      '<div class="linfo"><div class="lname">'+L.name+'</div>'+
      '<div class="lmeta">'+L.blendLabel+' · '+Math.round(L.opacity*100)+'%</div></div>';

    const cv = row.querySelector('.thumb');
    thumbRefs.push({cv:cv, layer:L});

    row.addEventListener('click', function(e){
      if(e.target.closest('.eye')) return;
      activeLayer = i;
      renderLayers();
      updateStatus();
    });
    row.querySelector('.eye').addEventListener('click', function(e){
      e.stopPropagation();
      L.visible = !L.visible;
      renderLayers();
      updateStatus();
    });

    layerList.appendChild(row);
  }
  document.getElementById('layerCount').textContent = layers.length;
  updateThumbs();
  syncProps();
}

function updateThumbs(){
  for(let i=0;i<thumbRefs.length;i++){
    const t = thumbRefs[i];
    const c = t.cv.getContext('2d');
    c.clearRect(0,0,56,34);
    c.fillStyle = '#0b0e12';
    c.fillRect(0,0,56,34);
    c.globalAlpha = t.layer.visible ? 1 : 0.28;
    c.drawImage(t.layer.canvas, 0, 0, 56, 34);
    c.globalAlpha = 1;
  }
}

function updateLayerMeta(i){
  const row = layerList.querySelector('.layer-row[data-i="'+i+'"]');
  if(!row) return;
  const L = layers[i];
  row.querySelector('.lmeta').textContent = L.blendLabel + ' · ' + Math.round(L.opacity*100) + '%';
  row.classList.toggle('hidden-layer', !L.visible);
}

function syncProps(){
  const L = layers[activeLayer];
  if(!L) return;
  $('opacity').value = Math.round(L.opacity*100);
  $('opacityVal').textContent = Math.round(L.opacity*100) + '%';
  $('blend').value = L.blend;
}

/* =========================================================
   TOOLS / COLOUR / STATUS
   ========================================================= */
function setTool(t){
  tool = t;
  const btns = document.querySelectorAll('.tool');
  for(let i=0;i<btns.length;i++){
    btns[i].classList.toggle('active', btns[i].dataset.tool === t);
  }
  updateStatus();
}

function setColor(c){
  color = c;
  $('colorInput').value = c;
  const sw = document.querySelectorAll('.swatches button');
  for(let i=0;i<sw.length;i++){
    sw[i].classList.toggle('sel', sw[i].dataset.c.toLowerCase() === c.toLowerCase());
  }
  updateStatus();
}

function updateStatus(){
  stTool.textContent = TOOL_NAMES[tool] || tool;
  const L = layers[activeLayer];
  stLayer.textContent = L ? L.name : '—';
  stSize.textContent = brushSize + ' px';
  stColor.style.background = color;
}

/* =========================================================
   PAINTING
   ========================================================= */
function paintSeg(from, to){
  const L = layers[activeLayer];
  if(!L) return;
  const ctx = L.ctx;
  ctx.save();
  ctx.globalCompositeOperation = (tool === 'eraser') ? 'destination-out' : 'source-over';
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  if(from){
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
  } else {
    ctx.arc(to.x, to.y, brushSize/2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawShapePreview(a, b){
  pctx.clearRect(0,0,W,H);
  pctx.save();
  pctx.strokeStyle = color;
  pctx.lineWidth = 3;
  pctx.lineJoin = 'round';
  pctx.beginPath();
  const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
  const rx = Math.abs(b.x-a.x)/2, ry = Math.abs(b.y-a.y)/2;
  if(shapeKind === 'rect'){
    pctx.rect(cx-rx, cy-ry, rx*2, ry*2);
  } else {
    pctx.ellipse(cx, cy, Math.max(rx,0.5), Math.max(ry,0.5), 0, 0, Math.PI*2);
  }
  pctx.stroke();
  pctx.restore();
}
let shapeKind = 'ellipse';

function commitPreview(){
  if(!previewActive) return;
  const L = layers[activeLayer];
  if(L) L.ctx.drawImage(previewC,0,0);
  pctx.clearRect(0,0,W,H);
  previewActive = false;
  updateThumbs();
}

/* =========================================================
   FILTERS
   ========================================================= */
const FILTER_DEFS = [
  {id:'f-blur',      key:'blur',       unit:'px', def:0},
  {id:'f-brightness',key:'brightness', unit:'%',  def:100},
  {id:'f-contrast',  key:'contrast',   unit:'%',  def:100},
  {id:'f-sepia',     key:'sepia',      unit:'%',  def:0},
  {id:'f-invert',    key:'invert',     unit:'%',  def:0}
];

function updateFilters(){
  const parts = [];
  for(let i=0;i<FILTER_DEFS.length;i++){
    const d = FILTER_DEFS[i];
    const el = $(d.id);
    const v = +el.value;
    const out = $( 'v-' + d.id.slice(2) );
    out.textContent = (d.unit === 'px' ? Math.round(v) : Math.round(v)) + (d.unit === '%' ? '%' : '');
    if(v !== d.def) parts.push(d.key + '(' + v + d.unit + ')');
  }
  view.style.filter = parts.length ? parts.join(' ') : 'none';
}

function resetFilters(){
  for(let i=0;i<FILTER_DEFS.length;i++){
    $(FILTER_DEFS[i].id).value = FILTER_DEFS[i].def;
  }
  updateFilters();
}

/* =========================================================
   COORDINATE HELPERS
   ========================================================= */
function cv2vp(x,y){
  const r = view.getBoundingClientRect();
  return { x: r.left + x * r.width / W, y: r.top + y * r.height / H };
}
function vp2cv(x,y){
  const r = view.getBoundingClientRect();
  return { x: (x - r.left) * W / r.width, y: (y - r.top) * H / r.height };
}
function sliderPoint(el, v){
  const r = el.getBoundingClientRect();
  const min = +el.min, max = +el.max;
  const f = (v - min) / (max - min);
  return { x: r.left + 10 + (r.width - 20) * f, y: r.top + r.height/2 };
}

/* =========================================================
   DOCUMENT RESET / INIT
   ========================================================= */
function initLayers(){
  layers = [];
  activeLayer = 0;
  uid = 0;
  layerCounter = 0;

  const bg    = addLayer('Landscape');
  const glow  = addLayer('Sun Glow', {blend:'screen', blendLabel:'Screen', opacity:0.9});
  const paint = addLayer('Paint');
  const text  = addLayer('Text');

  drawLandscape(bg.ctx);
  drawGlow(glow.ctx);

  activeLayer = layers.indexOf(paint);
}

function resetDoc(){
  initLayers();
  renderLayers();
  resetFilters();
  setTool('brush');
  setColor('#ffd166');
  brushSize = 10;
  textValue = '';
  textPos = {x:380, y:92};
  previewActive = false;
  pctx.clearRect(0,0,W,H);
  updateStatus();
}

/* =========================================================
   DEMO ENGINE
   ========================================================= */
const cursor = { x: window.innerWidth*0.5, y: window.innerHeight*0.52 };
let script = [];
let stepIndex = 0;
let stepElapsed = 0;

function ripple(){
  cursorEl.classList.remove('click');
  void cursorEl.offsetWidth;
  cursorEl.classList.add('click');
}
function flashEl(el){
  if(!el) return;
  el.classList.remove('flashEl');
  void el.offsetWidth;
  el.classList.add('flashEl');
}

function buildScript(){
  const S = [];
  const push = o => S.push(o);

  /* --- movement primitives --- */
  function moveTo(getTarget, dur){
    push({
      dur: dur,
      onStart(){
        const t = getTarget();
        this.sx = cursor.x; this.sy = cursor.y;
        this.tx = t.x;      this.ty = t.y;
      },
      onUpdate(p){
        const e = easeInOut(p);
        cursor.x = lerp(this.sx, this.tx, e);
        cursor.y = lerp(this.sy, this.ty, e);
      }
    });
  }

  function click(getTarget, moveDur, action){
    moveTo(getTarget, moveDur);
    push({ dur:110, onStart(){ ripple(); }, onUpdate(){} });
    push({
      dur:0,
      onStart(){
        if(action) action();
      }
    });
  }

  /* --- ui target helpers --- */
  const toolBtn = t => () => centerOf(document.querySelector('.tool[data-tool="'+t+'"]'));
  const swatch  = i => () => centerOf(document.querySelectorAll('.swatches button')[i]);
  const canvasPt = (x,y) => () => cv2vp(x,y);
  const eyeOf = i => () => {
    const el = document.querySelector('.layer-row[data-i="'+i+'"] .eye');
    return el ? centerOf(el) : centerOf(layerList);
  };
  const rowOf = i => () => {
    const el = document.querySelector('.layer-row[data-i="'+i+'"] .lname');
    return el ? centerOf(el) : centerOf(layerList);
  };
  const sliderT = (id, v) => () => sliderPoint($(id), v);

  /* --- stroke primitive --- */
  function stroke(getPath, dur, layerName, size, useTool){
    push({
      dur: dur,
      onStart(){
        this.last = null;
        if(useTool) setTool(useTool);
        if(size) brushSize = size;
        if(layerName) setActiveLayerByName(layerName);
        updateStatus();
      },
      onUpdate(p){
        const t = easeInOut(p);
        const c = getPath(t);
        const v = cv2vp(c.x, c.y);
        cursor.x = v.x; cursor.y = v.y;
        paintSeg(this.last, c);
        this.last = c;
      },
      onEnd(){ updateThumbs(); }
    });
  }

  /* --- filter drag primitive --- */
  function dragFilter(id, from, to, dur){
    push({
      dur: dur,
      onStart(){
        this.el = $(id);
        this.row = document.getElementById('r-' + id.slice(2));
        if(this.row) this.row.classList.add('flash');
        this.el.value = from;
        updateFilters();
      },
      onUpdate(p){
        const v = lerp(from, to, easeInOut(p));
        this.el.value = v;
        updateFilters();
        const pt = sliderPoint(this.el, v);
        cursor.x = pt.x; cursor.y = pt.y;
      },
      onEnd(){
        if(this.row) this.row.classList.remove('flash');
      }
    });
  }

  /* =======================================================
     TIMELINE
     ======================================================= */

  /* 0.0 – 1.2 : pick the brush */
  click(toolBtn('brush'), 1000, () => setTool('brush'));

  /* 1.2 – 1.8 : go to canvas */
  moveTo(canvasPt(80, 330), 600);

  /* 1.8 – 4.0 : paint water highlights */
  stroke(t => ({ x: 80 + t*600, y: 332 + Math.sin(t*Math.PI*3.2)*16 }), 2200, 'Paint', 10);

  /* 4.0 – 4.8 : change colour */
  click(swatch(1), 620, () => setColor('#8ee6ff'));

  /* 4.8 – 5.3 : back to canvas */
  moveTo(canvasPt(120, 400), 520);

  /* 5.3 – 7.2 : paint a second wave */
  stroke(t => ({ x: 120 + t*560, y: 396 + Math.sin(t*Math.PI*2.4)*20 }), 1900, 'Paint', 10);

  /* 7.2 – 10.0 : shape tool → ellipse ring around the sun */
  click(toolBtn('shape'), 560, () => setTool('shape'));
  push({
    dur: 1200,
    onStart(){
      setActiveLayerByName('Paint');
      previewActive = true;
      this.ax = 470; this.ay = 130; this.bx = 640; this.by = 288;
    },
    onUpdate(p){
      const e = easeInOut(p);
      const x = lerp(this.ax, this.bx, e);
      const y = lerp(this.ay, this.by, e);
      const v = cv2vp(x, y);
      cursor.x = v.x; cursor.y = v.y;
      drawShapePreview({x:this.ax, y:this.ay}, {x:x, y:y});
    },
    onEnd(){ commitPreview(); }
  });
  push({ dur:180, onStart(){ ripple(); }, onUpdate(){} });

  /* 10.0 – 13.3 : text tool → type a label */
  click(toolBtn('text'), 560, () => setTool('text'));
  click(canvasPt(textPos.x, textPos.y), 520, () => {});
  push({
    dur: 2000,
    onStart(){
      textValue = '';
      setActiveLayerByName('Text');
      drawTextLayer();
    },
    onUpdate(p){
      const full = 'GOLDEN HOUR';
      const n = Math.round(p * full.length);
      if(n !== textValue.length){
        textValue = full.slice(0, n);
        drawTextLayer();
      }
    },
    onEnd(){ updateThumbs(); }
  });

  /* 13.3 – 14.1 : add a new layer */
  click(() => centerOf($('btnAdd')), 600, () => {
    const L = addLayer('Accents');
    activeLayer = layers.length - 1;
    renderLayers();
    updateStatus();
    flashEl($('btnAdd'));
  });

  /* 14.1 – 14.9 : white-ish colour */
  click(swatch(4), 600, () => setColor('#cfe9ff'));

  /* 14.9 – 17.0 : sparkle strokes on the new layer */
  moveTo(canvasPt(120, 150), 450);
  stroke(t => ({ x: 120 + t*610, y: 148 + Math.sin(t*Math.PI*6.2)*38 }),
         1700, 'Accents', 6, 'brush');

  /* 17.0 – 19.2 : eraser */
  click(toolBtn('eraser'), 560, () => setTool('eraser'));
  moveTo(canvasPt(200, 165), 480);
  stroke(t => ({ x: 200 + t*420, y: 165 + Math.sin(t*Math.PI*2)*14 }),
         1000, 'Accents', 26, 'eraser');

  /* 19.2 – 21.0 : toggle a layer off then on */
  push({
    dur: 620,
    onStart(){
      const row = document.querySelector('.layer-row[data-i="1"]');
      if(row) flashEl(row);
    },
    onUpdate(p){
      const t = eyeOf(1)();
      cursor.x = lerp(cursor.x, t.x, easeInOut(p));
      cursor.y = lerp(cursor.y, t.y, easeInOut(p));
    }
  });
  push({ dur:120, onStart(){ ripple(); }, onUpdate(){} });
  push({
    dur:0,
    onStart(){
      const L = layers[1];
      if(L){ L.visible = false; renderLayers(); updateStatus(); }
      stMsg.textContent = 'DEMO · layer visibility toggled';
    }
  });
  push({ dur: 900, onUpdate(){} });   /* hold: glow hidden */
  push({ dur:120, onStart(){ ripple(); }, onUpdate(){} });
  push({
    dur:0,
    onStart(){
      const L = layers[1];
      if(L){ L.visible = true; renderLayers(); updateStatus(); }
      stMsg.textContent = 'DEMO · automated walkthrough running';
    }
  });

  /* 21.0 – 22.6 : reorder layers */
  click(() => centerOf($('btnDown')), 620, () => {
    const from = activeLayer;
    if(from > 0){
      const tmp = layers[from-1];
      layers[from-1] = layers[from];
      layers[from] = tmp;
      activeLayer = from - 1;
      renderLayers();
      updateStatus();
      flashEl($('btnDown'));
      stMsg.textContent = 'DEMO · layer order changed';
    }
  });

  /* 22.6 – 24.4 : blur */
  moveTo(sliderT('f-blur', 0), 600);
  dragFilter('f-blur', 0, 7, 1000);

  /* 24.4 – 26.2 : sepia */
  dragFilter('f-sepia', 0, 72, 1000);

  /* 26.2 – 27.6 : brightness */
  dragFilter('f-brightness', 100, 132, 800);

  /* 27.6 – 29.6 : invert flash */
  dragFilter('f-invert', 0, 100, 800);
  push({ dur: 420, onUpdate(){} });
  dragFilter('f-invert', 100, 0, 800);

  /* 29.6 – 30.2 : reset filters */
  click(() => centerOf($('resetFilters')), 560, () => {
    resetFilters();
    stMsg.textContent = 'DEMO · filters reset';
  });

  /* 30.2 – 31.4 : fade out -> reset -> loop */
  push({
    dur: 700,
    onUpdate(p){ cursorEl.style.opacity = String(1 - p); }
  });
  push({
    dur: 0,
    onStart(){
      resetDoc();
      cursor.x = window.innerWidth * 0.5;
      cursor.y = window.innerHeight * 0.55;
      stMsg.textContent = 'DEMO · replaying walkthrough';
    }
  });
  push({
    dur: 700,
    onUpdate(p){ cursorEl.style.opacity = String(p); }
  });

  return S;
}

function restartDemo(){
  script = buildScript();
  stepIndex = 0;
  stepElapsed = 0;
}

function updateDemo(dt){
  if(stepIndex >= script.length){
    restartDemo();
    return;
  }
  const s = script[stepIndex];
  if(!s.started){
    s.started = true;
    if(s.onStart) s.onStart();
  }
  stepElapsed += dt;
  const p = s.dur > 0 ? Math.min(1, stepElapsed / s.dur) : 1;
  if(s.onUpdate) s.onUpdate(p);
  if(p >= 1){
    if(s.onEnd) s.onEnd();
    stepIndex++;
    stepElapsed = 0;
  }
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastT = 0;
let thumbAcc = 0;

function loop(t){
  if(!lastT) lastT = t;
  const dt = Math.min(60, t - lastT);
  lastT = t;

  updateDemo(dt);
  render();

  cursorEl.style.transform = 'translate(' + cursor.x.toFixed(2) + 'px,' + cursor.y.toFixed(2) + 'px)';

  thumbAcc += dt;
  if(thumbAcc > 130){ thumbAcc = 0; updateThumbs(); }

  const cp = vp2cv(cursor.x, cursor.y);
  if(cp.x >= 0 && cp.x <= W && cp.y >= 0 && cp.y <= H){
    stPos.textContent = Math.round(cp.x) + ', ' + Math.round(cp.y);
  } else {
    stPos.textContent = '—';
  }

  requestAnimationFrame(loop);
}

/* =========================================================
   USER INTERACTION (so it really works by hand too)
   ========================================================= */
(function bindUI(){
  /* tools */
  const btns = document.querySelectorAll('.tool');
  for(let i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(){ setTool(this.dataset.tool); });
  }

  /* colour */
  $('colorInput').addEventListener('input', function(){ setColor(this.value); });
  const sw = document.querySelectorAll('.swatches button');
  for(let i=0;i<sw.length;i++){
    sw[i].addEventListener('click', function(){ setColor(this.dataset.c); });
  }

  /* layer controls */
  $('btnAdd').addEventListener('click', function(){
    layerCounter++;
    addLayer('Layer ' + (layers.length + 1));
    activeLayer = layers.length - 1;
    renderLayers();
    updateStatus();
  });
  $('btnDel').addEventListener('click', function(){
    if(layers.length <= 1) return;
    layers.splice(activeLayer, 1);
    activeLayer = clamp(activeLayer, 0, layers.length - 1);
    renderLayers();
    updateStatus();
  });
  $('btnUp').addEventListener('click', function(){
    if(activeLayer >= layers.length - 1) return;
    const tmp = layers[activeLayer+1];
    layers[activeLayer+1] = layers[activeLayer];
    layers[activeLayer] = tmp;
    activeLayer++;
    renderLayers();
    updateStatus();
  });
  $('btnDown').addEventListener('click', function(){
    if(activeLayer <= 0) return;
    const tmp = layers[activeLayer-1];
    layers[activeLayer-1] = layers[activeLayer];
    layers[activeLayer] = tmp;
    activeLayer--;
    renderLayers();
    updateStatus();
  });

  /* layer props */
  $('opacity').addEventListener('input', function(){
    const L = layers[activeLayer];
    if(!L) return;
    L.opacity = (+this.value) / 100;
    $('opacityVal').textContent = this.value + '%';
    updateLayerMeta(activeLayer);
  });
  $('blend').addEventListener('change', function(){
    const L = layers[activeLayer];
    if(!L) return;
    L.blend = this.value;
    L.blendLabel = this.options[this.selectedIndex].text;
    updateLayerMeta(activeLayer);
  });

  /* filters */
  for(let i=0;i<FILTER_DEFS.length;i++){
    $(FILTER_DEFS[i].id).addEventListener('input', updateFilters);
  }
  $('resetFilters').addEventListener('click', resetFilters);

  /* canvas drawing */
  let drawing = false, lastPt = null, shapeStart = null;

  view.addEventListener('pointerdown', function(e){
    const p = vp2cv(e.clientX, e.clientY);
    if(tool === 'brush' || tool === 'eraser'){
      drawing = true;
      lastPt = null;
      paintSeg(null, p);
      lastPt = p;
      view.setPointerCapture(e.pointerId);
    } else if(tool === 'shape'){
      drawing = true;
      shapeStart = p;
      previewActive = true;
    } else if(tool === 'text'){
      textPos = p;
      drawTextLayer();
      updateThumbs();
    }
  });

  view.addEventListener('pointermove', function(e){
    if(!drawing) return;
    const p = vp2cv(e.clientX, e.clientY);
    if(tool === 'brush' || tool === 'eraser'){
      paintSeg(lastPt, p);
      lastPt = p;
    } else if(tool === 'shape'){
      drawShapePreview(shapeStart, p);
    }
  });

  view.addEventListener('pointerup', function(){
    if(!drawing) return;
    drawing = false;
    if(tool === 'shape') commitPreview();
    updateThumbs();
  });

  window.addEventListener('resize', function(){
    /* cursor targets are recomputed each step, nothing else needed */
  });
})();

/* =========================================================
   BOOT — the show starts immediately
   ========================================================= */
resetDoc();
restartDemo();
cursorEl.style.opacity = '1';
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
